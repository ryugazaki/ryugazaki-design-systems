<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Japanese Minimal (Ma) / Checkbox and toggle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
/* theme:start */
@custom-variant dark (&:where(.dark, .dark *));

@theme {
  --color-*: initial;
  --color-bg: #F5F1E8;
  --color-surface: #FBF9F4;
  --color-ink: #24221F;
  --color-muted: #6B655C;
  --color-line: #D8D1C4;
  --color-edge: #8A8377;
  --color-accent: #B7282E;
  --color-accent-ink: #FBF9F4;

  --font-display: "Shippori Mincho", ui-serif, serif;
  --font-body: "Shippori Mincho", ui-serif, serif;
  --font-ui: "Zen Kaku Gothic New", ui-sans-serif, sans-serif;

  --text-*: initial;
  --text-xs: 0.75rem;
  --text-xs--line-height: 1.6;
  --text-sm: 0.875rem;
  --text-sm--line-height: 1.7;
  --text-base: 1rem;
  --text-base--line-height: 1.85;
  --text-lg: 1.3125rem;
  --text-lg--line-height: 1.6;
  --text-xl: 1.75rem;
  --text-xl--line-height: 1.4;
  --text-2xl: 2.3125rem;
  --text-2xl--line-height: 1.3;
  --text-display: 3.125rem;
  --text-display--line-height: 1.2;

  --radius-*: initial;
  --radius-full: 9999px;

  --shadow-*: initial;

  --ease-quiet: cubic-bezier(0.25, 0.1, 0.25, 1);
}

@layer base {
  .dark {
    --color-bg: #171614;
    --color-surface: #1F1E1B;
    --color-ink: #ECE6DA;
    --color-muted: #A59E91;
    --color-line: #36332E;
    --color-edge: #7D766B;
    --color-accent: #E46468;
    --color-accent-ink: #171614;
  }
  body {
    background: var(--color-bg);
    color: var(--color-ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
}
/* theme:end */
  </style>
</head>
<body class="p-6">
  <!-- snippet:start -->
  <div class="flex max-w-md flex-col gap-16 md:ml-10">
    <fieldset class="flex flex-col">
      <legend class="mb-4 font-ui text-xs tracking-[0.18em] text-muted">Before you arrive</legend>
      <label class="flex min-h-12 cursor-pointer items-center gap-4 border-t border-line">
        <span class="relative grid size-5 shrink-0 place-items-center">
          <input type="checkbox" name="chair" checked class="peer size-5 cursor-pointer appearance-none border border-edge bg-surface checked:border-ink focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-ink">
          <svg aria-hidden="true" viewBox="0 0 16 16" class="pointer-events-none absolute hidden size-3.5 text-accent peer-checked:block" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square"><path d="M3 8.5 6.5 12 13 4"/></svg>
        </span>
        <span class="text-base text-ink">Set a low chair in the tatami room</span>
      </label>
      <label class="flex min-h-12 cursor-pointer items-center gap-4 border-t border-line">
        <span class="relative grid size-5 shrink-0 place-items-center">
          <input type="checkbox" name="caffeine" class="peer size-5 cursor-pointer appearance-none border border-edge bg-surface checked:border-ink focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-ink">
          <svg aria-hidden="true" viewBox="0 0 16 16" class="pointer-events-none absolute hidden size-3.5 text-accent peer-checked:block" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square"><path d="M3 8.5 6.5 12 13 4"/></svg>
        </span>
        <span class="text-base text-ink">Swap matcha for a low caffeine hojicha</span>
      </label>
      <label class="flex min-h-12 cursor-pointer items-center gap-4 border-y border-line">
        <span class="relative grid size-5 shrink-0 place-items-center">
          <input type="checkbox" name="focus-demo" class="peer size-5 cursor-pointer appearance-none border border-edge bg-surface outline-2 outline-offset-4 outline-ink">
          <svg aria-hidden="true" viewBox="0 0 16 16" class="pointer-events-none absolute hidden size-3.5 text-accent peer-checked:block" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square"><path d="M3 8.5 6.5 12 13 4"/></svg>
        </span>
        <span class="text-base text-ink">Focus visible example</span>
      </label>
    </fieldset>

    <section class="flex flex-col md:ml-16">
      <h2 class="mb-4 font-ui text-xs tracking-[0.18em] text-muted">Reminders</h2>
      <div class="flex min-h-12 items-center justify-between gap-6 border-t border-line">
        <span id="sw-day" class="text-base text-ink">Email me the day before</span>
        <button type="button" role="switch" aria-checked="true" aria-labelledby="sw-day" class="group inline-flex min-h-11 w-16 shrink-0 cursor-pointer items-center justify-center focus-visible:outline-hidden">
          <span class="relative flex h-4 w-12 items-center group-focus-visible:outline-2 group-focus-visible:outline-offset-4 group-focus-visible:outline-ink">
            <span aria-hidden="true" class="h-px w-full bg-edge"></span>
            <span aria-hidden="true" class="absolute right-0 top-0 size-4 bg-accent transition-[right] duration-300 ease-quiet"></span>
          </span>
        </button>
      </div>
      <div class="flex min-h-12 items-center justify-between gap-6 border-t border-line">
        <span id="sw-season" class="text-base text-ink">Tell me when the winter course opens</span>
        <button type="button" role="switch" aria-checked="false" aria-labelledby="sw-season" class="group inline-flex min-h-11 w-16 shrink-0 cursor-pointer items-center justify-center focus-visible:outline-hidden">
          <span class="relative flex h-4 w-12 items-center group-focus-visible:outline-2 group-focus-visible:outline-offset-4 group-focus-visible:outline-ink">
            <span aria-hidden="true" class="h-px w-full bg-edge"></span>
            <span aria-hidden="true" class="absolute left-0 top-0 size-4 border border-edge bg-surface"></span>
          </span>
        </button>
      </div>
      <div class="flex min-h-12 items-center justify-between gap-6 border-y border-line">
        <span id="sw-demo" class="text-base text-ink">Focus visible example</span>
        <button type="button" role="switch" aria-checked="false" aria-labelledby="sw-demo" class="inline-flex min-h-11 w-16 shrink-0 cursor-pointer items-center justify-center focus-visible:outline-hidden">
          <span class="relative flex h-4 w-12 items-center outline-2 outline-offset-4 outline-ink">
            <span aria-hidden="true" class="h-px w-full bg-edge"></span>
            <span aria-hidden="true" class="absolute left-0 top-0 size-4 border border-edge bg-surface"></span>
          </span>
        </button>
      </div>
      <p class="mt-4 font-ui text-xs text-muted">Off, the square rests at the start of the line. On, it moves to the end and takes the hanko red.</p>
    </section>
  </div>
  <!-- snippet:end -->
</body>
</html>
