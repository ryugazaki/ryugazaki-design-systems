<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Japanese Minimal (Ma) / Input</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
/* theme:start */
@custom-variant dark (&:where(.dark, .dark *));

@theme {
  --color-*: initial;
  --color-bg: #F5F1E8;
  --color-surface: #FBF9F4;
  --color-ink: #24221F;
  --color-muted: #6B655C;
  --color-line: #D8D1C4;
  --color-edge: #8A8377;
  --color-accent: #B7282E;
  --color-accent-ink: #FBF9F4;

  --font-display: "Shippori Mincho", ui-serif, serif;
  --font-body: "Shippori Mincho", ui-serif, serif;
  --font-ui: "Zen Kaku Gothic New", ui-sans-serif, sans-serif;

  --text-*: initial;
  --text-xs: 0.75rem;
  --text-xs--line-height: 1.6;
  --text-sm: 0.875rem;
  --text-sm--line-height: 1.7;
  --text-base: 1rem;
  --text-base--line-height: 1.85;
  --text-lg: 1.3125rem;
  --text-lg--line-height: 1.6;
  --text-xl: 1.75rem;
  --text-xl--line-height: 1.4;
  --text-2xl: 2.3125rem;
  --text-2xl--line-height: 1.3;
  --text-display: 3.125rem;
  --text-display--line-height: 1.2;

  --radius-*: initial;
  --radius-full: 9999px;

  --shadow-*: initial;

  --ease-quiet: cubic-bezier(0.25, 0.1, 0.25, 1);
}

@layer base {
  .dark {
    --color-bg: #171614;
    --color-surface: #1F1E1B;
    --color-ink: #ECE6DA;
    --color-muted: #A59E91;
    --color-line: #36332E;
    --color-edge: #7D766B;
    --color-accent: #E46468;
    --color-accent-ink: #171614;
  }
  body {
    background: var(--color-bg);
    color: var(--color-ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
}
/* theme:end */
  </style>
</head>
<body class="p-6">
  <!-- snippet:start -->
  <form class="flex max-w-md flex-col gap-12 md:ml-10" action="#">
    <div class="flex flex-col gap-2">
      <label for="in-name" class="font-ui text-xs tracking-[0.18em] text-muted">Name for the reservation</label>
      <input id="in-name" name="name" type="text" autocomplete="name" value="Aiko Tanaka" aria-describedby="in-name-hint" class="min-h-11 border-b border-edge bg-transparent pb-1 font-body text-lg text-ink placeholder:text-muted focus:border-ink focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-ink">
      <p id="in-name-hint" class="font-ui text-xs text-muted">We say this name when we greet you at the door.</p>
    </div>

    <div class="flex flex-col gap-2">
      <label for="in-email" class="font-ui text-xs tracking-[0.18em] text-muted">Email</label>
      <div class="relative">
        <input id="in-email" name="email" type="email" autocomplete="email" value="aiko.tanaka@" aria-invalid="true" aria-describedby="in-email-error" class="min-h-11 w-full border-b border-edge bg-transparent pb-1 font-body text-lg text-ink focus:border-ink focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-ink">
        <span aria-hidden="true" class="pointer-events-none absolute bottom-0 left-0 h-0.5 w-10 bg-accent"></span>
      </div>
      <p id="in-email-error" class="font-ui text-xs text-ink">This address is missing the part after the @. We send the confirmation here.</p>
    </div>

    <div class="flex flex-col gap-2">
      <label for="in-note" class="font-ui text-xs tracking-[0.18em] text-muted">A note for the house</label>
      <textarea id="in-note" name="note" rows="3" aria-describedby="in-note-hint" placeholder="Allergies, a quiet corner, a reason to celebrate" class="min-h-28 resize-y border-b border-edge bg-transparent pb-1 font-body text-base text-ink placeholder:text-muted focus:border-ink focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-ink"></textarea>
      <p id="in-note-hint" class="font-ui text-xs text-muted">Optional. We read every note before you arrive.</p>
    </div>

    <div class="flex flex-col gap-2">
      <label for="in-code" class="font-ui text-xs tracking-[0.18em] text-muted">Gift card code</label>
      <input id="in-code" name="code" type="text" disabled value="Not used on the autumn course" aria-describedby="in-code-hint" class="min-h-11 cursor-not-allowed border-b border-dotted border-edge bg-transparent pb-1 font-body text-lg text-muted">
      <p id="in-code-hint" class="font-ui text-xs text-muted">Disabled. Gift cards apply to the ceramics shelf only.</p>
    </div>
  </form>
  <!-- snippet:end -->
</body>
</html>
