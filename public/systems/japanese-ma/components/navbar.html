<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Japanese Minimal (Ma) / Navbar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
/* theme:start */
@custom-variant dark (&:where(.dark, .dark *));

@theme {
  --color-*: initial;
  --color-bg: #F5F1E8;
  --color-surface: #FBF9F4;
  --color-ink: #24221F;
  --color-muted: #6B655C;
  --color-line: #D8D1C4;
  --color-edge: #8A8377;
  --color-accent: #B7282E;
  --color-accent-ink: #FBF9F4;

  --font-display: "Shippori Mincho", ui-serif, serif;
  --font-body: "Shippori Mincho", ui-serif, serif;
  --font-ui: "Zen Kaku Gothic New", ui-sans-serif, sans-serif;

  --text-*: initial;
  --text-xs: 0.75rem;
  --text-xs--line-height: 1.6;
  --text-sm: 0.875rem;
  --text-sm--line-height: 1.7;
  --text-base: 1rem;
  --text-base--line-height: 1.85;
  --text-lg: 1.3125rem;
  --text-lg--line-height: 1.6;
  --text-xl: 1.75rem;
  --text-xl--line-height: 1.4;
  --text-2xl: 2.3125rem;
  --text-2xl--line-height: 1.3;
  --text-display: 3.125rem;
  --text-display--line-height: 1.2;

  --radius-*: initial;
  --radius-full: 9999px;

  --shadow-*: initial;

  --ease-quiet: cubic-bezier(0.25, 0.1, 0.25, 1);
}

@layer base {
  .dark {
    --color-bg: #171614;
    --color-surface: #1F1E1B;
    --color-ink: #ECE6DA;
    --color-muted: #A59E91;
    --color-line: #36332E;
    --color-edge: #7D766B;
    --color-accent: #E46468;
    --color-accent-ink: #171614;
  }
  body {
    background: var(--color-bg);
    color: var(--color-ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
}
/* theme:end */
  </style>
</head>
<body class="p-6">
  <!-- snippet:start -->
  <div class="flex flex-col gap-16">
    <header class="relative flex items-center justify-between gap-4 border-b border-line pb-3">
      <a href="#" class="inline-flex min-h-11 items-center gap-2.5 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-ink">
        <span aria-hidden="true" class="size-2.5 bg-accent"></span>
        <span class="whitespace-nowrap font-display text-base font-medium sm:text-lg tracking-[0.04em] text-ink">Sumi &amp; Kiri</span>
      </a>
      <nav aria-label="Main" class="hidden md:block">
        <ul class="flex items-center gap-14">
          <li><a href="#" class="inline-flex min-h-11 items-center font-ui text-sm tracking-[0.12em] text-ink underline decoration-transparent underline-offset-8 hover:decoration-edge focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-ink">Tea course</a></li>
          <li><a href="#" class="inline-flex min-h-11 items-center font-ui text-sm tracking-[0.12em] text-ink underline decoration-transparent underline-offset-8 hover:decoration-edge focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-ink">Ceramics</a></li>
          <li><a href="#" class="inline-flex min-h-11 items-center font-ui text-sm tracking-[0.12em] text-ink underline decoration-transparent underline-offset-8 hover:decoration-edge focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-ink">Visit</a></li>
        </ul>
      </nav>
      <div class="flex items-center gap-2">
        <a href="#" class="inline-flex min-h-11 items-center border border-edge px-4 font-ui text-sm font-medium tracking-[0.06em] text-ink hover:border-ink focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-ink md:px-8 md:tracking-[0.12em]">Reserve</a>
        <details class="group md:hidden">
          <summary class="inline-flex min-h-11 cursor-pointer list-none items-center gap-1.5 px-1 font-ui text-sm tracking-[0.06em] text-ink focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-ink [&::-webkit-details-marker]:hidden">
            Menu
            <svg aria-hidden="true" viewBox="0 0 16 16" class="size-3.5 transition-transform duration-300 ease-quiet group-open:rotate-45" fill="none" stroke="currentColor" stroke-width="1"><path d="M8 2v12M2 8h12"/></svg>
          </summary>
          <nav aria-label="Main, mobile" class="absolute inset-x-0 top-full z-10 border-b border-line bg-bg">
            <ul class="flex flex-col">
              <li><a href="#" class="flex min-h-16 items-center border-t border-line font-display text-lg text-ink focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-ink">Tea course</a></li>
              <li><a href="#" class="flex min-h-16 items-center border-t border-line font-display text-lg text-ink focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-ink">Ceramics</a></li>
              <li><a href="#" class="flex min-h-16 items-center border-t border-line font-display text-lg text-ink focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-ink">Visit</a></li>
            </ul>
          </nav>
        </details>
      </div>
    </header>

    <div class="flex flex-col gap-3 md:hidden">
      <p class="font-ui text-xs tracking-[0.18em] text-muted">Mobile menu, open</p>
      <div class="relative min-h-72">
        <div class="relative flex items-center justify-between gap-4 border-b border-line pb-3">
          <a href="#" class="inline-flex min-h-11 items-center gap-2.5 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-ink">
            <span aria-hidden="true" class="size-2.5 bg-accent"></span>
            <span class="whitespace-nowrap font-display text-base font-medium sm:text-lg tracking-[0.04em] text-ink">Sumi &amp; Kiri</span>
          </a>
          <details open class="group">
            <summary class="inline-flex min-h-11 cursor-pointer list-none items-center gap-1.5 px-1 font-ui text-sm tracking-[0.06em] text-ink focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-ink [&::-webkit-details-marker]:hidden">
              Close
              <svg aria-hidden="true" viewBox="0 0 16 16" class="size-3.5 rotate-45" fill="none" stroke="currentColor" stroke-width="1"><path d="M8 2v12M2 8h12"/></svg>
            </summary>
            <nav aria-label="Main, mobile example" class="absolute inset-x-0 top-full border-b border-line bg-bg">
              <ul class="flex flex-col">
                <li><a href="#" aria-current="page" class="flex min-h-16 items-center justify-between border-t border-line font-display text-lg text-ink focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-ink">Tea course <span class="font-ui text-xs tracking-[0.18em] text-muted">You are here</span></a></li>
                <li><a href="#" class="flex min-h-16 items-center border-t border-line font-display text-lg text-ink focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-ink">Ceramics</a></li>
                <li><a href="#" class="flex min-h-16 items-center border-t border-line font-display text-lg text-ink focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-ink">Visit</a></li>
                <li class="border-t border-line pt-6"><a href="#" class="inline-flex min-h-11 items-center border border-edge px-8 font-ui text-sm font-medium tracking-[0.12em] text-ink hover:border-ink focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-ink">Reserve a seat</a></li>
              </ul>
            </nav>
          </details>
        </div>
      </div>
    </div>
  </div>
  <!-- snippet:end -->
</body>
</html>
