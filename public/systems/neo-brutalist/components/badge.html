<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neo-Brutalist / Badge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Martian+Mono:wght@400;500&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
/* theme:start */
@custom-variant dark (&:where(.dark, .dark *));

@theme {
  --color-*: initial;
  --color-bg: #FFFDF5;
  --color-surface: #FFFFFF;
  --color-ink: #111111;
  --color-muted: #4A4A44;
  --color-line: #111111;
  --color-yolk: #F4D23C;
  --color-tomato: #FF5C39;
  --color-blue: #3B5BFF;
  --color-blue-ink: #FFFFFF;
  --color-accent-ink: #111111;
  --color-success: #1F9D55;

  --font-display: "Archivo", ui-sans-serif, sans-serif;
  --font-body: "Archivo", ui-sans-serif, sans-serif;
  --font-mono: "Martian Mono", ui-monospace, monospace;

  --text-*: initial;
  --text-xs: 0.75rem;
  --text-xs--line-height: 1.4;
  --text-sm: 0.875rem;
  --text-sm--line-height: 1.45;
  --text-base: 1rem;
  --text-base--line-height: 1.55;
  --text-lg: 1.375rem;
  --text-lg--line-height: 1.3;
  --text-xl: 2rem;
  --text-xl--line-height: 1.1;
  --text-2xl: 2.8125rem;
  --text-2xl--line-height: 1;
  --text-display: 4rem;
  --text-display--line-height: 0.92;

  --radius-*: initial;
  --radius-sm: 4px;

  --shadow-*: initial;
  --shadow-hard-sm: 2px 2px 0 0 var(--color-line);
  --shadow-hard: 4px 4px 0 0 var(--color-line);
  --shadow-hard-lg: 8px 8px 0 0 var(--color-line);

  --ease-snap: cubic-bezier(0.2, 0, 0, 1);
}

@layer base {
  .dark {
    --color-bg: #121210;
    --color-surface: #1C1C19;
    --color-ink: #F5F2E8;
    --color-muted: #B8B4A6;
    --color-line: #F5F2E8;
    --color-tomato: #FF6E4E;
    --color-blue: #6F86FF;
    --color-blue-ink: #111111;
    --color-success: #3DCB7A;
  }
  body {
    background: var(--color-bg);
    color: var(--color-ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
}
/* theme:end */
  </style>
</head>
<body class="p-6">
  <!-- snippet:start -->
  <div class="flex max-w-xl flex-col gap-8">
    <section class="flex flex-col gap-3">
      <p class="font-mono text-xs uppercase text-muted">Status</p>
      <div class="flex flex-wrap items-center gap-3">
        <span class="inline-flex items-center rounded-sm border-2 border-line bg-surface px-2 py-0.5 font-mono text-xs font-medium uppercase text-ink">Queued</span>
        <span class="inline-flex items-center rounded-sm border-2 border-line bg-yolk px-2 py-0.5 font-mono text-xs font-medium uppercase text-accent-ink">Building</span>
        <span class="inline-flex items-center rounded-sm border-2 border-line bg-success px-2 py-0.5 font-mono text-xs font-medium uppercase text-accent-ink">Live</span>
        <span class="inline-flex items-center rounded-sm border-2 border-line bg-tomato px-2 py-0.5 font-mono text-xs font-medium uppercase text-accent-ink">Failed</span>
      </div>
    </section>

    <section class="flex flex-col gap-3">
      <p class="font-mono text-xs uppercase text-muted">Sticker (one per screen)</p>
      <div class="flex flex-wrap items-center gap-3 py-2">
        <span class="inline-flex -rotate-2 items-center rounded-sm border-2 border-line bg-yolk px-3 py-1 font-mono text-xs font-medium uppercase text-accent-ink shadow-hard-sm">Works on my machine</span>
      </div>
    </section>

    <section class="flex flex-col gap-3">
      <p class="font-mono text-xs uppercase text-muted">In context</p>
      <ul class="flex flex-col border-2 border-line bg-surface">
        <li class="flex flex-wrap items-center gap-x-3 gap-y-1 border-b-2 border-line px-3 py-2.5">
          <code class="font-mono text-sm text-ink">a1f9c2e</code>
          <span class="min-w-0 flex-1 truncate text-sm text-ink">Fix login redirect loop</span>
          <span class="inline-flex items-center rounded-sm border-2 border-line bg-success px-2 py-0.5 font-mono text-xs font-medium uppercase text-accent-ink">Live</span>
        </li>
        <li class="flex flex-wrap items-center gap-x-3 gap-y-1 px-3 py-2.5">
          <code class="font-mono text-sm text-ink">9b41f07</code>
          <span class="min-w-0 flex-1 truncate text-sm text-ink">Commit node_modules (sorry)</span>
          <span class="inline-flex items-center rounded-sm border-2 border-line bg-tomato px-2 py-0.5 font-mono text-xs font-medium uppercase text-accent-ink">Failed</span>
        </li>
      </ul>
    </section>
  </div>
  <!-- snippet:end -->
</body>
</html>
