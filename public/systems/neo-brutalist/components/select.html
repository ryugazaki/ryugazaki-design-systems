<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neo-Brutalist / Select</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Martian+Mono:wght@400;500&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
/* theme:start */
@custom-variant dark (&:where(.dark, .dark *));

@theme {
  --color-*: initial;
  --color-bg: #FFFDF5;
  --color-surface: #FFFFFF;
  --color-ink: #111111;
  --color-muted: #4A4A44;
  --color-line: #111111;
  --color-yolk: #F4D23C;
  --color-tomato: #FF5C39;
  --color-blue: #3B5BFF;
  --color-blue-ink: #FFFFFF;
  --color-accent-ink: #111111;
  --color-success: #1F9D55;

  --font-display: "Archivo", ui-sans-serif, sans-serif;
  --font-body: "Archivo", ui-sans-serif, sans-serif;
  --font-mono: "Martian Mono", ui-monospace, monospace;

  --text-*: initial;
  --text-xs: 0.75rem;
  --text-xs--line-height: 1.4;
  --text-sm: 0.875rem;
  --text-sm--line-height: 1.45;
  --text-base: 1rem;
  --text-base--line-height: 1.55;
  --text-lg: 1.375rem;
  --text-lg--line-height: 1.3;
  --text-xl: 2rem;
  --text-xl--line-height: 1.1;
  --text-2xl: 2.8125rem;
  --text-2xl--line-height: 1;
  --text-display: 4rem;
  --text-display--line-height: 0.92;

  --radius-*: initial;
  --radius-sm: 4px;

  --shadow-*: initial;
  --shadow-hard-sm: 2px 2px 0 0 var(--color-line);
  --shadow-hard: 4px 4px 0 0 var(--color-line);
  --shadow-hard-lg: 8px 8px 0 0 var(--color-line);

  --ease-snap: cubic-bezier(0.2, 0, 0, 1);
}

@layer base {
  .dark {
    --color-bg: #121210;
    --color-surface: #1C1C19;
    --color-ink: #F5F2E8;
    --color-muted: #B8B4A6;
    --color-line: #F5F2E8;
    --color-tomato: #FF6E4E;
    --color-blue: #6F86FF;
    --color-blue-ink: #111111;
    --color-success: #3DCB7A;
  }
  body {
    background: var(--color-bg);
    color: var(--color-ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
}
/* theme:end */
  </style>
</head>
<body class="p-6">
  <!-- snippet:start -->
  <div class="flex max-w-md flex-col gap-8">
    <section class="flex flex-col gap-3">
      <p class="font-mono text-xs uppercase text-muted">Default</p>
      <div class="flex flex-col gap-2">
        <label for="deploy-target" class="font-mono text-xs font-medium uppercase text-ink">Deploy target</label>
        <div class="relative">
          <select id="deploy-target" name="deploy-target" aria-describedby="deploy-target-hint" class="min-h-11 w-full appearance-none rounded-sm border-2 border-line bg-surface py-2 pr-14 pl-3 font-mono text-sm text-ink shadow-hard-sm focus-visible:outline-[3px] focus-visible:outline-offset-2 focus-visible:outline-blue">
            <option value="preview">preview</option>
            <option value="staging">staging</option>
            <option value="production" selected>production</option>
          </select>
          <span aria-hidden="true" class="pointer-events-none absolute inset-y-0 right-0 flex w-11 items-center justify-center border-l-2 border-line bg-yolk text-accent-ink">
            <svg viewBox="0 0 16 16" class="size-4" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square"><path d="M3 6l5 5 5-5"/></svg>
          </span>
        </div>
        <p id="deploy-target-hint" class="text-sm text-muted">Previews get their own URL and expire after 7 days.</p>
      </div>
    </section>

    <section class="flex flex-col gap-3">
      <p class="font-mono text-xs uppercase text-muted">Disabled</p>
      <div class="flex flex-col gap-2">
        <label for="runtime" class="font-mono text-xs font-medium uppercase text-muted">Runtime</label>
        <div class="relative">
          <select id="runtime" name="runtime" disabled aria-describedby="runtime-hint" class="min-h-11 w-full cursor-not-allowed appearance-none rounded-sm border-2 border-dashed border-muted bg-bg py-2 pr-14 pl-3 font-mono text-sm text-muted">
            <option>node 22</option>
          </select>
          <span aria-hidden="true" class="pointer-events-none absolute inset-y-0 right-0 flex w-11 items-center justify-center border-l-2 border-dashed border-muted text-muted">
            <svg viewBox="0 0 16 16" class="size-4" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square"><path d="M3 6l5 5 5-5"/></svg>
          </span>
        </div>
        <p id="runtime-hint" class="text-sm text-muted">Read from package.json engines. Change it there, not here.</p>
      </div>
    </section>
  </div>
  <!-- snippet:end -->
</body>
</html>
