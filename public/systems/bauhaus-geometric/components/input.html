<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bauhaus Geometric / Input</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=League+Spartan:wght@600;700;800&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
/* theme:start */
@custom-variant dark (&:where(.dark, .dark *));

@theme {
  --color-*: initial;
  --color-bg: #F2EEE3;
  --color-surface: #FBF9F4;
  --color-ink: #141414;
  --color-muted: #55524A;
  --color-line: #C9C3B4;
  --color-edge: #141414;
  --color-red: #C8211A;
  --color-red-ink: #FFFFFF;
  --color-blue: #1D4FA0;
  --color-blue-ink: #F2EEE3;
  --color-yellow: #F2C230;
  --color-yellow-ink: #141414;
  --color-wood-birch: #D9C3A0;
  --color-wood-oak: #B98E5E;
  --color-wood-ash: #2A2724;

  --font-display: "League Spartan", ui-sans-serif, sans-serif;
  --font-body: "Figtree", ui-sans-serif, sans-serif;

  --text-*: initial;
  --text-xs: 0.75rem;
  --text-xs--line-height: 1.4;
  --text-sm: 0.875rem;
  --text-sm--line-height: 1.45;
  --text-base: 1rem;
  --text-base--line-height: 1.55;
  --text-lg: 1.4375rem;
  --text-lg--line-height: 1.15;
  --text-xl: 2rem;
  --text-xl--line-height: 1;
  --text-2xl: 2.8125rem;
  --text-2xl--line-height: 0.95;
  --text-display: 5.625rem;
  --text-display--line-height: 0.88;

  --radius-*: initial;
  --radius-circle: 9999px;

  --shadow-*: initial;

  --ease-snap: cubic-bezier(0.3, 0, 0, 1);
}

@layer base {
  .dark {
    --color-bg: #121211;
    --color-surface: #1C1C1A;
    --color-ink: #F2EEE3;
    --color-muted: #ADA898;
    --color-line: #3A3934;
    --color-edge: #F2EEE3;
    --color-red: #FF5A4C;
    --color-red-ink: #121211;
    --color-blue: #7FA6F2;
    --color-blue-ink: #121211;
    --color-yellow: #F2C230;
    --color-yellow-ink: #141414;
  }
  body {
    background: var(--color-bg);
    color: var(--color-ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
}
/* theme:end */
  </style>
</head>
<body class="p-6">
  <!-- snippet:start -->
  <div class="flex max-w-md flex-col gap-8">
    <div class="flex flex-col gap-2">
      <label for="width" class="font-display text-xs font-bold uppercase tracking-[0.14em] text-ink">Wall width</label>
      <div class="flex">
        <input id="width" type="number" inputmode="numeric" value="240" aria-describedby="width-hint" class="min-h-12 w-full border-2 border-edge bg-surface px-4 text-base text-ink placeholder:text-muted focus:outline-3 focus:outline-offset-0 focus:outline-blue tabular-nums">
        <span class="flex min-h-12 items-center border-2 border-l-0 border-edge bg-ink px-4 font-display text-sm font-bold text-bg">cm</span>
      </div>
      <p id="width-hint" class="text-xs text-muted">Measure at skirting height. We fit modules in 40 cm steps.</p>
    </div>

    <div class="flex flex-col gap-2">
      <label for="postcode" class="font-display text-xs font-bold uppercase tracking-[0.14em] text-ink">Delivery postcode</label>
      <input id="postcode" type="text" inputmode="numeric" value="10437" class="min-h-12 w-full border-2 border-edge bg-surface px-4 text-base text-ink placeholder:text-muted focus:outline-3 focus:outline-offset-0 focus:outline-blue max-w-40 tabular-nums">
    </div>

    <div class="flex flex-col gap-2">
      <label for="height" class="font-display text-xs font-bold uppercase tracking-[0.14em] text-ink">Ceiling height</label>
      <div class="flex">
        <input id="height" type="number" value="190" aria-invalid="true" aria-describedby="height-error" class="min-h-12 w-full border-2 border-edge bg-surface px-4 text-base text-ink placeholder:text-muted focus:outline-3 focus:outline-offset-0 focus:outline-blue border-red tabular-nums focus:outline-red">
        <span class="flex min-h-12 items-center border-2 border-l-0 border-red bg-red px-4 font-display text-sm font-bold text-red-ink">cm</span>
      </div>
      <p id="height-error" class="flex items-start gap-2 text-xs font-semibold text-red">
        <svg aria-hidden="true" viewBox="0 0 12 12" class="mt-0.5 size-3 shrink-0"><path d="M6 0 12 12H0Z" fill="currentColor"/></svg>
        The 200 cm frame does not fit under 190 cm. Choose the 160 cm frame or measure again.
      </p>
    </div>

    <div class="flex flex-col gap-2">
      <label for="ref" class="font-display text-xs font-bold uppercase tracking-[0.14em] text-ink text-muted">Order reference</label>
      <input id="ref" type="text" disabled value="Created when you order" class="min-h-12 w-full cursor-not-allowed border-2 border-dashed border-muted bg-bg px-4 text-base text-muted">
    </div>
  </div>
  <!-- snippet:end -->
</body>
</html>
