<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bauhaus Geometric / Navbar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=League+Spartan:wght@600;700;800&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
/* theme:start */
@custom-variant dark (&:where(.dark, .dark *));

@theme {
  --color-*: initial;
  --color-bg: #F2EEE3;
  --color-surface: #FBF9F4;
  --color-ink: #141414;
  --color-muted: #55524A;
  --color-line: #C9C3B4;
  --color-edge: #141414;
  --color-red: #C8211A;
  --color-red-ink: #FFFFFF;
  --color-blue: #1D4FA0;
  --color-blue-ink: #F2EEE3;
  --color-yellow: #F2C230;
  --color-yellow-ink: #141414;
  --color-wood-birch: #D9C3A0;
  --color-wood-oak: #B98E5E;
  --color-wood-ash: #2A2724;

  --font-display: "League Spartan", ui-sans-serif, sans-serif;
  --font-body: "Figtree", ui-sans-serif, sans-serif;

  --text-*: initial;
  --text-xs: 0.75rem;
  --text-xs--line-height: 1.4;
  --text-sm: 0.875rem;
  --text-sm--line-height: 1.45;
  --text-base: 1rem;
  --text-base--line-height: 1.55;
  --text-lg: 1.4375rem;
  --text-lg--line-height: 1.15;
  --text-xl: 2rem;
  --text-xl--line-height: 1;
  --text-2xl: 2.8125rem;
  --text-2xl--line-height: 0.95;
  --text-display: 5.625rem;
  --text-display--line-height: 0.88;

  --radius-*: initial;
  --radius-circle: 9999px;

  --shadow-*: initial;

  --ease-snap: cubic-bezier(0.3, 0, 0, 1);
}

@layer base {
  .dark {
    --color-bg: #121211;
    --color-surface: #1C1C1A;
    --color-ink: #F2EEE3;
    --color-muted: #ADA898;
    --color-line: #3A3934;
    --color-edge: #F2EEE3;
    --color-red: #FF5A4C;
    --color-red-ink: #121211;
    --color-blue: #7FA6F2;
    --color-blue-ink: #121211;
    --color-yellow: #F2C230;
    --color-yellow-ink: #141414;
  }
  body {
    background: var(--color-bg);
    color: var(--color-ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
}
/* theme:end */
  </style>
</head>
<body class="p-6">
  <!-- snippet:start -->
  <header class="relative border-3 border-edge bg-surface">
    <div class="flex min-h-16 items-stretch">
      <a href="#" class="flex shrink-0 items-center gap-2.5 px-4 md:border-r-3 md:border-edge focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-blue">
        <span aria-hidden="true" class="flex items-end gap-1"><span class="size-4 rounded-circle bg-red"></span><span class="size-4 bg-blue"></span><svg viewBox="0 0 16 16" class="size-4 text-yellow"><path d="M8 0 16 16H0Z" fill="currentColor" stroke="var(--color-ink)" stroke-width="1"/></svg></span>
        <span class="font-display text-lg font-extrabold uppercase tracking-tight text-ink">Quadra</span>
      </a>
      <nav aria-label="Main" class="hidden md:flex">
        <ul class="flex">
          <li class="flex"><a href="#" aria-current="page" class="flex items-center border-r-3 border-edge bg-ink px-5 font-display text-sm font-bold uppercase tracking-[0.12em] text-bg focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-blue">Shelves</a></li>
          <li class="flex"><a href="#" class="flex items-center border-r-3 border-edge px-5 font-display text-sm font-bold uppercase tracking-[0.12em] text-ink hover:bg-bg focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-blue">Modules</a></li>
          <li class="flex"><a href="#" class="flex items-center border-r-3 border-edge px-5 font-display text-sm font-bold uppercase tracking-[0.12em] text-ink hover:bg-bg focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-blue">Finishes</a></li>
          <li class="flex"><a href="#" class="flex items-center border-r-3 border-edge px-5 font-display text-sm font-bold uppercase tracking-[0.12em] text-ink hover:bg-bg focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-blue">Studio</a></li>
        </ul>
      </nav>
      <div class="ml-auto flex items-stretch">
        <a href="#" class="flex min-w-16 items-center justify-center gap-2 border-l-3 border-edge px-4 font-display text-sm font-bold uppercase tracking-[0.12em] text-ink hover:bg-bg focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-blue">
          <span class="hidden sm:inline">Cart</span>
          <span class="grid size-7 place-items-center bg-red font-display text-sm font-bold tabular-nums text-red-ink"><span class="sr-only">items: </span>3</span>
        </a>
        <details class="group flex md:hidden">
          <summary class="flex min-w-16 cursor-pointer list-none items-center justify-center border-l-3 border-edge px-4 font-display text-sm font-bold uppercase tracking-[0.12em] text-ink focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-blue [&::-webkit-details-marker]:hidden">
            <span class="group-open:hidden">Menu</span>
            <span class="hidden group-open:inline">Close</span>
          </summary>
          <nav aria-label="Main, mobile" class="absolute inset-x-[-3px] top-full z-20 border-3 border-edge bg-surface">
            <ul class="flex flex-col">
              <li><a href="#" aria-current="page" class="flex min-h-14 items-center justify-between border-b-3 border-edge bg-ink px-4 font-display text-lg font-extrabold uppercase text-bg focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-blue">Shelves <svg aria-hidden="true" viewBox="0 0 16 16" class="size-4" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"><path d="M2 8h11M9 4l4 4-4 4"/></svg></a></li>
              <li><a href="#" class="flex min-h-14 items-center justify-between border-b-3 border-edge px-4 font-display text-lg font-extrabold uppercase text-ink focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-blue">Modules <svg aria-hidden="true" viewBox="0 0 16 16" class="size-4" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"><path d="M2 8h11M9 4l4 4-4 4"/></svg></a></li>
              <li><a href="#" class="flex min-h-14 items-center justify-between border-b-3 border-edge px-4 font-display text-lg font-extrabold uppercase text-ink focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-blue">Finishes <svg aria-hidden="true" viewBox="0 0 16 16" class="size-4" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"><path d="M2 8h11M9 4l4 4-4 4"/></svg></a></li>
              <li><a href="#" class="flex min-h-14 items-center justify-between px-4 font-display text-lg font-extrabold uppercase text-ink focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-blue">Studio <svg aria-hidden="true" viewBox="0 0 16 16" class="size-4" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"><path d="M2 8h11M9 4l4 4-4 4"/></svg></a></li>
            </ul>
          </nav>
        </details>
      </div>
    </div>
  </header>
  <!-- snippet:end -->
</body>
</html>
