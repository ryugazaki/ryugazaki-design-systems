<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bauhaus Geometric / Empty state</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=League+Spartan:wght@600;700;800&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
/* theme:start */
@custom-variant dark (&:where(.dark, .dark *));

@theme {
  --color-*: initial;
  --color-bg: #F2EEE3;
  --color-surface: #FBF9F4;
  --color-ink: #141414;
  --color-muted: #55524A;
  --color-line: #C9C3B4;
  --color-edge: #141414;
  --color-red: #C8211A;
  --color-red-ink: #FFFFFF;
  --color-blue: #1D4FA0;
  --color-blue-ink: #F2EEE3;
  --color-yellow: #F2C230;
  --color-yellow-ink: #141414;
  --color-wood-birch: #D9C3A0;
  --color-wood-oak: #B98E5E;
  --color-wood-ash: #2A2724;

  --font-display: "League Spartan", ui-sans-serif, sans-serif;
  --font-body: "Figtree", ui-sans-serif, sans-serif;

  --text-*: initial;
  --text-xs: 0.75rem;
  --text-xs--line-height: 1.4;
  --text-sm: 0.875rem;
  --text-sm--line-height: 1.45;
  --text-base: 1rem;
  --text-base--line-height: 1.55;
  --text-lg: 1.4375rem;
  --text-lg--line-height: 1.15;
  --text-xl: 2rem;
  --text-xl--line-height: 1;
  --text-2xl: 2.8125rem;
  --text-2xl--line-height: 0.95;
  --text-display: 5.625rem;
  --text-display--line-height: 0.88;

  --radius-*: initial;
  --radius-circle: 9999px;

  --shadow-*: initial;

  --ease-snap: cubic-bezier(0.3, 0, 0, 1);
}

@layer base {
  .dark {
    --color-bg: #121211;
    --color-surface: #1C1C1A;
    --color-ink: #F2EEE3;
    --color-muted: #ADA898;
    --color-line: #3A3934;
    --color-edge: #F2EEE3;
    --color-red: #FF5A4C;
    --color-red-ink: #121211;
    --color-blue: #7FA6F2;
    --color-blue-ink: #121211;
    --color-yellow: #F2C230;
    --color-yellow-ink: #141414;
  }
  body {
    background: var(--color-bg);
    color: var(--color-ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
}
/* theme:end */
  </style>
</head>
<body class="p-6">
  <!-- snippet:start -->
  <section aria-labelledby="e-title" class="grid max-w-2xl border-3 border-edge bg-surface sm:grid-cols-[12rem_1fr]">
    <div aria-hidden="true" class="relative min-h-40 border-b-3 border-edge bg-bg sm:border-r-3 sm:border-b-0">
      <div class="absolute inset-6 border-3 border-dashed border-muted"></div>
      <div class="absolute top-1/2 left-1/2 size-10 -translate-1/2 rounded-circle bg-red"></div>
    </div>
    <div class="flex flex-col items-start gap-4 p-6">
      <h2 id="e-title" class="font-display text-xl font-extrabold uppercase tracking-tight text-ink">Your shelf is empty</h2>
      <p class="max-w-sm text-base text-muted">Start with a frame. Every frame comes with four 40 cm bays you can fill with modules.</p>
      <button type="button" class="inline-flex min-h-12 items-center justify-center gap-2 border-3 border-edge px-6 font-display text-base font-bold uppercase tracking-wide transition-transform duration-100 ease-snap active:translate-x-0.5 active:translate-y-0.5 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-blue motion-reduce:transition-none bg-red text-red-ink hover:bg-ink hover:text-bg">Choose a frame</button>
    </div>
  </section>
  <!-- snippet:end -->
</body>
</html>
