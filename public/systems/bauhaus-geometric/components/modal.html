<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bauhaus Geometric / Modal and sheet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=League+Spartan:wght@600;700;800&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
/* theme:start */
@custom-variant dark (&:where(.dark, .dark *));

@theme {
  --color-*: initial;
  --color-bg: #F2EEE3;
  --color-surface: #FBF9F4;
  --color-ink: #141414;
  --color-muted: #55524A;
  --color-line: #C9C3B4;
  --color-edge: #141414;
  --color-red: #C8211A;
  --color-red-ink: #FFFFFF;
  --color-blue: #1D4FA0;
  --color-blue-ink: #F2EEE3;
  --color-yellow: #F2C230;
  --color-yellow-ink: #141414;
  --color-wood-birch: #D9C3A0;
  --color-wood-oak: #B98E5E;
  --color-wood-ash: #2A2724;

  --font-display: "League Spartan", ui-sans-serif, sans-serif;
  --font-body: "Figtree", ui-sans-serif, sans-serif;

  --text-*: initial;
  --text-xs: 0.75rem;
  --text-xs--line-height: 1.4;
  --text-sm: 0.875rem;
  --text-sm--line-height: 1.45;
  --text-base: 1rem;
  --text-base--line-height: 1.55;
  --text-lg: 1.4375rem;
  --text-lg--line-height: 1.15;
  --text-xl: 2rem;
  --text-xl--line-height: 1;
  --text-2xl: 2.8125rem;
  --text-2xl--line-height: 0.95;
  --text-display: 5.625rem;
  --text-display--line-height: 0.88;

  --radius-*: initial;
  --radius-circle: 9999px;

  --shadow-*: initial;

  --ease-snap: cubic-bezier(0.3, 0, 0, 1);
}

@layer base {
  .dark {
    --color-bg: #121211;
    --color-surface: #1C1C1A;
    --color-ink: #F2EEE3;
    --color-muted: #ADA898;
    --color-line: #3A3934;
    --color-edge: #F2EEE3;
    --color-red: #FF5A4C;
    --color-red-ink: #121211;
    --color-blue: #7FA6F2;
    --color-blue-ink: #121211;
    --color-yellow: #F2C230;
    --color-yellow-ink: #141414;
  }
  body {
    background: var(--color-bg);
    color: var(--color-ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
}
/* theme:end */
  </style>
</head>
<body class="p-6">
  <!-- snippet:start -->
  <div class="relative min-h-[34rem] border-3 border-edge bg-bg sm:min-h-[30rem]">
    <div aria-hidden="true" class="grid grid-cols-3 gap-3 p-6 opacity-40">
      <div class="aspect-square bg-blue"></div><div class="aspect-square rounded-circle bg-yellow"></div><div class="aspect-square bg-red"></div>
    </div>
    <div class="absolute inset-0 flex items-end justify-center bg-ink/60 sm:items-center sm:p-6">
      <div role="dialog" aria-modal="true" aria-labelledby="d-title" class="flex w-full max-w-md flex-col border-3 border-edge bg-surface">
        <header class="flex items-center justify-between gap-4 border-b-3 border-edge bg-blue pl-5">
          <h2 id="d-title" class="font-display text-lg font-extrabold uppercase tracking-tight text-blue-ink">Delivery</h2>
          <button type="button" aria-label="Close" class="grid size-12 place-items-center border-l-3 border-edge bg-surface text-ink hover:bg-ink hover:text-bg focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-blue">
            <svg aria-hidden="true" viewBox="0 0 16 16" class="size-4" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"><path d="m3 3 10 10M13 3 3 13"/></svg>
          </button>
        </header>
        <div class="flex flex-col gap-5 p-5">
          <p class="text-sm text-muted">Two people carry it to your room. Pick a morning or an afternoon slot.</p>
          <div class="flex flex-col gap-2">
            <label for="d-street" class="font-display text-xs font-bold uppercase tracking-[0.14em] text-ink">Street and number</label>
            <input id="d-street" type="text" value="Kastanienallee 12" class="min-h-12 w-full border-2 border-edge bg-surface px-4 text-base text-ink placeholder:text-muted focus:outline-3 focus:outline-offset-0 focus:outline-blue">
          </div>
          <div class="flex flex-col gap-2">
            <label for="d-floor" class="font-display text-xs font-bold uppercase tracking-[0.14em] text-ink">Floor, and is there a lift?</label>
            <input id="d-floor" type="text" value="4th floor, no lift" class="min-h-12 w-full border-2 border-edge bg-surface px-4 text-base text-ink placeholder:text-muted focus:outline-3 focus:outline-offset-0 focus:outline-blue">
          </div>
        </div>
        <footer class="flex flex-col-reverse border-t-3 border-edge sm:flex-row">
          <button type="button" class="min-h-14 flex-1 font-display text-base font-bold uppercase tracking-wide text-ink hover:bg-bg focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-blue">Back</button>
          <button type="button" class="min-h-14 flex-1 border-b-3 border-edge bg-red font-display text-base font-bold uppercase tracking-wide text-red-ink hover:bg-ink hover:text-bg sm:border-b-0 sm:border-l-3 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-blue">Book slot</button>
        </footer>
      </div>
    </div>
  </div>
  <!-- snippet:end -->
</body>
</html>
