<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clay Playful / Badge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
/* theme:start */
@custom-variant dark (&:where(.dark, .dark *));

@theme {
  --color-*: initial;
  --color-bg: #F6EFE6;
  --color-surface: #FFF9F2;
  --color-ink: #2B2233;
  --color-muted: #665B6C;
  --color-line: #E8DCCD;
  --color-edge: #8A7D86;
  --color-accent: #FF8A5B;
  --color-accent-text: #B4432A;
  --color-mint: #9EE0C4;
  --color-sky: #A9C9FF;
  --color-butter: #FFD96B;
  --color-on-clay: #2B2233;
  --color-clay-tint: #FFFFFFA6;
  --color-danger: #B8352A;
  --color-clay-hi: #FFFFFF8C;
  --color-clay-lo: #2B223326;

  --font-display: "Fredoka", ui-rounded, sans-serif;
  --font-body: "Nunito", ui-rounded, sans-serif;

  --text-*: initial;
  --text-xs: 0.8125rem;
  --text-xs--line-height: 1.4;
  --text-sm: 0.9375rem;
  --text-sm--line-height: 1.45;
  --text-base: 1.0625rem;
  --text-base--line-height: 1.55;
  --text-lg: 1.5rem;
  --text-lg--line-height: 1.2;
  --text-xl: 2.125rem;
  --text-xl--line-height: 1.1;
  --text-2xl: 3rem;
  --text-2xl--line-height: 1.02;
  --text-display: 4.25rem;
  --text-display--line-height: 0.98;

  --radius-*: initial;
  --radius-sm: 0.75rem;
  --radius-md: 1.25rem;
  --radius-lg: 1.75rem;
  --radius-xl: 2.5rem;
  --radius-full: 9999px;

  --shadow-*: initial;
  --shadow-clay: inset 0 -6px 0 0 var(--color-clay-lo), inset 0 4px 6px 0 var(--color-clay-hi), 0 10px 18px -10px var(--color-clay-lo);
  --shadow-clay-sm: inset 0 -3px 0 0 var(--color-clay-lo), inset 0 2px 4px 0 var(--color-clay-hi), 0 6px 10px -8px var(--color-clay-lo);
  --shadow-clay-pressed: inset 0 -1px 0 0 var(--color-clay-lo), inset 0 4px 8px 0 var(--color-clay-lo);
  --shadow-well: inset 0 3px 6px 0 var(--color-clay-lo);

  --ease-squish: cubic-bezier(0.34, 1.56, 0.64, 1);
}

@layer base {
  .dark {
    --color-bg: #1F1A25;
    --color-surface: #2B2433;
    --color-ink: #F6EFE6;
    --color-muted: #BBB0C2;
    --color-line: #3B3344;
    --color-edge: #8E8296;
    --color-accent: #FF9A70;
    --color-accent-text: #FFB08F;
    --color-mint: #8FD6B8;
    --color-sky: #9DBDF5;
    --color-butter: #F5CF5E;
    --color-on-clay: #2B2233;
    --color-clay-tint: #FFFFFF8C;
    --color-danger: #FF8F84;
    --color-clay-hi: #FFFFFF40;
    --color-clay-lo: #0000004D;
  }
  body {
    background: var(--color-bg);
    color: var(--color-ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
}
/* theme:end */
  </style>
</head>
<body class="p-6">
  <!-- snippet:start -->
  <div class="flex max-w-2xl flex-col gap-8">
    <section class="flex flex-col gap-3">
      <p class="text-sm font-bold text-muted">Categories</p>
      <div class="flex flex-wrap items-center gap-2">
        <span class="inline-flex min-h-8 items-center gap-1.5 rounded-full px-3 text-sm font-bold text-on-clay bg-mint">Phonics</span>
        <span class="inline-flex min-h-8 items-center gap-1.5 rounded-full px-3 text-sm font-bold text-on-clay bg-sky">Story time</span>
        <span class="inline-flex min-h-8 items-center gap-1.5 rounded-full px-3 text-sm font-bold text-on-clay bg-butter">Word game</span>
        <span class="inline-flex min-h-8 items-center gap-1.5 rounded-full px-3 text-sm font-bold text-on-clay border-2 border-edge text-ink">Level 2</span>
      </div>
    </section>
    <section class="flex flex-col gap-3">
      <p class="text-sm font-bold text-muted">Progress</p>
      <div class="flex flex-wrap items-center gap-2">
        <span class="inline-flex min-h-8 items-center gap-1.5 rounded-full px-3 text-sm font-bold text-on-clay bg-butter"><svg aria-hidden="true" viewBox="0 0 20 20" class="size-4"><path d="M10 1.8l2.5 5.1 5.6.8-4 3.9.9 5.6-5-2.6-5 2.6.9-5.6-4-3.9 5.6-.8Z" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg><span>12 stars</span></span>
        <span class="inline-flex min-h-8 items-center gap-1.5 rounded-full px-3 text-sm font-bold text-on-clay bg-mint"><svg aria-hidden="true" viewBox="0 0 16 16" class="size-4" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m3.5 8.5 3 3 6-7"/></svg>Done</span>
        <span class="inline-flex min-h-8 items-center rounded-full border-2 border-danger px-3 text-sm font-bold text-danger">No reading yesterday</span>
      </div>
    </section>
  </div>
  <!-- snippet:end -->
</body>
</html>
