<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clay Playful / Input</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
/* theme:start */
@custom-variant dark (&:where(.dark, .dark *));

@theme {
  --color-*: initial;
  --color-bg: #F6EFE6;
  --color-surface: #FFF9F2;
  --color-ink: #2B2233;
  --color-muted: #665B6C;
  --color-line: #E8DCCD;
  --color-edge: #8A7D86;
  --color-accent: #FF8A5B;
  --color-accent-text: #B4432A;
  --color-mint: #9EE0C4;
  --color-sky: #A9C9FF;
  --color-butter: #FFD96B;
  --color-on-clay: #2B2233;
  --color-clay-tint: #FFFFFFA6;
  --color-danger: #B8352A;
  --color-clay-hi: #FFFFFF8C;
  --color-clay-lo: #2B223326;

  --font-display: "Fredoka", ui-rounded, sans-serif;
  --font-body: "Nunito", ui-rounded, sans-serif;

  --text-*: initial;
  --text-xs: 0.8125rem;
  --text-xs--line-height: 1.4;
  --text-sm: 0.9375rem;
  --text-sm--line-height: 1.45;
  --text-base: 1.0625rem;
  --text-base--line-height: 1.55;
  --text-lg: 1.5rem;
  --text-lg--line-height: 1.2;
  --text-xl: 2.125rem;
  --text-xl--line-height: 1.1;
  --text-2xl: 3rem;
  --text-2xl--line-height: 1.02;
  --text-display: 4.25rem;
  --text-display--line-height: 0.98;

  --radius-*: initial;
  --radius-sm: 0.75rem;
  --radius-md: 1.25rem;
  --radius-lg: 1.75rem;
  --radius-xl: 2.5rem;
  --radius-full: 9999px;

  --shadow-*: initial;
  --shadow-clay: inset 0 -6px 0 0 var(--color-clay-lo), inset 0 4px 6px 0 var(--color-clay-hi), 0 10px 18px -10px var(--color-clay-lo);
  --shadow-clay-sm: inset 0 -3px 0 0 var(--color-clay-lo), inset 0 2px 4px 0 var(--color-clay-hi), 0 6px 10px -8px var(--color-clay-lo);
  --shadow-clay-pressed: inset 0 -1px 0 0 var(--color-clay-lo), inset 0 4px 8px 0 var(--color-clay-lo);
  --shadow-well: inset 0 3px 6px 0 var(--color-clay-lo);

  --ease-squish: cubic-bezier(0.34, 1.56, 0.64, 1);
}

@layer base {
  .dark {
    --color-bg: #1F1A25;
    --color-surface: #2B2433;
    --color-ink: #F6EFE6;
    --color-muted: #BBB0C2;
    --color-line: #3B3344;
    --color-edge: #8E8296;
    --color-accent: #FF9A70;
    --color-accent-text: #FFB08F;
    --color-mint: #8FD6B8;
    --color-sky: #9DBDF5;
    --color-butter: #F5CF5E;
    --color-on-clay: #2B2233;
    --color-clay-tint: #FFFFFF8C;
    --color-danger: #FF8F84;
    --color-clay-hi: #FFFFFF40;
    --color-clay-lo: #0000004D;
  }
  body {
    background: var(--color-bg);
    color: var(--color-ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
}
/* theme:end */
  </style>
</head>
<body class="p-6">
  <!-- snippet:start -->
  <div class="flex max-w-md flex-col gap-8">
    <div class="flex flex-col gap-2">
      <label for="name" class="text-sm font-bold text-ink">Child's first name</label>
      <input id="name" type="text" value="Mila" aria-describedby="name-hint" class="min-h-14 w-full rounded-md border-2 border-edge bg-surface px-5 text-base text-ink shadow-well placeholder:text-muted focus:border-accent-text focus:outline-none focus-visible:ring-3 focus-visible:ring-accent/60">
      <p id="name-hint" class="text-xs text-muted">We use it in stories. It never leaves this device.</p>
    </div>

    <div class="flex flex-col gap-2">
      <label for="spell" class="font-display text-lg font-semibold text-ink">Type the word you hear</label>
      <input id="spell" type="text" value="shp" autocapitalize="off" spellcheck="false" aria-invalid="true" aria-describedby="spell-error" class="min-h-14 w-full rounded-md border-2 border-edge bg-surface px-5 text-base text-ink shadow-well placeholder:text-muted focus:border-accent-text focus:outline-none focus-visible:ring-3 focus-visible:ring-accent/60 border-danger font-display text-xl tracking-wide">
      <p id="spell-error" class="text-sm font-bold text-danger">So close! "ship" has an i in the middle. Tap the speaker to hear it again.</p>
    </div>

    <div class="flex flex-col gap-2">
      <label for="email" class="text-sm font-bold text-ink">Grown-up's email</label>
      <input id="email" type="email" placeholder="you@example.com" class="min-h-14 w-full rounded-md border-2 border-edge bg-surface px-5 text-base text-ink shadow-well placeholder:text-muted focus:border-accent-text focus:outline-none focus-visible:ring-3 focus-visible:ring-accent/60">
    </div>

    <div class="flex flex-col gap-2">
      <label for="code" class="text-sm font-bold text-ink text-muted">Class code</label>
      <input id="code" type="text" disabled value="Ask the teacher" class="min-h-14 w-full cursor-not-allowed rounded-md border-2 border-dashed border-edge bg-bg px-5 text-base text-muted">
    </div>
  </div>
  <!-- snippet:end -->
</body>
</html>
