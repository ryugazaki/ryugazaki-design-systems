<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clay Playful / Checkbox and toggle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
/* theme:start */
@custom-variant dark (&:where(.dark, .dark *));

@theme {
  --color-*: initial;
  --color-bg: #F6EFE6;
  --color-surface: #FFF9F2;
  --color-ink: #2B2233;
  --color-muted: #665B6C;
  --color-line: #E8DCCD;
  --color-edge: #8A7D86;
  --color-accent: #FF8A5B;
  --color-accent-text: #B4432A;
  --color-mint: #9EE0C4;
  --color-sky: #A9C9FF;
  --color-butter: #FFD96B;
  --color-on-clay: #2B2233;
  --color-clay-tint: #FFFFFFA6;
  --color-danger: #B8352A;
  --color-clay-hi: #FFFFFF8C;
  --color-clay-lo: #2B223326;

  --font-display: "Fredoka", ui-rounded, sans-serif;
  --font-body: "Nunito", ui-rounded, sans-serif;

  --text-*: initial;
  --text-xs: 0.8125rem;
  --text-xs--line-height: 1.4;
  --text-sm: 0.9375rem;
  --text-sm--line-height: 1.45;
  --text-base: 1.0625rem;
  --text-base--line-height: 1.55;
  --text-lg: 1.5rem;
  --text-lg--line-height: 1.2;
  --text-xl: 2.125rem;
  --text-xl--line-height: 1.1;
  --text-2xl: 3rem;
  --text-2xl--line-height: 1.02;
  --text-display: 4.25rem;
  --text-display--line-height: 0.98;

  --radius-*: initial;
  --radius-sm: 0.75rem;
  --radius-md: 1.25rem;
  --radius-lg: 1.75rem;
  --radius-xl: 2.5rem;
  --radius-full: 9999px;

  --shadow-*: initial;
  --shadow-clay: inset 0 -6px 0 0 var(--color-clay-lo), inset 0 4px 6px 0 var(--color-clay-hi), 0 10px 18px -10px var(--color-clay-lo);
  --shadow-clay-sm: inset 0 -3px 0 0 var(--color-clay-lo), inset 0 2px 4px 0 var(--color-clay-hi), 0 6px 10px -8px var(--color-clay-lo);
  --shadow-clay-pressed: inset 0 -1px 0 0 var(--color-clay-lo), inset 0 4px 8px 0 var(--color-clay-lo);
  --shadow-well: inset 0 3px 6px 0 var(--color-clay-lo);

  --ease-squish: cubic-bezier(0.34, 1.56, 0.64, 1);
}

@layer base {
  .dark {
    --color-bg: #1F1A25;
    --color-surface: #2B2433;
    --color-ink: #F6EFE6;
    --color-muted: #BBB0C2;
    --color-line: #3B3344;
    --color-edge: #8E8296;
    --color-accent: #FF9A70;
    --color-accent-text: #FFB08F;
    --color-mint: #8FD6B8;
    --color-sky: #9DBDF5;
    --color-butter: #F5CF5E;
    --color-on-clay: #2B2233;
    --color-clay-tint: #FFFFFF8C;
    --color-danger: #FF8F84;
    --color-clay-hi: #FFFFFF40;
    --color-clay-lo: #0000004D;
  }
  body {
    background: var(--color-bg);
    color: var(--color-ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
}
/* theme:end */
  </style>
</head>
<body class="p-6">
  <!-- snippet:start -->
  <div class="flex max-w-md flex-col gap-10">
    <fieldset class="flex flex-col gap-1">
      <legend class="text-sm font-bold text-muted mb-3">Checkbox</legend>
      <label class="group flex min-h-12 cursor-pointer items-center gap-3">
        <input type="checkbox" checked class="peer sr-only">
        <span aria-hidden="true" class="grid size-7 shrink-0 place-items-center rounded-[8px] border-2 border-edge bg-surface text-on-clay shadow-well peer-checked:border-transparent peer-checked:bg-mint peer-checked:shadow-clay-sm peer-focus-visible:outline-3 peer-focus-visible:outline-offset-3 peer-focus-visible:outline-accent-text [&>svg]:opacity-0 peer-checked:[&>svg]:opacity-100">
          <svg viewBox="0 0 16 16" class="size-4" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m3.5 8.5 3 3 6-7"/></svg>
        </span>
        <span class="text-base text-ink">Read the story aloud first</span>
      </label>
      <label class="group flex min-h-12 cursor-pointer items-center gap-3">
        <input type="checkbox" class="peer sr-only">
        <span aria-hidden="true" class="grid size-7 shrink-0 place-items-center rounded-[8px] border-2 border-edge bg-surface text-on-clay shadow-well group-hover:border-ink peer-checked:border-transparent peer-checked:bg-mint peer-checked:shadow-clay-sm peer-focus-visible:outline-3 peer-focus-visible:outline-offset-3 peer-focus-visible:outline-accent-text [&>svg]:opacity-0 peer-checked:[&>svg]:opacity-100">
          <svg viewBox="0 0 16 16" class="size-4" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m3.5 8.5 3 3 6-7"/></svg>
        </span>
        <span class="text-base text-ink">Show the word under every picture</span>
      </label>
      <label class="flex min-h-12 cursor-not-allowed items-center gap-3">
        <input type="checkbox" disabled class="peer sr-only">
        <span aria-hidden="true" class="size-7 shrink-0 rounded-[8px] border-2 border-dashed border-edge"></span>
        <span class="text-base text-muted">Bedtime mode (opens at 18:00)</span>
      </label>
    </fieldset>

    <fieldset class="flex flex-col gap-2">
      <legend class="text-sm font-bold text-muted mb-3">Toggle</legend>
      <label class="flex min-h-12 cursor-pointer items-center justify-between gap-4">
        <span class="flex flex-col">
          <span class="text-base font-bold text-ink">Sounds on</span>
          <span class="text-sm text-muted">Pops, chimes, and the narrator's voice.</span>
        </span>
        <input type="checkbox" role="switch" checked class="peer sr-only">
        <span aria-hidden="true" class="relative h-9 w-16 shrink-0 rounded-full bg-line shadow-well transition-colors duration-200 peer-checked:bg-mint peer-focus-visible:outline-3 peer-focus-visible:outline-offset-3 peer-focus-visible:outline-accent-text after:absolute after:top-1 after:left-1 after:size-7 after:rounded-full after:bg-surface after:shadow-clay-sm after:transition-transform after:duration-300 after:ease-squish peer-checked:after:translate-x-7 motion-reduce:after:transition-none"></span>
      </label>
      <label class="flex min-h-12 cursor-pointer items-center justify-between gap-4">
        <span class="flex flex-col">
          <span class="text-base font-bold text-ink">Daily reminder</span>
          <span class="text-sm text-muted">A nudge for the grown-up at 17:30.</span>
        </span>
        <input type="checkbox" role="switch" class="peer sr-only">
        <span aria-hidden="true" class="relative h-9 w-16 shrink-0 rounded-full bg-line shadow-well transition-colors duration-200 peer-checked:bg-mint peer-focus-visible:outline-3 peer-focus-visible:outline-offset-3 peer-focus-visible:outline-accent-text after:absolute after:top-1 after:left-1 after:size-7 after:rounded-full after:bg-surface after:shadow-clay-sm after:transition-transform after:duration-300 after:ease-squish peer-checked:after:translate-x-7 motion-reduce:after:transition-none"></span>
      </label>
    </fieldset>
  </div>
  <!-- snippet:end -->
</body>
</html>
