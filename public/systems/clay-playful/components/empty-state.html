<!doctype html>
<html lang="en">
<head>

  <title>Clay Playful / Empty state</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
/* theme:start */
@custom-variant dark (&:where(.dark, .dark *));

@theme {
  --color-*: initial;
  --color-bg: #F6EFE6;
  --color-surface: #FFF9F2;
  --color-ink: #2B2233;
  --color-muted: #665B6C;
  --color-line: #E8DCCD;
  --color-edge: #8A7D86;
  --color-accent: #FF8A5B;
  --color-accent-text: #B4432A;
  --color-mint: #9EE0C4;
  --color-sky: #A9C9FF;
  --color-butter: #FFD96B;
  --color-on-clay: #2B2233;
  --color-clay-tint: #FFFFFFA6;
  --color-danger: #B8352A;
  --color-clay-hi: #FFFFFF8C;
  --color-clay-lo: #2B223326;

  --font-display: "Fredoka", ui-rounded, sans-serif;
  --font-body: "Nunito", ui-rounded, sans-serif;

  --text-*: initial;
  --text-xs: 0.8125rem;
  --text-xs--line-height: 1.4;
  --text-sm: 0.9375rem;
  --text-sm--line-height: 1.45;
  --text-base: 1.0625rem;
  --text-base--line-height: 1.55;
  --text-lg: 1.5rem;
  --text-lg--line-height: 1.2;
  --text-xl: 2.125rem;
  --text-xl--line-height: 1.1;
  --text-2xl: 3rem;
  --text-2xl--line-height: 1.02;
  --text-display: 4.25rem;
  --text-display--line-height: 0.98;

  --radius-*: initial;
  --radius-sm: 0.75rem;
  --radius-md: 1.25rem;
  --radius-lg: 1.75rem;
  --radius-xl: 2.5rem;
  --radius-full: 9999px;

  --shadow-*: initial;
  --shadow-clay: inset 0 -6px 0 0 var(--color-clay-lo), inset 0 4px 6px 0 var(--color-clay-hi), 0 10px 18px -10px var(--color-clay-lo);
  --shadow-clay-sm: inset 0 -3px 0 0 var(--color-clay-lo), inset 0 2px 4px 0 var(--color-clay-hi), 0 6px 10px -8px var(--color-clay-lo);
  --shadow-clay-pressed: inset 0 -1px 0 0 var(--color-clay-lo), inset 0 4px 8px 0 var(--color-clay-lo);
  --shadow-well: inset 0 3px 6px 0 var(--color-clay-lo);

  --ease-squish: cubic-bezier(0.34, 1.56, 0.64, 1);
}

@layer base {
  .dark {
    --color-bg: #1F1A25;
    --color-surface: #2B2433;
    --color-ink: #F6EFE6;
    --color-muted: #BBB0C2;
    --color-line: #3B3344;
    --color-edge: #8E8296;
    --color-accent: #FF9A70;
    --color-accent-text: #FFB08F;
    --color-mint: #8FD6B8;
    --color-sky: #9DBDF5;
    --color-butter: #F5CF5E;
    --color-on-clay: #2B2233;
    --color-clay-tint: #FFFFFF8C;
    --color-danger: #FF8F84;
    --color-clay-hi: #FFFFFF40;
    --color-clay-lo: #0000004D;
  }
  body {
    background: var(--color-bg);
    color: var(--color-ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
}
/* theme:end */
  </style>
</head>
<body class="p-6">
  <!-- snippet:start -->
  <section aria-labelledby="e-title" class="flex max-w-xl flex-col items-center gap-5 rounded-xl bg-surface px-6 py-12 text-center">
    <svg aria-hidden="true" viewBox="0 0 160 100" class="h-24 w-40"><ellipse cx="80" cy="88" rx="56" ry="7" fill="var(--color-line)"/><path d="M28 70c0-26 22-44 52-44s52 16 52 40c0 14-14 20-52 20S28 84 28 70Z" fill="var(--color-sky)" stroke="var(--color-on-clay)" stroke-width="4"/><path d="M62 60q6 5 12 0M88 60q6 5 12 0" fill="none" stroke="var(--color-on-clay)" stroke-width="4" stroke-linecap="round"/><path d="M118 22h10l-10 10h10M134 6h7l-7 7h7" fill="none" stroke="var(--color-muted)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="flex flex-col gap-2">
      <h2 id="e-title" class="font-display text-xl font-semibold text-ink">No stickers yet</h2>
      <p class="max-w-sm text-base text-muted">Finish a story to wake Pebble up. Every story gives you one sticker.</p>
    </div>
    <button type="button" class="inline-flex min-h-14 items-center justify-center gap-2 rounded-full px-7 font-display text-lg font-semibold shadow-clay transition-[transform,box-shadow,filter] duration-200 ease-squish hover:brightness-105 active:translate-y-0.5 active:shadow-clay-pressed focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-accent-text motion-reduce:transition-none bg-accent text-on-clay">Read a story</button>
  </section>
  <!-- snippet:end -->
</body>
</html>
