<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clay Playful / Bento grid</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
/* theme:start */
@custom-variant dark (&:where(.dark, .dark *));

@theme {
  --color-*: initial;
  --color-bg: #F6EFE6;
  --color-surface: #FFF9F2;
  --color-ink: #2B2233;
  --color-muted: #665B6C;
  --color-line: #E8DCCD;
  --color-edge: #8A7D86;
  --color-accent: #FF8A5B;
  --color-accent-text: #B4432A;
  --color-mint: #9EE0C4;
  --color-sky: #A9C9FF;
  --color-butter: #FFD96B;
  --color-on-clay: #2B2233;
  --color-clay-tint: #FFFFFFA6;
  --color-danger: #B8352A;
  --color-clay-hi: #FFFFFF8C;
  --color-clay-lo: #2B223326;

  --font-display: "Fredoka", ui-rounded, sans-serif;
  --font-body: "Nunito", ui-rounded, sans-serif;

  --text-*: initial;
  --text-xs: 0.8125rem;
  --text-xs--line-height: 1.4;
  --text-sm: 0.9375rem;
  --text-sm--line-height: 1.45;
  --text-base: 1.0625rem;
  --text-base--line-height: 1.55;
  --text-lg: 1.5rem;
  --text-lg--line-height: 1.2;
  --text-xl: 2.125rem;
  --text-xl--line-height: 1.1;
  --text-2xl: 3rem;
  --text-2xl--line-height: 1.02;
  --text-display: 4.25rem;
  --text-display--line-height: 0.98;

  --radius-*: initial;
  --radius-sm: 0.75rem;
  --radius-md: 1.25rem;
  --radius-lg: 1.75rem;
  --radius-xl: 2.5rem;
  --radius-full: 9999px;

  --shadow-*: initial;
  --shadow-clay: inset 0 -6px 0 0 var(--color-clay-lo), inset 0 4px 6px 0 var(--color-clay-hi), 0 10px 18px -10px var(--color-clay-lo);
  --shadow-clay-sm: inset 0 -3px 0 0 var(--color-clay-lo), inset 0 2px 4px 0 var(--color-clay-hi), 0 6px 10px -8px var(--color-clay-lo);
  --shadow-clay-pressed: inset 0 -1px 0 0 var(--color-clay-lo), inset 0 4px 8px 0 var(--color-clay-lo);
  --shadow-well: inset 0 3px 6px 0 var(--color-clay-lo);

  --ease-squish: cubic-bezier(0.34, 1.56, 0.64, 1);
}

@layer base {
  .dark {
    --color-bg: #1F1A25;
    --color-surface: #2B2433;
    --color-ink: #F6EFE6;
    --color-muted: #BBB0C2;
    --color-line: #3B3344;
    --color-edge: #8E8296;
    --color-accent: #FF9A70;
    --color-accent-text: #FFB08F;
    --color-mint: #8FD6B8;
    --color-sky: #9DBDF5;
    --color-butter: #F5CF5E;
    --color-on-clay: #2B2233;
    --color-clay-tint: #FFFFFF8C;
    --color-danger: #FF8F84;
    --color-clay-hi: #FFFFFF40;
    --color-clay-lo: #0000004D;
  }
  body {
    background: var(--color-bg);
    color: var(--color-ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
}
/* theme:end */
  </style>
</head>
<body class="p-6">
  <!-- snippet:start -->
  <div class="grid max-w-4xl grid-cols-1 gap-4 sm:grid-cols-4">
    <section aria-labelledby="b-streak" class="flex flex-col justify-between gap-6 rounded-xl bg-butter p-6 text-on-clay sm:col-span-2 sm:row-span-2">
      <h2 id="b-streak" class="font-display text-lg font-semibold">Reading streak</h2>
      <p class="flex items-baseline gap-3"><span class="font-display text-2xl font-semibold tabular-nums sm:text-display">6</span><span class="font-display text-lg font-semibold">days in a row</span></p>
      <ol class="grid grid-cols-7 gap-2" aria-label="This week">
        <li class="grid aspect-square place-items-center rounded-full bg-clay-tint font-display text-sm font-semibold">M</li>
        <li class="grid aspect-square place-items-center rounded-full bg-clay-tint font-display text-sm font-semibold">T</li>
        <li class="grid aspect-square place-items-center rounded-full bg-clay-tint font-display text-sm font-semibold">W</li>
        <li class="grid aspect-square place-items-center rounded-full bg-clay-tint font-display text-sm font-semibold">T</li>
        <li class="grid aspect-square place-items-center rounded-full bg-clay-tint font-display text-sm font-semibold">F</li>
        <li class="grid aspect-square place-items-center rounded-full bg-accent font-display text-sm font-semibold shadow-clay-sm">S<span class="sr-only">, today</span></li>
        <li class="grid aspect-square place-items-center rounded-full border-2 border-dashed border-on-clay/40 font-display text-sm font-semibold">S</li>
      </ol>
    </section>

    <a href="#" class="flex flex-col gap-2 rounded-xl bg-sky p-5 text-on-clay sm:col-span-2 shadow-clay transition-[transform,box-shadow] duration-200 ease-squish active:translate-y-0.5 active:shadow-clay-pressed motion-reduce:transition-none focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-accent-text">
      <span class="text-sm font-bold">Up next</span>
      <span class="font-display text-lg font-semibold">The fox in the box</span>
      <span class="text-sm">8 pages, about 6 minutes</span>
    </a>

    <section aria-labelledby="b-words" class="flex flex-col gap-1 rounded-xl bg-surface p-5">
      <h2 id="b-words" class="text-sm font-bold text-muted">Words learned</h2>
      <p class="font-display text-xl font-semibold tabular-nums text-ink">142</p>
      <p class="text-sm text-muted">11 this week</p>
    </section>

    <section aria-labelledby="b-stickers" class="flex flex-col gap-3 rounded-xl bg-surface p-5">
      <h2 id="b-stickers" class="text-sm font-bold text-muted">Stickers</h2>
      <ul class="flex -space-x-2">
        <li class="size-9 rounded-full border-3 border-surface bg-mint"><span class="sr-only">Frog</span></li>
        <li class="size-9 rounded-full border-3 border-surface bg-butter"><span class="sr-only">Sun</span></li>
        <li class="size-9 rounded-full border-3 border-surface bg-accent"><span class="sr-only">Fox</span></li>
        <li class="grid size-9 place-items-center rounded-full border-3 border-surface bg-line text-xs font-extrabold text-ink">+9</li>
      </ul>
    </section>

    <section aria-labelledby="b-time" class="flex flex-col gap-4 rounded-xl bg-surface p-5 sm:col-span-4">
      <h2 id="b-time" class="text-sm font-bold text-muted">Minutes read this week</h2>
      <div role="img" aria-label="Monday 14, Tuesday 8, Wednesday 0, Thursday 21, Friday 12, Saturday 9 minutes" class="flex h-28 items-end gap-3">
        <div class="flex flex-1 flex-col items-center gap-1"><span class="w-full rounded-t-md bg-sky" style="height:4.2rem"></span><span class="text-xs font-bold text-muted">Mon</span></div>
        <div class="flex flex-1 flex-col items-center gap-1"><span class="w-full rounded-t-md bg-sky" style="height:2.4rem"></span><span class="text-xs font-bold text-muted">Tue</span></div>
        <div class="flex flex-1 flex-col items-center gap-1"><span class="w-full rounded-t-md bg-line" style="height:0.3rem"></span><span class="text-xs font-bold text-muted">Wed</span></div>
        <div class="flex flex-1 flex-col items-center gap-1"><span class="w-full rounded-t-md bg-sky" style="height:6.3rem"></span><span class="text-xs font-bold text-muted">Thu</span></div>
        <div class="flex flex-1 flex-col items-center gap-1"><span class="w-full rounded-t-md bg-sky" style="height:3.6rem"></span><span class="text-xs font-bold text-muted">Fri</span></div>
        <div class="flex flex-1 flex-col items-center gap-1"><span class="w-full rounded-t-md bg-accent" style="height:2.7rem"></span><span class="text-xs font-bold text-muted">Sat</span></div>
      </div>
    </section>
  </div>
  <!-- snippet:end -->
</body>
</html>
