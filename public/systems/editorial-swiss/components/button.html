<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editorial / Swiss / Button</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&family=Libre+Franklin:wght@400;500;700&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
/* theme:start */
@custom-variant dark (&:where(.dark, .dark *));

@theme {
  --color-*: initial;
  --color-bg: #F7F4EC;
  --color-surface: #FFFDF8;
  --color-ink: #111111;
  --color-muted: #5A564C;
  --color-line: #D9D3C4;
  --color-line-strong: #111111;
  --color-accent: #1F3FBF;
  --color-accent-ink: #FFFFFF;
  --color-danger: #B3261E;
  --color-success: #2E6B3A;

  --font-display: "Newsreader", ui-serif, Georgia, serif;
  --font-body: "Newsreader", ui-serif, Georgia, serif;
  --font-ui: "Libre Franklin", ui-sans-serif, sans-serif;

  --text-*: initial;
  --text-xs: 0.8125rem;
  --text-xs--line-height: 1.4;
  --text-sm: 0.9375rem;
  --text-sm--line-height: 1.5;
  --text-base: 1.125rem;
  --text-base--line-height: 1.6;
  --text-lg: 1.6875rem;
  --text-lg--line-height: 1.25;
  --text-xl: 2.5rem;
  --text-xl--line-height: 1.1;
  --text-2xl: 3.75rem;
  --text-2xl--line-height: 1;
  --text-display: 5.625rem;
  --text-display--line-height: 0.95;

  --radius-*: initial;
  --radius-full: 9999px;
  --shadow-*: initial;
}

@layer base {
  .dark {
    --color-bg: #12110E;
    --color-surface: #1B1A16;
    --color-ink: #EDE8DC;
    --color-muted: #A39E90;
    --color-line: #3A372F;
    --color-line-strong: #EDE8DC;
    --color-accent: #8EA2FF;
    --color-accent-ink: #12110E;
    --color-danger: #F2867D;
    --color-success: #86C79A;
  }
  body {
    background: var(--color-bg);
    color: var(--color-ink);
    font-family: var(--font-body);
    font-optical-sizing: auto;
    -webkit-font-smoothing: antialiased;
  }
}
/* theme:end */
  </style>
</head>
<body class="p-6">
  <!-- snippet:start -->
  <div class="flex max-w-xl flex-col">
    <section class="flex flex-col gap-4 border-t-2 border-line-strong pt-3 pb-8">
      <p class="font-ui text-xs font-medium uppercase tracking-[0.08em] text-muted">Variants</p>
      <div class="flex flex-wrap items-center gap-x-4 gap-y-3">
        <button type="button" class="inline-flex min-h-11 items-center justify-center bg-accent px-5 font-ui text-sm font-medium text-accent-ink transition-colors duration-[120ms] ease-out hover:bg-ink hover:text-bg focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-accent">
          Subscribe
        </button>
        <button type="button" class="inline-flex min-h-11 items-center justify-center border border-ink px-5 font-ui text-sm font-medium text-ink transition-colors duration-[120ms] ease-out hover:bg-ink hover:text-bg focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-accent">
          Read the issue
        </button>
        <button type="button" class="inline-flex min-h-11 items-center px-1 font-ui text-sm font-medium text-accent underline decoration-1 underline-offset-4 hover:decoration-2 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">
          Save for later
        </button>
        <button type="button" class="inline-flex min-h-11 items-center justify-center border border-danger px-5 font-ui text-sm font-medium text-danger transition-colors duration-[120ms] ease-out hover:bg-danger hover:text-accent-ink focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-danger">
          Cancel subscription
        </button>
      </div>
    </section>

    <section class="flex flex-col gap-4 border-t border-line pt-3 pb-8">
      <p class="font-ui text-xs font-medium uppercase tracking-[0.08em] text-muted">Sizes and icon</p>
      <div class="flex flex-wrap items-center gap-x-4 gap-y-3">
        <button type="button" class="inline-flex min-h-11 items-center justify-center border border-ink px-3 font-ui text-xs font-medium uppercase tracking-[0.08em] text-ink hover:bg-ink hover:text-bg focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-accent">
          Small
        </button>
        <button type="button" class="inline-flex min-h-11 items-center justify-center border border-ink px-5 font-ui text-sm font-medium text-ink hover:bg-ink hover:text-bg focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-accent">
          Medium
        </button>
        <button type="button" class="inline-flex min-h-11 items-center justify-center gap-2.5 border border-ink px-5 font-ui text-sm font-medium text-ink hover:bg-ink hover:text-bg focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-accent">
          <svg aria-hidden="true" viewBox="0 0 16 16" class="size-4" fill="none" stroke="currentColor" stroke-width="1.25"><path d="M2.5 1.5h11v13h-11zM5 5h6M5 8h6M5 11h3.5"/></svg>
          Download the print edition
        </button>
      </div>
    </section>

    <section class="flex flex-col gap-4 border-t border-line pt-3 pb-2">
      <p class="font-ui text-xs font-medium uppercase tracking-[0.08em] text-muted">States</p>
      <div class="flex flex-wrap items-start gap-x-6 gap-y-5">
        <div class="flex flex-col gap-2">
          <button type="button" class="inline-flex min-h-11 items-center justify-center bg-accent px-5 font-ui text-sm font-medium text-accent-ink outline-2 outline-offset-4 outline-accent">
            Subscribe
          </button>
          <p class="font-ui text-xs text-muted">Focus visible, shown statically</p>
        </div>
        <div class="flex flex-col gap-2">
          <button type="button" aria-busy="true" class="inline-flex min-h-11 items-center justify-center gap-2.5 border border-ink px-5 font-ui text-sm font-medium text-ink">
            <svg aria-hidden="true" viewBox="0 0 16 16" class="size-4 animate-spin motion-reduce:animate-none" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 1.75A6.25 6.25 0 1 1 1.75 8"/></svg>
            Saving
          </button>
          <p class="font-ui text-xs text-muted">Loading</p>
        </div>
        <div class="flex flex-col gap-2">
          <button type="button" disabled class="inline-flex min-h-11 cursor-not-allowed items-center justify-center border border-dashed border-muted px-5 font-ui text-sm font-medium text-muted">
            Send to print
          </button>
          <p class="font-ui text-xs text-muted">Two footnotes still need a source.</p>
        </div>
      </div>
    </section>
  </div>
  <!-- snippet:end -->
</body>
</html>
