<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editorial / Swiss / Checkbox and toggle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&family=Libre+Franklin:wght@400;500;700&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
/* theme:start */
@custom-variant dark (&:where(.dark, .dark *));

@theme {
  --color-*: initial;
  --color-bg: #F7F4EC;
  --color-surface: #FFFDF8;
  --color-ink: #111111;
  --color-muted: #5A564C;
  --color-line: #D9D3C4;
  --color-line-strong: #111111;
  --color-accent: #1F3FBF;
  --color-accent-ink: #FFFFFF;
  --color-danger: #B3261E;
  --color-success: #2E6B3A;

  --font-display: "Newsreader", ui-serif, Georgia, serif;
  --font-body: "Newsreader", ui-serif, Georgia, serif;
  --font-ui: "Libre Franklin", ui-sans-serif, sans-serif;

  --text-*: initial;
  --text-xs: 0.8125rem;
  --text-xs--line-height: 1.4;
  --text-sm: 0.9375rem;
  --text-sm--line-height: 1.5;
  --text-base: 1.125rem;
  --text-base--line-height: 1.6;
  --text-lg: 1.6875rem;
  --text-lg--line-height: 1.25;
  --text-xl: 2.5rem;
  --text-xl--line-height: 1.1;
  --text-2xl: 3.75rem;
  --text-2xl--line-height: 1;
  --text-display: 5.625rem;
  --text-display--line-height: 0.95;

  --radius-*: initial;
  --radius-full: 9999px;
  --shadow-*: initial;
}

@layer base {
  .dark {
    --color-bg: #12110E;
    --color-surface: #1B1A16;
    --color-ink: #EDE8DC;
    --color-muted: #A39E90;
    --color-line: #3A372F;
    --color-line-strong: #EDE8DC;
    --color-accent: #8EA2FF;
    --color-accent-ink: #12110E;
    --color-danger: #F2867D;
    --color-success: #86C79A;
  }
  body {
    background: var(--color-bg);
    color: var(--color-ink);
    font-family: var(--font-body);
    font-optical-sizing: auto;
    -webkit-font-smoothing: antialiased;
  }
}
/* theme:end */
  </style>
</head>
<body class="p-6">
  <!-- snippet:start -->
  <div class="flex max-w-md flex-col gap-10">
    <section class="flex flex-col gap-2 border-t-2 border-line-strong pt-3">
      <p class="font-ui text-xs font-medium uppercase tracking-[0.08em] text-muted">Checkbox, checked and unchecked</p>
      <div class="flex flex-col divide-y divide-line">
        <label class="flex min-h-11 cursor-pointer items-start gap-3 py-3">
          <span class="relative mt-1 inline-flex size-5 shrink-0">
            <input type="checkbox" name="footnotes-inline" checked class="peer size-5 cursor-pointer appearance-none border border-ink bg-surface focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">
            <svg aria-hidden="true" viewBox="0 0 16 16" class="pointer-events-none absolute inset-0 m-auto hidden size-3.5 text-accent peer-checked:block" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M2.5 8.5l3.5 3.5 7.5-8"/></svg>
          </span>
          <span class="flex flex-col gap-0.5">
            <span class="font-body text-base text-ink">Show footnotes beside the text</span>
            <span class="font-ui text-xs text-muted">On wide screens, notes sit in the margin instead of the end.</span>
          </span>
        </label>
        <label class="flex min-h-11 cursor-pointer items-start gap-3 py-3">
          <span class="relative mt-1 inline-flex size-5 shrink-0">
            <input type="checkbox" name="corrections" class="peer size-5 cursor-pointer appearance-none border border-ink bg-surface focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">
            <svg aria-hidden="true" viewBox="0 0 16 16" class="pointer-events-none absolute inset-0 m-auto hidden size-3.5 text-accent peer-checked:block" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M2.5 8.5l3.5 3.5 7.5-8"/></svg>
          </span>
          <span class="flex flex-col gap-0.5">
            <span class="font-body text-base text-ink">Email me when a story I read is corrected</span>
            <span class="font-ui text-xs text-muted">About twice a year. We print every correction.</span>
          </span>
        </label>
      </div>
    </section>

    <section class="flex flex-col gap-2 border-t-2 border-line-strong pt-3">
      <p class="font-ui text-xs font-medium uppercase tracking-[0.08em] text-muted">Switch, on and off</p>
      <div class="flex flex-col divide-y divide-line">
        <button type="button" role="switch" aria-checked="true" class="flex min-h-14 w-full items-center justify-between gap-4 py-3 text-left focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">
          <span class="flex flex-col gap-0.5">
            <span class="font-body text-base text-ink">Reading mode</span>
            <span class="font-ui text-xs text-muted">Hides the masthead while you scroll</span>
          </span>
          <span aria-hidden="true" class="flex h-5 w-9 shrink-0 items-center justify-end rounded-full bg-accent px-0.5 transition-colors duration-[120ms] ease-out">
            <span class="size-4 rounded-full bg-surface"></span>
          </span>
        </button>
        <button type="button" role="switch" aria-checked="false" class="flex min-h-14 w-full items-center justify-between gap-4 py-3 text-left focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">
          <span class="flex flex-col gap-0.5">
            <span class="font-body text-base text-ink">Audio edition</span>
            <span class="font-ui text-xs text-muted">Adds a narrated version to each long read</span>
          </span>
          <span aria-hidden="true" class="flex h-5 w-9 shrink-0 items-center justify-start rounded-full border border-ink px-0.5 transition-colors duration-[120ms] ease-out">
            <span class="size-3.5 rounded-full bg-ink"></span>
          </span>
        </button>
      </div>
    </section>
  </div>
  <!-- snippet:end -->
</body>
</html>
