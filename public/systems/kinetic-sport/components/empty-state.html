<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kinetic Sport / Empty state</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Big+Shoulders+Display:wght@700;800;900&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
/* theme:start */
@custom-variant dark (&:where(.dark, .dark *));

@theme {
  --color-*: initial;
  --color-bg: #F2F2EC;
  --color-surface: #FBFBF6;
  --color-ink: #0D0D0C;
  --color-muted: #57574F;
  --color-line: #CFCFC5;
  --color-edge: #6E6E66;
  --color-accent: #C6F432;
  --color-accent-ink: #0D0D0C;
  --color-hot: #C2321A;
  --color-hot-ink: #FBFBF6;

  --font-display: "Big Shoulders Display", ui-sans-serif, sans-serif;
  --font-body: "Barlow", ui-sans-serif, sans-serif;

  --text-*: initial;
  --text-xs: 0.75rem;
  --text-xs--line-height: 1.4;
  --text-sm: 0.875rem;
  --text-sm--line-height: 1.45;
  --text-base: 1rem;
  --text-base--line-height: 1.55;
  --text-lg: 1.625rem;
  --text-lg--line-height: 1.1;
  --text-xl: 2.625rem;
  --text-xl--line-height: 0.95;
  --text-2xl: 4.25rem;
  --text-2xl--line-height: 0.9;
  --text-display: 6.875rem;
  --text-display--line-height: 0.85;

  --radius-*: initial;
  --shadow-*: initial;

  --ease-sprint: cubic-bezier(0.2, 0.9, 0.1, 1);
}

@utility bg-stripes { background-image: repeating-linear-gradient(-45deg, currentColor 0 6px, transparent 6px 14px); }

@layer base {
  .dark {
    --color-bg: #0D0D0C;
    --color-surface: #171716;
    --color-ink: #F2F2EC;
    --color-muted: #A3A39A;
    --color-line: #2E2E2B;
    --color-edge: #7A7A72;
    --color-accent: #C6F432;
    --color-accent-ink: #0D0D0C;
    --color-hot: #FF4D2E;
    --color-hot-ink: #0D0D0C;
  }
  body {
    background: var(--color-bg);
    color: var(--color-ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
}
/* theme:end */
  </style>
</head>
<body class="p-6">
  <!-- snippet:start -->
  <section aria-labelledby="empty-title" class="max-w-xl border-2 border-ink bg-surface">
    <div aria-hidden="true" class="h-16 border-b-2 border-ink bg-stripes text-line"></div>
    <div class="flex flex-col items-start gap-4 p-5 md:p-7">
      <p class="text-xs font-semibold uppercase tracking-[0.14em] text-muted">Old Town 10K results</p>
      <h2 id="empty-title" class="font-display text-xl font-black uppercase tracking-tight text-ink md:text-2xl">No results yet</h2>
      <p class="text-base text-ink">The race starts Sun 15 Nov at 08:30, and results go up here by noon.</p>
      <a href="#" class="group inline-flex min-h-12 items-center justify-center bg-accent px-6 font-display text-lg font-extrabold uppercase tracking-wide text-accent-ink focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ink">
        <span class="inline-block transition-transform duration-150 ease-sprint group-hover:translate-x-0.5 motion-reduce:transition-none">Email me the results</span>
      </a>
    </div>
  </section>
  <!-- snippet:end -->
</body>
</html>
