<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kinetic Sport / Checkbox and toggle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Big+Shoulders+Display:wght@700;800;900&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
/* theme:start */
@custom-variant dark (&:where(.dark, .dark *));

@theme {
  --color-*: initial;
  --color-bg: #F2F2EC;
  --color-surface: #FBFBF6;
  --color-ink: #0D0D0C;
  --color-muted: #57574F;
  --color-line: #CFCFC5;
  --color-edge: #6E6E66;
  --color-accent: #C6F432;
  --color-accent-ink: #0D0D0C;
  --color-hot: #C2321A;
  --color-hot-ink: #FBFBF6;

  --font-display: "Big Shoulders Display", ui-sans-serif, sans-serif;
  --font-body: "Barlow", ui-sans-serif, sans-serif;

  --text-*: initial;
  --text-xs: 0.75rem;
  --text-xs--line-height: 1.4;
  --text-sm: 0.875rem;
  --text-sm--line-height: 1.45;
  --text-base: 1rem;
  --text-base--line-height: 1.55;
  --text-lg: 1.625rem;
  --text-lg--line-height: 1.1;
  --text-xl: 2.625rem;
  --text-xl--line-height: 0.95;
  --text-2xl: 4.25rem;
  --text-2xl--line-height: 0.9;
  --text-display: 6.875rem;
  --text-display--line-height: 0.85;

  --radius-*: initial;
  --shadow-*: initial;

  --ease-sprint: cubic-bezier(0.2, 0.9, 0.1, 1);
}

@utility bg-stripes { background-image: repeating-linear-gradient(-45deg, currentColor 0 6px, transparent 6px 14px); }

@layer base {
  .dark {
    --color-bg: #0D0D0C;
    --color-surface: #171716;
    --color-ink: #F2F2EC;
    --color-muted: #A3A39A;
    --color-line: #2E2E2B;
    --color-edge: #7A7A72;
    --color-accent: #C6F432;
    --color-accent-ink: #0D0D0C;
    --color-hot: #FF4D2E;
    --color-hot-ink: #0D0D0C;
  }
  body {
    background: var(--color-bg);
    color: var(--color-ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
}
/* theme:end */
  </style>
</head>
<body class="p-6">
  <!-- snippet:start -->
  <div class="flex max-w-md flex-col gap-10">
    <fieldset class="flex flex-col gap-1">
      <legend class="mb-3 text-xs font-semibold uppercase tracking-[0.14em] text-muted">Race day emails</legend>
      <label class="flex min-h-11 cursor-pointer items-center gap-3">
        <span class="relative inline-flex size-6 shrink-0">
          <input type="checkbox" name="splits" checked class="peer size-6 cursor-pointer appearance-none border-2 border-edge bg-surface checked:border-ink checked:bg-accent hover:border-ink focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ink dark:checked:border-accent">
          <svg aria-hidden="true" viewBox="0 0 24 24" class="pointer-events-none absolute inset-0 hidden size-6 text-accent-ink peer-checked:block" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square"><path d="M6 12.5l4 4 8-9"/></svg>
        </span>
        <span class="text-base text-ink">Send my 5 km split and finish time</span>
      </label>
      <label class="flex min-h-11 cursor-pointer items-center gap-3">
        <span class="relative inline-flex size-6 shrink-0">
          <input type="checkbox" name="photos" class="peer size-6 cursor-pointer appearance-none border-2 border-edge bg-surface checked:border-ink checked:bg-accent hover:border-ink focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ink dark:checked:border-accent">
          <svg aria-hidden="true" viewBox="0 0 24 24" class="pointer-events-none absolute inset-0 hidden size-6 text-accent-ink peer-checked:block" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square"><path d="M6 12.5l4 4 8-9"/></svg>
        </span>
        <span class="text-base text-ink">Send finish line photos</span>
      </label>
    </fieldset>

    <section class="flex flex-col gap-1">
      <p class="mb-3 text-xs font-semibold uppercase tracking-[0.14em] text-muted">Results page</p>
      <button type="button" role="switch" aria-checked="true" class="group inline-flex min-h-11 items-center gap-4 self-start text-left focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ink">
        <span aria-hidden="true" class="flex h-8 w-14 shrink-0 items-center justify-end border-2 border-accent-ink bg-accent-ink p-1 dark:border-edge">
          <span class="size-5 bg-accent"></span>
        </span>
        <span class="flex flex-col">
          <span class="text-base font-semibold text-ink">Show my splits</span>
          <span class="text-sm text-muted">On. Splits are public.</span>
        </span>
      </button>
      <button type="button" role="switch" aria-checked="false" class="group inline-flex min-h-11 items-center gap-4 self-start text-left focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ink">
        <span aria-hidden="true" class="flex h-8 w-14 shrink-0 items-center justify-start border-2 border-edge bg-surface p-1 group-hover:border-ink">
          <span class="size-5 bg-edge"></span>
        </span>
        <span class="flex flex-col">
          <span class="text-base font-semibold text-ink">Hide my age group</span>
          <span class="text-sm text-muted">Off. Your category shows next to your name.</span>
        </span>
      </button>
    </section>
  </div>
  <!-- snippet:end -->
</body>
</html>
