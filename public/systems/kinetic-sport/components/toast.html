<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kinetic Sport / Toast</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Big+Shoulders+Display:wght@700;800;900&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
/* theme:start */
@custom-variant dark (&:where(.dark, .dark *));

@theme {
  --color-*: initial;
  --color-bg: #F2F2EC;
  --color-surface: #FBFBF6;
  --color-ink: #0D0D0C;
  --color-muted: #57574F;
  --color-line: #CFCFC5;
  --color-edge: #6E6E66;
  --color-accent: #C6F432;
  --color-accent-ink: #0D0D0C;
  --color-hot: #C2321A;
  --color-hot-ink: #FBFBF6;

  --font-display: "Big Shoulders Display", ui-sans-serif, sans-serif;
  --font-body: "Barlow", ui-sans-serif, sans-serif;

  --text-*: initial;
  --text-xs: 0.75rem;
  --text-xs--line-height: 1.4;
  --text-sm: 0.875rem;
  --text-sm--line-height: 1.45;
  --text-base: 1rem;
  --text-base--line-height: 1.55;
  --text-lg: 1.625rem;
  --text-lg--line-height: 1.1;
  --text-xl: 2.625rem;
  --text-xl--line-height: 0.95;
  --text-2xl: 4.25rem;
  --text-2xl--line-height: 0.9;
  --text-display: 6.875rem;
  --text-display--line-height: 0.85;

  --radius-*: initial;
  --shadow-*: initial;

  --ease-sprint: cubic-bezier(0.2, 0.9, 0.1, 1);
}

@utility bg-stripes { background-image: repeating-linear-gradient(-45deg, currentColor 0 6px, transparent 6px 14px); }

@layer base {
  .dark {
    --color-bg: #0D0D0C;
    --color-surface: #171716;
    --color-ink: #F2F2EC;
    --color-muted: #A3A39A;
    --color-line: #2E2E2B;
    --color-edge: #7A7A72;
    --color-accent: #C6F432;
    --color-accent-ink: #0D0D0C;
    --color-hot: #FF4D2E;
    --color-hot-ink: #0D0D0C;
  }
  body {
    background: var(--color-bg);
    color: var(--color-ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
}
/* theme:end */
  </style>
</head>
<body class="p-6">
  <!-- snippet:start -->
  <div class="flex max-w-lg flex-col gap-4">
    <div role="status" class="flex items-stretch border-2 border-ink bg-surface">
      <div class="flex flex-1 flex-col gap-2 py-3 pl-4">
        <div class="flex flex-wrap items-center gap-x-3 gap-y-1">
          <span class="mx-1 inline-flex -skew-x-12 items-center border-2 border-ink bg-ink px-2 py-0.5"><span class="inline-block skew-x-12 text-xs font-bold uppercase tracking-[0.12em] text-bg">Saved</span></span>
          <span class="font-display text-lg font-black tabular-nums text-ink">12:04</span>
        </div>
        <p class="text-sm text-ink">Splits for Harbour 10K added to your profile: 22:02 and 22:18.</p>
      </div>
      <button type="button" aria-label="Dismiss" class="inline-flex w-11 min-h-11 shrink-0 items-start justify-center pt-3 text-ink hover:bg-bg focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-ink">
        <svg aria-hidden="true" viewBox="0 0 16 16" class="size-4" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"><path d="M3 3l10 10M13 3L3 13"/></svg>
      </button>
    </div>

    <div role="status" class="flex items-stretch border-2 border-hot bg-surface">
      <div aria-hidden="true" class="w-2 shrink-0 bg-hot"></div>
      <div class="flex flex-1 flex-col gap-2 py-3 pl-4">
        <div class="flex flex-wrap items-center gap-x-3 gap-y-1">
          <span class="mx-1 inline-flex -skew-x-12 items-center border-2 border-hot bg-hot px-2 py-0.5"><span class="inline-block skew-x-12 text-xs font-bold uppercase tracking-[0.12em] text-hot-ink">No result</span></span>
          <span class="font-display text-lg font-black tabular-nums text-ink">12:06</span>
        </div>
        <p class="text-sm text-ink">Bib 381 did not start the Harbour 10K. Check the number printed on your bib.</p>
      </div>
      <button type="button" aria-label="Dismiss" class="inline-flex w-11 min-h-11 shrink-0 items-start justify-center pt-3 text-ink hover:bg-bg focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-ink">
        <svg aria-hidden="true" viewBox="0 0 16 16" class="size-4" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"><path d="M3 3l10 10M13 3L3 13"/></svg>
      </button>
    </div>
  </div>
  <!-- snippet:end -->
</body>
</html>
