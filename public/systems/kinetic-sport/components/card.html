<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kinetic Sport / Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Big+Shoulders+Display:wght@700;800;900&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
/* theme:start */
@custom-variant dark (&:where(.dark, .dark *));

@theme {
  --color-*: initial;
  --color-bg: #F2F2EC;
  --color-surface: #FBFBF6;
  --color-ink: #0D0D0C;
  --color-muted: #57574F;
  --color-line: #CFCFC5;
  --color-edge: #6E6E66;
  --color-accent: #C6F432;
  --color-accent-ink: #0D0D0C;
  --color-hot: #C2321A;
  --color-hot-ink: #FBFBF6;

  --font-display: "Big Shoulders Display", ui-sans-serif, sans-serif;
  --font-body: "Barlow", ui-sans-serif, sans-serif;

  --text-*: initial;
  --text-xs: 0.75rem;
  --text-xs--line-height: 1.4;
  --text-sm: 0.875rem;
  --text-sm--line-height: 1.45;
  --text-base: 1rem;
  --text-base--line-height: 1.55;
  --text-lg: 1.625rem;
  --text-lg--line-height: 1.1;
  --text-xl: 2.625rem;
  --text-xl--line-height: 0.95;
  --text-2xl: 4.25rem;
  --text-2xl--line-height: 0.9;
  --text-display: 6.875rem;
  --text-display--line-height: 0.85;

  --radius-*: initial;
  --shadow-*: initial;

  --ease-sprint: cubic-bezier(0.2, 0.9, 0.1, 1);
}

@utility bg-stripes { background-image: repeating-linear-gradient(-45deg, currentColor 0 6px, transparent 6px 14px); }

@layer base {
  .dark {
    --color-bg: #0D0D0C;
    --color-surface: #171716;
    --color-ink: #F2F2EC;
    --color-muted: #A3A39A;
    --color-line: #2E2E2B;
    --color-edge: #7A7A72;
    --color-accent: #C6F432;
    --color-accent-ink: #0D0D0C;
    --color-hot: #FF4D2E;
    --color-hot-ink: #0D0D0C;
  }
  body {
    background: var(--color-bg);
    color: var(--color-ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
}
/* theme:end */
  </style>
</head>
<body class="p-6">
  <!-- snippet:start -->
  <div class="flex max-w-3xl flex-col items-start gap-8 md:flex-row">
    <article aria-labelledby="result-name" class="w-full max-w-md border-2 border-ink bg-surface">
      <div aria-hidden="true" class="h-5 border-b-2 border-ink bg-accent bg-stripes text-accent-ink"></div>
      <div class="flex flex-col gap-6 p-5 md:p-6">
        <div class="flex flex-wrap items-start justify-between gap-3">
          <div class="flex flex-col gap-1">
            <p class="text-xs font-semibold uppercase tracking-[0.14em] text-muted">Harbour 10K, Sun 18 Oct 2026</p>
            <h2 id="result-name" class="font-display text-xl font-black uppercase tracking-tight text-ink">Ana Ruiz</h2>
            <p class="text-sm tabular-nums text-muted">Bib 318</p>
          </div>
          <div class="flex gap-1">
            <span class="mx-1 inline-flex -skew-x-12 items-center border-2 border-ink px-2 py-0.5"><span class="inline-block skew-x-12 text-xs font-bold uppercase tracking-[0.12em] text-ink">W40</span></span>
            <span class="mx-1 inline-flex -skew-x-12 items-center border-2 border-ink bg-ink px-2 py-0.5"><span class="inline-block skew-x-12 text-xs font-bold uppercase tracking-[0.12em] text-bg">PB</span></span>
          </div>
        </div>

        <div class="flex flex-col gap-1 border-y-2 border-ink py-4">
          <p class="text-xs font-semibold uppercase tracking-[0.14em] text-muted">Chip time</p>
          <p class="font-display text-2xl leading-[1.2] font-black tabular-nums tracking-tight text-ink md:text-display">44:20</p>
          <p class="text-sm text-muted">50 s faster than her Canal 10K in August.</p>
        </div>

        <dl class="grid grid-cols-3 gap-4">
          <div class="flex flex-col gap-1">
            <dt class="text-xs font-semibold uppercase tracking-[0.14em] text-muted">Overall</dt>
            <dd class="font-display text-lg font-black tabular-nums text-ink">112<span class="text-muted">/412</span></dd>
          </div>
          <div class="flex flex-col gap-1">
            <dt class="text-xs font-semibold uppercase tracking-[0.14em] text-muted">In W40</dt>
            <dd class="font-display text-lg font-black tabular-nums text-ink">9<span class="text-muted">/58</span></dd>
          </div>
          <div class="flex flex-col gap-1">
            <dt class="text-xs font-semibold uppercase tracking-[0.14em] text-muted">Pace</dt>
            <dd class="font-display text-lg font-black tabular-nums text-ink">4:26<span class="text-sm font-bold text-muted"> /km</span></dd>
          </div>
        </dl>

        <div class="flex flex-wrap items-center justify-between gap-3">
          <p class="text-sm tabular-nums text-muted">5 km 22:02, second 5 km 22:18</p>
          <a href="#" class="group inline-flex min-h-11 items-center gap-2 text-sm font-bold uppercase tracking-[0.12em] text-ink underline-offset-4 hover:underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ink">
            <span class="inline-block transition-transform duration-150 ease-sprint group-hover:translate-x-0.5 motion-reduce:transition-none">All splits</span>
            <svg aria-hidden="true" viewBox="0 0 16 16" class="size-4" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"><path d="M2 8h11M9 4l4 4-4 4"/></svg>
          </a>
        </div>
      </div>
    </article>

    <article aria-labelledby="compact-title" class="flex w-full max-w-xs border-2 border-line bg-surface">
      <div aria-hidden="true" class="w-3 shrink-0 border-r-2 border-line bg-stripes text-edge"></div>
      <div class="flex flex-1 flex-col gap-2 p-4">
        <p class="text-xs font-semibold uppercase tracking-[0.14em] text-muted">Previous race</p>
        <h3 id="compact-title" class="font-display text-lg font-black uppercase tracking-tight text-ink">Canal 10K, Sun 16 Aug</h3>
        <p class="font-display text-xl font-black tabular-nums text-ink">45:10</p>
        <p class="text-sm tabular-nums text-muted">131 of 388, 4:31 /km</p>
      </div>
    </article>
  </div>
  <!-- snippet:end -->
</body>
</html>
