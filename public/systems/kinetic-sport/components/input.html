<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kinetic Sport / Input</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Big+Shoulders+Display:wght@700;800;900&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
/* theme:start */
@custom-variant dark (&:where(.dark, .dark *));

@theme {
  --color-*: initial;
  --color-bg: #F2F2EC;
  --color-surface: #FBFBF6;
  --color-ink: #0D0D0C;
  --color-muted: #57574F;
  --color-line: #CFCFC5;
  --color-edge: #6E6E66;
  --color-accent: #C6F432;
  --color-accent-ink: #0D0D0C;
  --color-hot: #C2321A;
  --color-hot-ink: #FBFBF6;

  --font-display: "Big Shoulders Display", ui-sans-serif, sans-serif;
  --font-body: "Barlow", ui-sans-serif, sans-serif;

  --text-*: initial;
  --text-xs: 0.75rem;
  --text-xs--line-height: 1.4;
  --text-sm: 0.875rem;
  --text-sm--line-height: 1.45;
  --text-base: 1rem;
  --text-base--line-height: 1.55;
  --text-lg: 1.625rem;
  --text-lg--line-height: 1.1;
  --text-xl: 2.625rem;
  --text-xl--line-height: 0.95;
  --text-2xl: 4.25rem;
  --text-2xl--line-height: 0.9;
  --text-display: 6.875rem;
  --text-display--line-height: 0.85;

  --radius-*: initial;
  --shadow-*: initial;

  --ease-sprint: cubic-bezier(0.2, 0.9, 0.1, 1);
}

@utility bg-stripes { background-image: repeating-linear-gradient(-45deg, currentColor 0 6px, transparent 6px 14px); }

@layer base {
  .dark {
    --color-bg: #0D0D0C;
    --color-surface: #171716;
    --color-ink: #F2F2EC;
    --color-muted: #A3A39A;
    --color-line: #2E2E2B;
    --color-edge: #7A7A72;
    --color-accent: #C6F432;
    --color-accent-ink: #0D0D0C;
    --color-hot: #FF4D2E;
    --color-hot-ink: #0D0D0C;
  }
  body {
    background: var(--color-bg);
    color: var(--color-ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
}
/* theme:end */
  </style>
</head>
<body class="p-6">
  <!-- snippet:start -->
  <form class="flex max-w-md flex-col gap-8" action="#" novalidate>
    <div class="flex flex-col gap-2">
      <label for="bib" class="text-xs font-semibold uppercase tracking-[0.14em] text-ink">Bib number</label>
      <input id="bib" name="bib" type="text" inputmode="numeric" value="318" aria-describedby="bib-hint" class="min-h-12 w-full border-2 border-edge bg-surface px-3 font-display text-lg font-extrabold tabular-nums tracking-wide text-ink placeholder:text-muted hover:border-ink focus-visible:border-ink focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ink">
      <p id="bib-hint" class="text-sm text-muted">Three digits, printed above the timing chip.</p>
    </div>

    <div class="flex flex-col gap-2">
      <label for="target" class="text-xs font-semibold uppercase tracking-[0.14em] text-ink">Target finish</label>
      <input id="target" name="target" type="text" value="44.20" aria-invalid="true" aria-describedby="target-error" class="min-h-12 w-full border-2 border-hot bg-surface px-3 font-display text-lg font-extrabold tabular-nums tracking-wide text-ink focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-hot">
      <p id="target-error" class="flex items-start gap-2 text-sm font-semibold text-hot">
        <svg aria-hidden="true" viewBox="0 0 16 16" class="mt-0.5 size-4 shrink-0" fill="currentColor"><path d="M8 1 15 14H1Z"/><path d="M7.25 6h1.5v4h-1.5zM7.25 11h1.5v1.5h-1.5z" class="fill-surface"/></svg>
        Use minutes and seconds with a colon, like 44:20.
      </p>
    </div>

    <div class="flex flex-col gap-2">
      <label for="notes" class="text-xs font-semibold uppercase tracking-[0.14em] text-ink">Note for the timing team</label>
      <textarea id="notes" name="notes" rows="4" aria-describedby="notes-hint" class="min-h-28 w-full border-2 border-edge bg-surface px-3 py-2.5 text-base text-ink hover:border-ink focus-visible:border-ink focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ink">My chip did not beep at the 5 km mat. Watch shows 22:02 there.</textarea>
      <p id="notes-hint" class="text-sm text-muted">We reply within two days of the race.</p>
    </div>

    <div class="flex flex-col gap-2">
      <label for="wave" class="text-xs font-semibold uppercase tracking-[0.14em] text-muted">Start wave</label>
      <input id="wave" name="wave" type="text" value="Wave B, 08:40" disabled aria-describedby="wave-hint" class="min-h-12 w-full cursor-not-allowed border-2 border-dashed border-edge bg-bg px-3 text-base tabular-nums text-muted">
      <p id="wave-hint" class="text-sm text-muted">Waves are set from your best 10K time.</p>
    </div>
  </form>
  <!-- snippet:end -->
</body>
</html>
