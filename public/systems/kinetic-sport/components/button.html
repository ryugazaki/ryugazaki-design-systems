<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kinetic Sport / Button</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Big+Shoulders+Display:wght@700;800;900&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
/* theme:start */
@custom-variant dark (&:where(.dark, .dark *));

@theme {
  --color-*: initial;
  --color-bg: #F2F2EC;
  --color-surface: #FBFBF6;
  --color-ink: #0D0D0C;
  --color-muted: #57574F;
  --color-line: #CFCFC5;
  --color-edge: #6E6E66;
  --color-accent: #C6F432;
  --color-accent-ink: #0D0D0C;
  --color-hot: #C2321A;
  --color-hot-ink: #FBFBF6;

  --font-display: "Big Shoulders Display", ui-sans-serif, sans-serif;
  --font-body: "Barlow", ui-sans-serif, sans-serif;

  --text-*: initial;
  --text-xs: 0.75rem;
  --text-xs--line-height: 1.4;
  --text-sm: 0.875rem;
  --text-sm--line-height: 1.45;
  --text-base: 1rem;
  --text-base--line-height: 1.55;
  --text-lg: 1.625rem;
  --text-lg--line-height: 1.1;
  --text-xl: 2.625rem;
  --text-xl--line-height: 0.95;
  --text-2xl: 4.25rem;
  --text-2xl--line-height: 0.9;
  --text-display: 6.875rem;
  --text-display--line-height: 0.85;

  --radius-*: initial;
  --shadow-*: initial;

  --ease-sprint: cubic-bezier(0.2, 0.9, 0.1, 1);
}

@utility bg-stripes { background-image: repeating-linear-gradient(-45deg, currentColor 0 6px, transparent 6px 14px); }

@layer base {
  .dark {
    --color-bg: #0D0D0C;
    --color-surface: #171716;
    --color-ink: #F2F2EC;
    --color-muted: #A3A39A;
    --color-line: #2E2E2B;
    --color-edge: #7A7A72;
    --color-accent: #C6F432;
    --color-accent-ink: #0D0D0C;
    --color-hot: #FF4D2E;
    --color-hot-ink: #0D0D0C;
  }
  body {
    background: var(--color-bg);
    color: var(--color-ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
}
/* theme:end */
  </style>
</head>
<body class="p-6">
  <!-- snippet:start -->
  <div class="flex max-w-2xl flex-col gap-10">
    <section class="flex flex-col gap-4">
      <p class="text-xs font-semibold uppercase tracking-[0.14em] text-muted">Variants</p>
      <div class="flex flex-wrap items-center gap-x-4 gap-y-3">
        <button type="button" class="group inline-flex min-h-12 items-center justify-center bg-accent px-6 font-display text-lg font-extrabold uppercase tracking-wide text-accent-ink focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ink">
          <span class="inline-block transition-transform duration-150 ease-sprint group-hover:translate-x-0.5 motion-reduce:transition-none">Register</span>
        </button>
        <button type="button" class="group inline-flex min-h-12 items-center justify-center border-2 border-ink px-6 font-display text-lg font-extrabold uppercase tracking-wide text-ink hover:bg-ink hover:text-bg focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ink">
          <span class="inline-block transition-transform duration-150 ease-sprint group-hover:translate-x-0.5 motion-reduce:transition-none">View results</span>
        </button>
        <a href="#" class="group inline-flex min-h-11 items-center gap-2 text-sm font-bold uppercase tracking-[0.12em] text-ink underline-offset-4 hover:underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ink">
          <span class="inline-block transition-transform duration-150 ease-sprint group-hover:translate-x-0.5 motion-reduce:transition-none">Course map</span>
          <svg aria-hidden="true" viewBox="0 0 16 16" class="size-4" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"><path d="M2 8h11M9 4l4 4-4 4"/></svg>
        </a>
        <button type="button" class="group inline-flex min-h-12 items-center justify-center bg-hot px-6 font-display text-lg font-extrabold uppercase tracking-wide text-hot-ink focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ink">
          <span class="inline-block transition-transform duration-150 ease-sprint group-hover:translate-x-0.5 motion-reduce:transition-none">Withdraw entry</span>
        </button>
      </div>
    </section>

    <section class="flex flex-col gap-4">
      <p class="text-xs font-semibold uppercase tracking-[0.14em] text-muted">Sizes and icon</p>
      <div class="flex flex-wrap items-center gap-x-4 gap-y-3">
        <button type="button" class="group inline-flex min-h-11 items-center justify-center bg-accent px-4 font-display text-base font-extrabold uppercase tracking-wide text-accent-ink focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ink">
          <span class="inline-block transition-transform duration-150 ease-sprint group-hover:translate-x-0.5 motion-reduce:transition-none">Small</span>
        </button>
        <button type="button" class="group inline-flex min-h-12 items-center justify-center bg-accent px-6 font-display text-lg font-extrabold uppercase tracking-wide text-accent-ink focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ink">
          <span class="inline-block transition-transform duration-150 ease-sprint group-hover:translate-x-0.5 motion-reduce:transition-none">Medium</span>
        </button>
        <button type="button" class="group inline-flex min-h-12 items-center justify-center gap-3 border-2 border-ink px-5 font-display text-lg font-extrabold uppercase tracking-wide text-ink hover:bg-ink hover:text-bg focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ink">
          <svg aria-hidden="true" viewBox="0 0 20 20" class="size-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M8 1.5h4M10 1.5v2.5"/><rect x="3" y="4.5" width="14" height="14"/><path d="M10 8v4l2.5 2"/></svg>
          <span class="inline-block transition-transform duration-150 ease-sprint group-hover:translate-x-0.5 motion-reduce:transition-none">Add to calendar</span>
        </button>
      </div>
    </section>

    <section class="flex flex-col gap-4">
      <p class="text-xs font-semibold uppercase tracking-[0.14em] text-muted">States</p>
      <div class="flex flex-wrap items-start gap-x-6 gap-y-5">
        <div class="flex flex-col gap-2">
          <button type="button" class="inline-flex min-h-12 items-center justify-center bg-accent px-6 font-display text-lg font-extrabold uppercase tracking-wide text-accent-ink outline-2 outline-offset-2 outline-ink">
            Register
          </button>
          <p class="text-xs text-muted">Focus visible, shown statically.</p>
        </div>
        <div class="flex flex-col gap-2">
          <button type="button" aria-busy="true" class="inline-flex min-h-12 cursor-progress items-center justify-center gap-3 bg-accent px-6 font-display text-lg font-extrabold uppercase tracking-wide text-accent-ink focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ink">
            <svg aria-hidden="true" viewBox="0 0 20 20" class="size-5 animate-spin motion-reduce:animate-none" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square"><path d="M10 2a8 8 0 1 1-8 8"/></svg>
            Saving
          </button>
          <p class="text-xs text-muted">Busy, still focusable.</p>
        </div>
        <div class="flex flex-col gap-2">
          <button type="button" disabled class="inline-flex min-h-12 cursor-not-allowed items-center justify-center border-2 border-dashed border-edge px-6 font-display text-lg font-extrabold uppercase tracking-wide text-muted">
            Transfer entry
          </button>
          <p class="max-w-56 text-xs text-muted">Enter the new runner's bib number to transfer this entry.</p>
        </div>
      </div>
    </section>
  </div>
  <!-- snippet:end -->
</body>
</html>
