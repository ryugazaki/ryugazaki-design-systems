<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kinetic Sport / Badge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Big+Shoulders+Display:wght@700;800;900&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
/* theme:start */
@custom-variant dark (&:where(.dark, .dark *));

@theme {
  --color-*: initial;
  --color-bg: #F2F2EC;
  --color-surface: #FBFBF6;
  --color-ink: #0D0D0C;
  --color-muted: #57574F;
  --color-line: #CFCFC5;
  --color-edge: #6E6E66;
  --color-accent: #C6F432;
  --color-accent-ink: #0D0D0C;
  --color-hot: #C2321A;
  --color-hot-ink: #FBFBF6;

  --font-display: "Big Shoulders Display", ui-sans-serif, sans-serif;
  --font-body: "Barlow", ui-sans-serif, sans-serif;

  --text-*: initial;
  --text-xs: 0.75rem;
  --text-xs--line-height: 1.4;
  --text-sm: 0.875rem;
  --text-sm--line-height: 1.45;
  --text-base: 1rem;
  --text-base--line-height: 1.55;
  --text-lg: 1.625rem;
  --text-lg--line-height: 1.1;
  --text-xl: 2.625rem;
  --text-xl--line-height: 0.95;
  --text-2xl: 4.25rem;
  --text-2xl--line-height: 0.9;
  --text-display: 6.875rem;
  --text-display--line-height: 0.85;

  --radius-*: initial;
  --shadow-*: initial;

  --ease-sprint: cubic-bezier(0.2, 0.9, 0.1, 1);
}

@utility bg-stripes { background-image: repeating-linear-gradient(-45deg, currentColor 0 6px, transparent 6px 14px); }

@layer base {
  .dark {
    --color-bg: #0D0D0C;
    --color-surface: #171716;
    --color-ink: #F2F2EC;
    --color-muted: #A3A39A;
    --color-line: #2E2E2B;
    --color-edge: #7A7A72;
    --color-accent: #C6F432;
    --color-accent-ink: #0D0D0C;
    --color-hot: #FF4D2E;
    --color-hot-ink: #0D0D0C;
  }
  body {
    background: var(--color-bg);
    color: var(--color-ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
}
/* theme:end */
  </style>
</head>
<body class="p-6">
  <!-- snippet:start -->
  <div class="flex max-w-2xl flex-col gap-10">
    <section class="flex flex-col gap-4">
      <p class="text-xs font-semibold uppercase tracking-[0.14em] text-muted">Set</p>
      <ul class="flex flex-wrap items-center gap-x-4 gap-y-3">
        <li class="flex flex-col items-start gap-2">
          <span class="mx-1 inline-flex -skew-x-12 items-center border-2 border-ink px-2.5 py-0.5"><span class="inline-block skew-x-12 text-xs font-bold uppercase tracking-[0.12em] text-ink">W40</span></span>
          <span class="text-xs text-muted">Category</span>
        </li>
        <li class="flex flex-col items-start gap-2">
          <span class="mx-1 inline-flex -skew-x-12 items-center border-2 border-accent bg-accent px-2.5 py-0.5"><span class="inline-block skew-x-12 text-xs font-bold uppercase tracking-[0.12em] text-accent-ink">Leader</span></span>
          <span class="text-xs text-muted">Accent</span>
        </li>
        <li class="flex flex-col items-start gap-2">
          <span class="mx-1 inline-flex -skew-x-12 items-center border-2 border-ink bg-ink px-2.5 py-0.5"><span class="inline-block skew-x-12 text-xs font-bold uppercase tracking-[0.12em] text-bg">PB</span></span>
          <span class="text-xs text-muted">Success</span>
        </li>
        <li class="flex flex-col items-start gap-2">
          <span class="mx-1 inline-flex -skew-x-12 items-center border-2 border-hot px-2.5 py-0.5"><span class="inline-block skew-x-12 text-xs font-bold uppercase tracking-[0.12em] text-hot">DNF</span></span>
          <span class="text-xs text-muted">Danger</span>
        </li>
        <li class="flex flex-col items-start gap-2">
          <span class="mx-1 inline-flex -skew-x-12 items-center gap-1.5 border-2 border-hot bg-hot px-2.5 py-0.5"><span class="inline-flex skew-x-12 items-center gap-1.5 text-xs font-bold uppercase tracking-[0.12em] text-hot-ink"><span aria-hidden="true" class="size-1.5 bg-hot-ink"></span>Live</span></span>
          <span class="text-xs text-muted">Race clock running</span>
        </li>
      </ul>
    </section>

    <section class="flex flex-col gap-4">
      <p class="text-xs font-semibold uppercase tracking-[0.14em] text-muted">In a results row</p>
      <ul class="flex flex-col border-t-2 border-ink">
        <li class="flex flex-wrap items-center gap-x-3 gap-y-2 border-b border-line py-3">
          <span class="w-8 font-display text-lg font-black tabular-nums text-ink">1</span>
          <span class="font-semibold text-ink">Tomas Reyes</span>
          <span class="mx-1 inline-flex -skew-x-12 items-center border-2 border-accent bg-accent px-2 py-0.5"><span class="inline-block skew-x-12 text-xs font-bold uppercase tracking-[0.12em] text-accent-ink">Leader</span></span>
          <span class="ml-auto font-display text-lg font-black tabular-nums text-ink">31:00</span>
        </li>
        <li class="flex flex-wrap items-center gap-x-3 gap-y-2 border-b border-line py-3">
          <span class="w-8 font-display text-lg font-black tabular-nums text-ink">10</span>
          <span class="font-semibold text-ink">Hana Kovac</span>
          <span class="mx-1 inline-flex -skew-x-12 items-center border-2 border-ink px-2 py-0.5"><span class="inline-block skew-x-12 text-xs font-bold uppercase tracking-[0.12em] text-ink">W40</span></span>
          <span class="ml-auto font-display text-lg font-black tabular-nums text-ink">34:30</span>
        </li>
        <li class="flex flex-wrap items-center gap-x-3 gap-y-2 border-b border-line py-3">
          <span class="w-8 font-display text-lg font-black text-muted"><span aria-hidden="true">/</span><span class="sr-only">No rank</span></span>
          <span class="font-semibold text-ink">Owen Price</span>
          <span class="mx-1 inline-flex -skew-x-12 items-center border-2 border-hot px-2 py-0.5"><span class="inline-block skew-x-12 text-xs font-bold uppercase tracking-[0.12em] text-hot">DNF</span></span>
          <span class="ml-auto text-sm text-muted">Stopped at 6 km</span>
        </li>
      </ul>
    </section>
  </div>
  <!-- snippet:end -->
</body>
</html>
