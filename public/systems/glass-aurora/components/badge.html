<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glass Aurora / Badge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
/* theme:start */
@custom-variant dark (&:where(.dark, .dark *));

@theme {
  --color-*: initial;
  --color-bg: #EDF1F6;
  --color-surface: #FFFFFF;
  --color-glass: #FFFFFFB8;
  --color-glass-edge: #FFFFFFCC;
  --color-scrim: #0B122066;
  --color-ink: #0B1220;
  --color-muted: #475266;
  --color-line: #D3DAE4;
  --color-edge: #6A7688;
  --color-accent: #0A7A55;
  --color-accent-ink: #FFFFFF;
  --color-danger: #B4232F;
  --color-aurora-a: #3EE6A8;
  --color-aurora-b: #4CC9F0;
  --color-aurora-c: #F0609E;

  --font-display: "Unbounded", ui-sans-serif, sans-serif;
  --font-body: "Manrope", ui-sans-serif, sans-serif;

  --text-*: initial;
  --text-xs: 0.75rem;
  --text-xs--line-height: 1.45;
  --text-sm: 0.875rem;
  --text-sm--line-height: 1.5;
  --text-base: 1rem;
  --text-base--line-height: 1.6;
  --text-lg: 1.5rem;
  --text-lg--line-height: 1.25;
  --text-xl: 2.25rem;
  --text-xl--line-height: 1.1;
  --text-2xl: 3.375rem;
  --text-2xl--line-height: 1.02;
  --text-display: 5rem;
  --text-display--line-height: 0.98;

  --radius-*: initial;
  --radius-sm: 0.625rem;
  --radius-md: 1rem;
  --radius-lg: 1.5rem;
  --radius-full: 9999px;

  --shadow-*: initial;
  --shadow-pane: inset 0 1px 0 0 var(--color-glass-edge), 0 18px 40px -24px rgb(3 8 20 / 0.55);

  --ease-drift: cubic-bezier(0.22, 1, 0.36, 1);
}

@utility aurora-sky { background-color: var(--color-bg); background-image: radial-gradient(70% 90% at 15% 0%, color-mix(in oklab, var(--color-aurora-a) 50%, transparent), transparent 70%), radial-gradient(55% 80% at 60% 0%, color-mix(in oklab, var(--color-aurora-b) 40%, transparent), transparent 70%), radial-gradient(45% 70% at 95% 10%, color-mix(in oklab, var(--color-aurora-c) 32%, transparent), transparent 70%); }

@utility glass-pane { background-color: var(--color-glass); -webkit-backdrop-filter: blur(18px) saturate(150%); backdrop-filter: blur(18px) saturate(150%); @supports not (backdrop-filter: blur(1px)) { background-color: var(--color-surface); } @media (prefers-reduced-transparency: reduce) { background-color: var(--color-surface); backdrop-filter: none; } }

@utility glass-scrim { background-color: var(--color-scrim); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); @media (prefers-reduced-transparency: reduce) { backdrop-filter: none; } }

@layer base {
  .dark {
    --color-bg: #070B14;
    --color-surface: #101828;
    --color-glass: #0E1524B8;
    --color-glass-edge: #FFFFFF1F;
    --color-scrim: #03060DA6;
    --color-ink: #EAF0F7;
    --color-muted: #A3AFC2;
    --color-line: #1F2A3D;
    --color-edge: #6B7A90;
    --color-accent: #3EE6A8;
    --color-accent-ink: #03130D;
    --color-danger: #FF8A94;
    --color-aurora-a: #3EE6A8;
    --color-aurora-b: #4CC9F0;
    --color-aurora-c: #F0609E;
  }
  body {
    background: var(--color-bg);
    color: var(--color-ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
}
/* theme:end */
  </style>
</head>
<body class="p-6">
  <!-- snippet:start -->
  <div class="flex max-w-2xl flex-col gap-8">
    <section class="flex flex-col gap-3">
      <p class="text-xs font-semibold uppercase tracking-[0.16em] text-muted">Forecast</p>
      <div class="flex flex-wrap items-center gap-2">
        <span class="inline-flex min-h-7 items-center gap-1.5 rounded-full border border-accent px-3 text-xs font-bold text-accent"><span aria-hidden="true" class="size-1.5 rounded-full bg-accent"></span>Kp 5, strong</span>
        <span class="inline-flex min-h-7 items-center gap-1.5 rounded-full border border-edge px-3 text-xs font-semibold text-ink">Kp 2, quiet</span>
        <span class="inline-flex min-h-7 items-center rounded-full border border-edge px-3 text-xs font-semibold text-ink">Clear sky</span>
        <span class="inline-flex min-h-7 items-center rounded-full border border-edge px-3 text-xs font-semibold text-muted">Cloud 80%</span>
      </div>
    </section>
    <section class="flex flex-col gap-3">
      <p class="text-xs font-semibold uppercase tracking-[0.16em] text-muted">Booking</p>
      <div class="flex flex-wrap items-center gap-2">
        <span class="inline-flex min-h-7 items-center rounded-full bg-accent px-3 text-xs font-bold text-accent-ink">Confirmed</span>
        <span class="inline-flex min-h-7 items-center rounded-full border border-danger px-3 text-xs font-bold text-danger">Sold out</span>
        <span class="inline-flex min-h-7 items-center rounded-full border border-dashed border-edge px-3 text-xs font-semibold text-muted">Waitlist</span>
        <span class="inline-flex min-h-7 items-center gap-2 rounded-full border border-edge px-3 text-xs font-bold text-ink">
          <span aria-hidden="true" class="relative flex size-2"><span class="absolute inline-flex size-full animate-ping rounded-full bg-accent opacity-60 motion-reduce:animate-none"></span><span class="relative inline-flex size-2 rounded-full bg-accent"></span></span>
          Live from Kvaløya
        </span>
      </div>
    </section>
  </div>
  <!-- snippet:end -->
</body>
</html>
