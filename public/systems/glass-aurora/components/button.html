<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glass Aurora / Button</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
/* theme:start */
@custom-variant dark (&:where(.dark, .dark *));

@theme {
  --color-*: initial;
  --color-bg: #EDF1F6;
  --color-surface: #FFFFFF;
  --color-glass: #FFFFFFB8;
  --color-glass-edge: #FFFFFFCC;
  --color-scrim: #0B122066;
  --color-ink: #0B1220;
  --color-muted: #475266;
  --color-line: #D3DAE4;
  --color-edge: #6A7688;
  --color-accent: #0A7A55;
  --color-accent-ink: #FFFFFF;
  --color-danger: #B4232F;
  --color-aurora-a: #3EE6A8;
  --color-aurora-b: #4CC9F0;
  --color-aurora-c: #F0609E;

  --font-display: "Unbounded", ui-sans-serif, sans-serif;
  --font-body: "Manrope", ui-sans-serif, sans-serif;

  --text-*: initial;
  --text-xs: 0.75rem;
  --text-xs--line-height: 1.45;
  --text-sm: 0.875rem;
  --text-sm--line-height: 1.5;
  --text-base: 1rem;
  --text-base--line-height: 1.6;
  --text-lg: 1.5rem;
  --text-lg--line-height: 1.25;
  --text-xl: 2.25rem;
  --text-xl--line-height: 1.1;
  --text-2xl: 3.375rem;
  --text-2xl--line-height: 1.02;
  --text-display: 5rem;
  --text-display--line-height: 0.98;

  --radius-*: initial;
  --radius-sm: 0.625rem;
  --radius-md: 1rem;
  --radius-lg: 1.5rem;
  --radius-full: 9999px;

  --shadow-*: initial;
  --shadow-pane: inset 0 1px 0 0 var(--color-glass-edge), 0 18px 40px -24px rgb(3 8 20 / 0.55);

  --ease-drift: cubic-bezier(0.22, 1, 0.36, 1);
}

@utility aurora-sky { background-color: var(--color-bg); background-image: radial-gradient(70% 90% at 15% 0%, color-mix(in oklab, var(--color-aurora-a) 50%, transparent), transparent 70%), radial-gradient(55% 80% at 60% 0%, color-mix(in oklab, var(--color-aurora-b) 40%, transparent), transparent 70%), radial-gradient(45% 70% at 95% 10%, color-mix(in oklab, var(--color-aurora-c) 32%, transparent), transparent 70%); }

@utility glass-pane { background-color: var(--color-glass); -webkit-backdrop-filter: blur(18px) saturate(150%); backdrop-filter: blur(18px) saturate(150%); @supports not (backdrop-filter: blur(1px)) { background-color: var(--color-surface); } @media (prefers-reduced-transparency: reduce) { background-color: var(--color-surface); backdrop-filter: none; } }

@utility glass-scrim { background-color: var(--color-scrim); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); @media (prefers-reduced-transparency: reduce) { backdrop-filter: none; } }

@layer base {
  .dark {
    --color-bg: #070B14;
    --color-surface: #101828;
    --color-glass: #0E1524B8;
    --color-glass-edge: #FFFFFF1F;
    --color-scrim: #03060DA6;
    --color-ink: #EAF0F7;
    --color-muted: #A3AFC2;
    --color-line: #1F2A3D;
    --color-edge: #6B7A90;
    --color-accent: #3EE6A8;
    --color-accent-ink: #03130D;
    --color-danger: #FF8A94;
    --color-aurora-a: #3EE6A8;
    --color-aurora-b: #4CC9F0;
    --color-aurora-c: #F0609E;
  }
  body {
    background: var(--color-bg);
    color: var(--color-ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
}
/* theme:end */
  </style>
</head>
<body class="p-6">
  <!-- snippet:start -->
  <div class="flex max-w-2xl flex-col gap-10">
    <section class="flex flex-col gap-4">
      <p class="text-xs font-semibold uppercase tracking-[0.16em] text-muted">Variants</p>
      <div class="flex flex-wrap items-center gap-x-4 gap-y-3">
        <button type="button" class="inline-flex min-h-12 items-center justify-center gap-2 rounded-full px-6 text-base font-bold transition-[background-color,border-color,filter,transform] duration-200 ease-drift active:translate-y-px focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent motion-reduce:transition-none bg-accent text-accent-ink hover:brightness-110">Book a night tour</button>
        <button type="button" class="inline-flex min-h-12 items-center justify-center gap-2 rounded-full px-6 text-base font-bold transition-[background-color,border-color,filter,transform] duration-200 ease-drift active:translate-y-px focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent motion-reduce:transition-none border border-edge text-ink hover:border-ink hover:bg-surface">See tonight's forecast</button>
        <a href="#" class="inline-flex min-h-11 items-center gap-2 text-sm font-semibold text-ink underline-offset-4 hover:underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">How Kp works <svg aria-hidden="true" viewBox="0 0 16 16" class="size-4" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 8h10M9 4.5 12.5 8 9 11.5"/></svg></a>
        <button type="button" class="inline-flex min-h-12 items-center justify-center gap-2 rounded-full px-6 text-base font-bold transition-[background-color,border-color,filter,transform] duration-200 ease-drift active:translate-y-px focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent motion-reduce:transition-none border border-danger text-danger hover:bg-surface">Cancel booking</button>
      </div>
    </section>

    <section class="flex flex-col gap-4">
      <p class="text-xs font-semibold uppercase tracking-[0.16em] text-muted">On the aurora field</p>
      <div class="aurora-sky flex flex-wrap items-center gap-3 rounded-lg p-5">
        <div class="glass-pane flex flex-wrap items-center gap-3 rounded-full p-1.5 shadow-pane">
          <button type="button" class="inline-flex min-h-12 items-center justify-center gap-2 rounded-full px-6 text-base font-bold transition-[background-color,border-color,filter,transform] duration-200 ease-drift active:translate-y-px focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent motion-reduce:transition-none bg-accent text-accent-ink hover:brightness-110">Get an alert</button>
          <button type="button" class="inline-flex min-h-12 items-center justify-center gap-2 rounded-full px-6 text-base font-bold transition-[background-color,border-color,filter,transform] duration-200 ease-drift active:translate-y-px focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent motion-reduce:transition-none text-ink hover:bg-surface">Not tonight</button>
        </div>
      </div>
      <p class="text-xs text-muted">Buttons sit on a glass pane, never directly on the aurora.</p>
    </section>

    <section class="flex flex-col gap-4">
      <p class="text-xs font-semibold uppercase tracking-[0.16em] text-muted">Sizes and icon</p>
      <div class="flex flex-wrap items-center gap-x-4 gap-y-3">
        <button type="button" class="inline-flex min-h-12 items-center justify-center gap-2 rounded-full px-6 text-base font-bold transition-[background-color,border-color,filter,transform] duration-200 ease-drift active:translate-y-px focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent motion-reduce:transition-none bg-accent text-accent-ink hover:brightness-110 min-h-11 px-4 text-sm">Small</button>
        <button type="button" class="inline-flex min-h-12 items-center justify-center gap-2 rounded-full px-6 text-base font-bold transition-[background-color,border-color,filter,transform] duration-200 ease-drift active:translate-y-px focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent motion-reduce:transition-none bg-accent text-accent-ink hover:brightness-110">Medium</button>
        <button type="button" class="inline-flex min-h-12 items-center justify-center gap-2 rounded-full px-6 text-base font-bold transition-[background-color,border-color,filter,transform] duration-200 ease-drift active:translate-y-px focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent motion-reduce:transition-none border border-edge text-ink hover:border-ink hover:bg-surface pl-5">
          <svg aria-hidden="true" viewBox="0 0 20 20" class="size-5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2.5a5 5 0 0 0-5 5c0 4-1.5 5.5-1.5 5.5h13S15 11.5 15 7.5a5 5 0 0 0-5-5Z"/><path d="M8.3 16a1.8 1.8 0 0 0 3.4 0"/></svg>
          Alert me at Kp 4
        </button>
      </div>
    </section>

    <section class="flex flex-col gap-4">
      <p class="text-xs font-semibold uppercase tracking-[0.16em] text-muted">States</p>
      <div class="flex flex-wrap items-start gap-x-6 gap-y-5">
        <div class="flex flex-col gap-2">
          <button type="button" class="inline-flex min-h-12 items-center justify-center gap-2 rounded-full px-6 text-base font-bold transition-[background-color,border-color,filter,transform] duration-200 ease-drift active:translate-y-px focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent motion-reduce:transition-none bg-accent text-accent-ink hover:brightness-110 outline-2 outline-offset-2 outline-accent">Book a night tour</button>
          <p class="text-xs text-muted">Focus visible, shown statically.</p>
        </div>
        <div class="flex flex-col gap-2">
          <button type="button" aria-busy="true" class="inline-flex min-h-12 items-center justify-center gap-2 rounded-full px-6 text-base font-bold transition-[background-color,border-color,filter,transform] duration-200 ease-drift active:translate-y-px focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent motion-reduce:transition-none bg-accent text-accent-ink hover:brightness-110 cursor-progress">
            <svg aria-hidden="true" viewBox="0 0 20 20" class="size-5 animate-spin motion-reduce:animate-none" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M10 2.5a7.5 7.5 0 1 1-7.5 7.5"/></svg>
            Holding your seat
          </button>
          <p class="text-xs text-muted">Busy, still focusable.</p>
        </div>
        <div class="flex flex-col gap-2">
          <button type="button" disabled class="inline-flex min-h-12 cursor-not-allowed items-center justify-center rounded-full border border-dashed border-edge px-6 text-base font-bold text-muted">Book the 21:00 bus</button>
          <p class="max-w-56 text-xs text-muted">All 14 seats on the 21:00 bus are taken. The 22:30 bus has 6 left.</p>
        </div>
      </div>
    </section>
  </div>
  <!-- snippet:end -->
</body>
</html>
