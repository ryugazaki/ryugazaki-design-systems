<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glass Aurora / Checkbox and toggle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
/* theme:start */
@custom-variant dark (&:where(.dark, .dark *));

@theme {
  --color-*: initial;
  --color-bg: #EDF1F6;
  --color-surface: #FFFFFF;
  --color-glass: #FFFFFFB8;
  --color-glass-edge: #FFFFFFCC;
  --color-scrim: #0B122066;
  --color-ink: #0B1220;
  --color-muted: #475266;
  --color-line: #D3DAE4;
  --color-edge: #6A7688;
  --color-accent: #0A7A55;
  --color-accent-ink: #FFFFFF;
  --color-danger: #B4232F;
  --color-aurora-a: #3EE6A8;
  --color-aurora-b: #4CC9F0;
  --color-aurora-c: #F0609E;

  --font-display: "Unbounded", ui-sans-serif, sans-serif;
  --font-body: "Manrope", ui-sans-serif, sans-serif;

  --text-*: initial;
  --text-xs: 0.75rem;
  --text-xs--line-height: 1.45;
  --text-sm: 0.875rem;
  --text-sm--line-height: 1.5;
  --text-base: 1rem;
  --text-base--line-height: 1.6;
  --text-lg: 1.5rem;
  --text-lg--line-height: 1.25;
  --text-xl: 2.25rem;
  --text-xl--line-height: 1.1;
  --text-2xl: 3.375rem;
  --text-2xl--line-height: 1.02;
  --text-display: 5rem;
  --text-display--line-height: 0.98;

  --radius-*: initial;
  --radius-sm: 0.625rem;
  --radius-md: 1rem;
  --radius-lg: 1.5rem;
  --radius-full: 9999px;

  --shadow-*: initial;
  --shadow-pane: inset 0 1px 0 0 var(--color-glass-edge), 0 18px 40px -24px rgb(3 8 20 / 0.55);

  --ease-drift: cubic-bezier(0.22, 1, 0.36, 1);
}

@utility aurora-sky { background-color: var(--color-bg); background-image: radial-gradient(70% 90% at 15% 0%, color-mix(in oklab, var(--color-aurora-a) 50%, transparent), transparent 70%), radial-gradient(55% 80% at 60% 0%, color-mix(in oklab, var(--color-aurora-b) 40%, transparent), transparent 70%), radial-gradient(45% 70% at 95% 10%, color-mix(in oklab, var(--color-aurora-c) 32%, transparent), transparent 70%); }

@utility glass-pane { background-color: var(--color-glass); -webkit-backdrop-filter: blur(18px) saturate(150%); backdrop-filter: blur(18px) saturate(150%); @supports not (backdrop-filter: blur(1px)) { background-color: var(--color-surface); } @media (prefers-reduced-transparency: reduce) { background-color: var(--color-surface); backdrop-filter: none; } }

@utility glass-scrim { background-color: var(--color-scrim); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); @media (prefers-reduced-transparency: reduce) { backdrop-filter: none; } }

@layer base {
  .dark {
    --color-bg: #070B14;
    --color-surface: #101828;
    --color-glass: #0E1524B8;
    --color-glass-edge: #FFFFFF1F;
    --color-scrim: #03060DA6;
    --color-ink: #EAF0F7;
    --color-muted: #A3AFC2;
    --color-line: #1F2A3D;
    --color-edge: #6B7A90;
    --color-accent: #3EE6A8;
    --color-accent-ink: #03130D;
    --color-danger: #FF8A94;
    --color-aurora-a: #3EE6A8;
    --color-aurora-b: #4CC9F0;
    --color-aurora-c: #F0609E;
  }
  body {
    background: var(--color-bg);
    color: var(--color-ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
}
/* theme:end */
  </style>
</head>
<body class="p-6">
  <!-- snippet:start -->
  <div class="flex max-w-md flex-col gap-10">
    <fieldset class="flex flex-col gap-1">
      <legend class="text-xs font-semibold uppercase tracking-[0.16em] text-muted mb-3">Checkbox</legend>
      <label class="group flex min-h-11 cursor-pointer items-center gap-3">
        <input type="checkbox" checked class="peer sr-only">
        <span aria-hidden="true" class="grid size-5 shrink-0 place-items-center rounded-[6px] border border-edge bg-surface text-accent-ink transition-colors duration-200 ease-drift peer-checked:border-accent peer-checked:bg-accent peer-focus-visible:outline-2 peer-focus-visible:outline-offset-2 peer-focus-visible:outline-accent motion-reduce:transition-none [&>svg]:opacity-0 peer-checked:[&>svg]:opacity-100">
          <svg viewBox="0 0 16 16" class="size-3.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m3.5 8.5 3 3 6-7"/></svg>
        </span>
        <span class="text-base text-ink">Thermal suit for every guest</span>
      </label>
      <label class="group flex min-h-11 cursor-pointer items-center gap-3">
        <input type="checkbox" class="peer sr-only">
        <span aria-hidden="true" class="grid size-5 shrink-0 place-items-center rounded-[6px] border border-edge bg-surface text-accent-ink transition-colors duration-200 ease-drift group-hover:border-ink peer-checked:border-accent peer-checked:bg-accent peer-focus-visible:outline-2 peer-focus-visible:outline-offset-2 peer-focus-visible:outline-accent motion-reduce:transition-none [&>svg]:opacity-0 peer-checked:[&>svg]:opacity-100">
          <svg viewBox="0 0 16 16" class="size-3.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m3.5 8.5 3 3 6-7"/></svg>
        </span>
        <span class="text-base text-ink">Add a tripod rental, 150 NOK</span>
      </label>
      <label class="flex min-h-11 cursor-not-allowed items-center gap-3">
        <input type="checkbox" disabled class="peer sr-only">
        <span aria-hidden="true" class="size-5 shrink-0 rounded-[6px] border border-dashed border-edge"></span>
        <span class="text-base text-muted">Hotel drop-off after 03:00 (not offered)</span>
      </label>
    </fieldset>

    <fieldset class="flex flex-col gap-1">
      <legend class="text-xs font-semibold uppercase tracking-[0.16em] text-muted mb-3">Toggle</legend>
      <label class="flex min-h-11 cursor-pointer items-center justify-between gap-4">
        <span class="flex flex-col">
          <span class="text-base font-semibold text-ink">Alert me when Kp reaches 4</span>
          <span class="text-sm text-muted">One push message, only between 18:00 and 02:00.</span>
        </span>
        <input type="checkbox" role="switch" checked class="peer sr-only">
        <span aria-hidden="true" class="relative h-7 w-12 shrink-0 rounded-full border border-edge bg-bg transition-colors duration-200 ease-drift peer-checked:border-accent peer-checked:bg-accent peer-focus-visible:outline-2 peer-focus-visible:outline-offset-2 peer-focus-visible:outline-accent motion-reduce:transition-none after:absolute after:top-1/2 after:left-1 after:size-5 after:-translate-y-1/2 after:rounded-full after:bg-ink after:transition-transform after:duration-200 after:ease-drift peer-checked:after:translate-x-5 peer-checked:after:bg-accent-ink motion-reduce:after:transition-none"></span>
      </label>
      <label class="flex min-h-11 cursor-pointer items-center justify-between gap-4">
        <span class="flex flex-col">
          <span class="text-base font-semibold text-ink">Clear sky only</span>
          <span class="text-sm text-muted">Hide tours where cloud cover is above 50 percent.</span>
        </span>
        <input type="checkbox" role="switch" class="peer sr-only">
        <span aria-hidden="true" class="relative h-7 w-12 shrink-0 rounded-full border border-edge bg-bg transition-colors duration-200 ease-drift peer-checked:border-accent peer-checked:bg-accent peer-focus-visible:outline-2 peer-focus-visible:outline-offset-2 peer-focus-visible:outline-accent motion-reduce:transition-none after:absolute after:top-1/2 after:left-1 after:size-5 after:-translate-y-1/2 after:rounded-full after:bg-ink after:transition-transform after:duration-200 after:ease-drift peer-checked:after:translate-x-5 peer-checked:after:bg-accent-ink motion-reduce:after:transition-none"></span>
      </label>
    </fieldset>
  </div>
  <!-- snippet:end -->
</body>
</html>
