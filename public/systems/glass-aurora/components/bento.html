<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glass Aurora / Bento grid</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
/* theme:start */
@custom-variant dark (&:where(.dark, .dark *));

@theme {
  --color-*: initial;
  --color-bg: #EDF1F6;
  --color-surface: #FFFFFF;
  --color-glass: #FFFFFFB8;
  --color-glass-edge: #FFFFFFCC;
  --color-scrim: #0B122066;
  --color-ink: #0B1220;
  --color-muted: #475266;
  --color-line: #D3DAE4;
  --color-edge: #6A7688;
  --color-accent: #0A7A55;
  --color-accent-ink: #FFFFFF;
  --color-danger: #B4232F;
  --color-aurora-a: #3EE6A8;
  --color-aurora-b: #4CC9F0;
  --color-aurora-c: #F0609E;

  --font-display: "Unbounded", ui-sans-serif, sans-serif;
  --font-body: "Manrope", ui-sans-serif, sans-serif;

  --text-*: initial;
  --text-xs: 0.75rem;
  --text-xs--line-height: 1.45;
  --text-sm: 0.875rem;
  --text-sm--line-height: 1.5;
  --text-base: 1rem;
  --text-base--line-height: 1.6;
  --text-lg: 1.5rem;
  --text-lg--line-height: 1.25;
  --text-xl: 2.25rem;
  --text-xl--line-height: 1.1;
  --text-2xl: 3.375rem;
  --text-2xl--line-height: 1.02;
  --text-display: 5rem;
  --text-display--line-height: 0.98;

  --radius-*: initial;
  --radius-sm: 0.625rem;
  --radius-md: 1rem;
  --radius-lg: 1.5rem;
  --radius-full: 9999px;

  --shadow-*: initial;
  --shadow-pane: inset 0 1px 0 0 var(--color-glass-edge), 0 18px 40px -24px rgb(3 8 20 / 0.55);

  --ease-drift: cubic-bezier(0.22, 1, 0.36, 1);
}

@utility aurora-sky { background-color: var(--color-bg); background-image: radial-gradient(70% 90% at 15% 0%, color-mix(in oklab, var(--color-aurora-a) 50%, transparent), transparent 70%), radial-gradient(55% 80% at 60% 0%, color-mix(in oklab, var(--color-aurora-b) 40%, transparent), transparent 70%), radial-gradient(45% 70% at 95% 10%, color-mix(in oklab, var(--color-aurora-c) 32%, transparent), transparent 70%); }

@utility glass-pane { background-color: var(--color-glass); -webkit-backdrop-filter: blur(18px) saturate(150%); backdrop-filter: blur(18px) saturate(150%); @supports not (backdrop-filter: blur(1px)) { background-color: var(--color-surface); } @media (prefers-reduced-transparency: reduce) { background-color: var(--color-surface); backdrop-filter: none; } }

@utility glass-scrim { background-color: var(--color-scrim); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); @media (prefers-reduced-transparency: reduce) { backdrop-filter: none; } }

@layer base {
  .dark {
    --color-bg: #070B14;
    --color-surface: #101828;
    --color-glass: #0E1524B8;
    --color-glass-edge: #FFFFFF1F;
    --color-scrim: #03060DA6;
    --color-ink: #EAF0F7;
    --color-muted: #A3AFC2;
    --color-line: #1F2A3D;
    --color-edge: #6B7A90;
    --color-accent: #3EE6A8;
    --color-accent-ink: #03130D;
    --color-danger: #FF8A94;
    --color-aurora-a: #3EE6A8;
    --color-aurora-b: #4CC9F0;
    --color-aurora-c: #F0609E;
  }
  body {
    background: var(--color-bg);
    color: var(--color-ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
}
/* theme:end */
  </style>
</head>
<body class="p-6">
  <!-- snippet:start -->
  <div class="grid max-w-4xl grid-cols-1 gap-3 sm:grid-cols-4">
    <section aria-labelledby="b-kp" class="flex flex-col gap-5 rounded-lg border border-line bg-surface p-5 sm:col-span-2 sm:row-span-2">
      <header class="flex items-center justify-between gap-3">
        <h2 id="b-kp" class="text-xs font-semibold uppercase tracking-[0.16em] text-muted">Kp index tonight</h2>
        <span class="inline-flex min-h-7 items-center gap-1.5 rounded-full border border-accent px-3 text-xs font-bold text-accent"><span aria-hidden="true" class="size-1.5 rounded-full bg-accent"></span>Kp 5, strong</span>
      </header>
      <p class="flex items-baseline gap-3">
        <span class="font-display text-2xl font-semibold tabular-nums tracking-tight text-ink sm:text-display">4.7</span>
        <span class="text-sm text-muted">peak at 23:00</span>
      </p>
      <figure class="mt-auto flex flex-col gap-2">
        <div role="img" aria-label="Kp by hour: 18:00 1.8, 19:00 2.2, 20:00 2.9, 21:00 3.6, 22:00 4.3, 23:00 4.7, 00:00 4.1, 01:00 3.4, 02:00 2.6, 03:00 2.1" class="flex h-32 items-end gap-1.5">
          <span class="flex-1 rounded-t-sm bg-line" style="height:20%"></span>
          <span class="flex-1 rounded-t-sm bg-line" style="height:25%"></span>
          <span class="flex-1 rounded-t-sm bg-line" style="height:33%"></span>
          <span class="flex-1 rounded-t-sm bg-edge" style="height:41%"></span>
          <span class="flex-1 rounded-t-sm bg-edge" style="height:49%"></span>
          <span class="flex-1 rounded-t-sm bg-accent" style="height:100%"></span>
          <span class="flex-1 rounded-t-sm bg-edge" style="height:47%"></span>
          <span class="flex-1 rounded-t-sm bg-edge" style="height:39%"></span>
          <span class="flex-1 rounded-t-sm bg-line" style="height:30%"></span>
          <span class="flex-1 rounded-t-sm bg-line" style="height:24%"></span>
        </div>
        <figcaption class="flex justify-between text-xs tabular-nums text-muted"><span>18:00</span><span>23:00</span><span>03:00</span></figcaption>
      </figure>
    </section>

    <section aria-labelledby="b-cloud" class="flex flex-col gap-2 rounded-lg border border-line bg-surface p-5 sm:col-span-2">
      <h2 id="b-cloud" class="text-xs font-semibold uppercase tracking-[0.16em] text-muted">Cloud cover, coast route</h2>
      <p class="font-display text-xl font-semibold tabular-nums text-ink">18%</p>
      <div class="h-2 overflow-hidden rounded-full bg-line"><div class="h-full w-[18%] rounded-full bg-ink"></div></div>
      <p class="text-sm text-muted">Clearing from the west after 21:00.</p>
    </section>

    <section aria-labelledby="b-moon" class="flex flex-col gap-2 rounded-lg border border-line bg-surface p-5">
      <h2 id="b-moon" class="text-xs font-semibold uppercase tracking-[0.16em] text-muted">Moon</h2>
      <svg aria-hidden="true" viewBox="0 0 32 32" class="size-8 text-ink"><circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M16 3a13 13 0 0 1 0 26 9 13 0 0 0 0-26Z" fill="currentColor"/></svg>
      <p class="text-sm font-semibold text-ink">Waning, 31%</p>
      <p class="text-xs text-muted">Sets 01:12</p>
    </section>

    <section aria-labelledby="b-wind" class="flex flex-col gap-2 rounded-lg border border-line bg-surface p-5">
      <h2 id="b-wind" class="text-xs font-semibold uppercase tracking-[0.16em] text-muted">Solar wind</h2>
      <p class="font-display text-xl font-semibold tabular-nums text-ink">612</p>
      <p class="text-xs text-muted">km per second, Bz pointing south</p>
    </section>

    <section aria-labelledby="b-dark" class="flex flex-col gap-3 rounded-lg border border-line bg-surface p-5 sm:col-span-4 sm:flex-row sm:items-center sm:justify-between">
      <h2 id="b-dark" class="text-xs font-semibold uppercase tracking-[0.16em] text-muted">Dark enough to see</h2>
      <div class="flex flex-1 items-center gap-3 sm:max-w-md">
        <span class="text-sm tabular-nums text-ink">16:40</span>
        <div class="relative h-2 flex-1 rounded-full bg-line"><div class="absolute inset-y-0 left-[8%] right-[10%] rounded-full bg-ink"></div></div>
        <span class="text-sm tabular-nums text-ink">06:55</span>
      </div>
      <p class="text-sm text-muted">14 hours 15 minutes of darkness</p>
    </section>
  </div>
  <!-- snippet:end -->
</body>
</html>
