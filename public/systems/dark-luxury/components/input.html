<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dark Luxury / Input</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Jost:wght@300;400;500&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
/* theme:start */
@custom-variant dark (&:where(.dark, .dark *));

@theme {
  --color-*: initial;
  --color-bg: #F2EEE6;
  --color-surface: #FAF8F3;
  --color-ink: #14130F;
  --color-muted: #6E695E;
  --color-line: #CFC8B8;
  --color-accent: #7D6440;
  --color-accent-ink: #F2EEE6;
  --color-danger: #8E2A20;

  --font-display: "Bodoni Moda", ui-serif, Georgia, serif;
  --font-body: "Jost", ui-sans-serif, sans-serif;

  --text-*: initial;
  --text-xs: 0.75rem;
  --text-xs--line-height: 1.5;
  --text-sm: 0.8125rem;
  --text-sm--line-height: 1.6;
  --text-base: 0.9375rem;
  --text-base--line-height: 1.75;
  --text-lg: 1.5rem;
  --text-lg--line-height: 1.3;
  --text-xl: 2.4375rem;
  --text-xl--line-height: 1.1;
  --text-2xl: 3.9375rem;
  --text-2xl--line-height: 1;
  --text-display: 6.375rem;
  --text-display--line-height: 0.92;

  --tracking-caps: 0.24em;

  --radius-*: initial;
  --shadow-*: initial;

  --ease-slow: cubic-bezier(0.22, 0.61, 0.36, 1);
  --default-transition-duration: 400ms;
  --default-transition-timing-function: cubic-bezier(0.22, 0.61, 0.36, 1);
}

@layer base {
  .dark {
    --color-bg: #0A0A0A;
    --color-surface: #121211;
    --color-ink: #E9E4D8;
    --color-muted: #8C877C;
    --color-line: #2A2826;
    --color-accent: #A88B5C;
    --color-accent-ink: #0A0A0A;
    --color-danger: #D98A7E;
  }
  body {
    background: var(--color-bg);
    color: var(--color-ink);
    font-family: var(--font-body);
    font-weight: 300;
    font-size: var(--text-base);
    -webkit-font-smoothing: antialiased;
  }
}
/* theme:end */
  </style>
</head>
<body class="p-6">
  <!-- snippet:start -->
  <form class="flex max-w-md flex-col gap-10" novalidate>
    <div class="flex flex-col gap-2">
      <label for="full-name" class="text-xs font-normal uppercase tracking-[var(--tracking-caps)] text-muted">Full name</label>
      <input id="full-name" name="full-name" type="text" autocomplete="name" value="Hélène Marchetti" aria-describedby="full-name-hint" class="min-h-11 w-full border-0 border-b border-muted bg-transparent px-0 pt-2 pb-[9px] text-base text-ink placeholder:text-muted transition-colors duration-[400ms] ease-slow focus:border-b-2 focus:border-accent focus:pb-2 focus:outline-none motion-reduce:transition-none">
      <p id="full-name-hint" class="text-muted">As it should appear on the appointment card.</p>
    </div>

    <div class="flex flex-col gap-2">
      <label for="focus-email" class="text-xs font-normal uppercase tracking-[var(--tracking-caps)] text-muted">Email, focused</label>
      <input id="focus-email" name="focus-email" type="email" autocomplete="email" value="helene@marchetti.ch" class="min-h-11 w-full border-0 border-b-2 border-accent bg-transparent px-0 pt-2 pb-2 text-base text-ink outline-none">
    </div>

    <div class="flex flex-col gap-2">
      <label for="email" class="text-xs font-normal uppercase tracking-[var(--tracking-caps)] text-danger">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" value="helene@marchetti" aria-invalid="true" aria-describedby="email-error" class="min-h-11 w-full border-0 border-b border-danger bg-transparent px-0 pt-2 pb-[9px] text-base text-ink transition-colors duration-[400ms] ease-slow focus:border-b-2 focus:pb-2 focus:outline-none motion-reduce:transition-none">
      <p id="email-error" class="font-display text-base italic text-danger">This address is missing its domain, such as .ch or .com.</p>
    </div>

    <div class="flex flex-col gap-2">
      <label for="note" class="text-xs font-normal uppercase tracking-[var(--tracking-caps)] text-muted">A note for the atelier</label>
      <textarea id="note" name="note" rows="3" aria-describedby="note-hint" class="w-full resize-y border-0 border-b border-muted bg-transparent px-0 pt-2 pb-[9px] text-base text-ink placeholder:text-muted transition-colors duration-[400ms] ease-slow focus:border-b-2 focus:border-accent focus:pb-2 focus:outline-none motion-reduce:transition-none" placeholder="The piece you would like to see, or a question about sizing"></textarea>
      <p id="note-hint" class="text-muted">Optional. A watchmaker reads every note.</p>
    </div>

    <div class="flex flex-col gap-2">
      <label for="ref" class="text-xs font-normal uppercase tracking-[var(--tracking-caps)] text-muted">Reference</label>
      <input id="ref" name="ref" type="text" value="AR 01.38" disabled aria-describedby="ref-hint" class="min-h-11 w-full cursor-not-allowed border-0 border-b border-dashed border-line bg-transparent px-0 pt-2 pb-[9px] text-base text-muted">
      <p id="ref-hint" class="text-muted">Set by the piece you chose.</p>
    </div>
  </form>
  <!-- snippet:end -->
</body>
</html>
