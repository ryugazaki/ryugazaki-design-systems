<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dark Luxury / Checkbox and toggle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Jost:wght@300;400;500&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
/* theme:start */
@custom-variant dark (&:where(.dark, .dark *));

@theme {
  --color-*: initial;
  --color-bg: #F2EEE6;
  --color-surface: #FAF8F3;
  --color-ink: #14130F;
  --color-muted: #6E695E;
  --color-line: #CFC8B8;
  --color-accent: #7D6440;
  --color-accent-ink: #F2EEE6;
  --color-danger: #8E2A20;

  --font-display: "Bodoni Moda", ui-serif, Georgia, serif;
  --font-body: "Jost", ui-sans-serif, sans-serif;

  --text-*: initial;
  --text-xs: 0.75rem;
  --text-xs--line-height: 1.5;
  --text-sm: 0.8125rem;
  --text-sm--line-height: 1.6;
  --text-base: 0.9375rem;
  --text-base--line-height: 1.75;
  --text-lg: 1.5rem;
  --text-lg--line-height: 1.3;
  --text-xl: 2.4375rem;
  --text-xl--line-height: 1.1;
  --text-2xl: 3.9375rem;
  --text-2xl--line-height: 1;
  --text-display: 6.375rem;
  --text-display--line-height: 0.92;

  --tracking-caps: 0.24em;

  --radius-*: initial;
  --shadow-*: initial;

  --ease-slow: cubic-bezier(0.22, 0.61, 0.36, 1);
  --default-transition-duration: 400ms;
  --default-transition-timing-function: cubic-bezier(0.22, 0.61, 0.36, 1);
}

@layer base {
  .dark {
    --color-bg: #0A0A0A;
    --color-surface: #121211;
    --color-ink: #E9E4D8;
    --color-muted: #8C877C;
    --color-line: #2A2826;
    --color-accent: #A88B5C;
    --color-accent-ink: #0A0A0A;
    --color-danger: #D98A7E;
  }
  body {
    background: var(--color-bg);
    color: var(--color-ink);
    font-family: var(--font-body);
    font-weight: 300;
    font-size: var(--text-base);
    -webkit-font-smoothing: antialiased;
  }
}
/* theme:end */
  </style>
</head>
<body class="p-6">
  <!-- snippet:start -->
  <div class="flex max-w-md flex-col gap-12">
    <fieldset class="flex flex-col">
      <legend class="mb-3 w-full border-b border-line pb-3 text-xs font-normal uppercase tracking-[var(--tracking-caps)] text-muted">Correspondence</legend>
      <label class="flex min-h-11 cursor-pointer items-center gap-4 border-b border-line py-2 text-ink">
        <span class="relative inline-flex size-3.5 shrink-0">
          <input type="checkbox" name="letter" checked class="peer m-0 size-3.5 cursor-pointer appearance-none border border-muted bg-transparent transition-colors duration-[400ms] ease-slow checked:border-accent checked:bg-accent focus-visible:outline-1 focus-visible:outline-offset-4 focus-visible:outline-accent motion-reduce:transition-none">
          <svg aria-hidden="true" viewBox="0 0 14 14" class="pointer-events-none absolute inset-0 hidden size-3.5 text-accent-ink peer-checked:block" fill="none" stroke="currentColor" stroke-width="1.25"><path d="M3.5 7.2l2.3 2.3 4.7-5"/></svg>
        </span>
        <span>The annual collection letter, sent each January</span>
      </label>
      <label class="flex min-h-11 cursor-pointer items-center gap-4 border-b border-line py-2 text-ink">
        <span class="relative inline-flex size-3.5 shrink-0">
          <input type="checkbox" name="service" class="peer m-0 size-3.5 cursor-pointer appearance-none border border-muted bg-transparent transition-colors duration-[400ms] ease-slow checked:border-accent checked:bg-accent focus-visible:outline-1 focus-visible:outline-offset-4 focus-visible:outline-accent motion-reduce:transition-none">
          <svg aria-hidden="true" viewBox="0 0 14 14" class="pointer-events-none absolute inset-0 hidden size-3.5 text-accent-ink peer-checked:block" fill="none" stroke="currentColor" stroke-width="1.25"><path d="M3.5 7.2l2.3 2.3 4.7-5"/></svg>
        </span>
        <span>A reminder when my piece is due for service</span>
      </label>
      <label class="flex min-h-11 cursor-pointer items-center gap-4 py-2 text-ink">
        <span class="relative inline-flex size-3.5 shrink-0">
          <input type="checkbox" name="focus-demo" checked class="peer m-0 size-3.5 cursor-pointer appearance-none border border-accent bg-accent outline-1 outline-offset-4 outline-accent">
          <svg aria-hidden="true" viewBox="0 0 14 14" class="pointer-events-none absolute inset-0 hidden size-3.5 text-accent-ink peer-checked:block" fill="none" stroke="currentColor" stroke-width="1.25"><path d="M3.5 7.2l2.3 2.3 4.7-5"/></svg>
        </span>
        <span>Focused and checked</span>
      </label>
    </fieldset>

    <div class="flex flex-col">
      <p class="mb-3 border-b border-line pb-3 text-xs font-normal uppercase tracking-[var(--tracking-caps)] text-muted">Display</p>
      <div class="flex min-h-11 items-center justify-between gap-6 border-b border-line py-2">
        <span id="sw-chf" class="text-ink">Show prices in Swiss francs</span>
        <button type="button" role="switch" aria-checked="true" aria-labelledby="sw-chf" class="inline-flex min-h-11 shrink-0 items-center px-1 focus-visible:outline-1 focus-visible:outline-offset-2 focus-visible:outline-accent">
          <span aria-hidden="true" class="relative flex h-3 w-11 items-center">
            <span class="h-px w-full bg-accent"></span>
            <span class="absolute right-0 size-3 bg-accent transition-[right] duration-[400ms] ease-slow motion-reduce:transition-none"></span>
          </span>
        </button>
      </div>
      <div class="flex min-h-11 items-center justify-between gap-6 py-2">
        <span id="sw-allocated" class="text-ink">Include allocated pieces</span>
        <button type="button" role="switch" aria-checked="false" aria-labelledby="sw-allocated" class="inline-flex min-h-11 shrink-0 items-center px-1 focus-visible:outline-1 focus-visible:outline-offset-2 focus-visible:outline-accent">
          <span aria-hidden="true" class="relative flex h-3 w-11 items-center">
            <span class="h-px w-full bg-muted"></span>
            <span class="absolute left-0 size-3 border border-muted bg-bg"></span>
          </span>
        </button>
      </div>
      <p class="mt-4 text-muted">On: a brass line with the thumb at the end. Off: a muted line with an open thumb at the start.</p>
    </div>
  </div>
  <!-- snippet:end -->
</body>
</html>
