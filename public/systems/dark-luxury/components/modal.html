<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dark Luxury / Modal and sheet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Jost:wght@300;400;500&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
/* theme:start */
@custom-variant dark (&:where(.dark, .dark *));

@theme {
  --color-*: initial;
  --color-bg: #F2EEE6;
  --color-surface: #FAF8F3;
  --color-ink: #14130F;
  --color-muted: #6E695E;
  --color-line: #CFC8B8;
  --color-accent: #7D6440;
  --color-accent-ink: #F2EEE6;
  --color-danger: #8E2A20;

  --font-display: "Bodoni Moda", ui-serif, Georgia, serif;
  --font-body: "Jost", ui-sans-serif, sans-serif;

  --text-*: initial;
  --text-xs: 0.75rem;
  --text-xs--line-height: 1.5;
  --text-sm: 0.8125rem;
  --text-sm--line-height: 1.6;
  --text-base: 0.9375rem;
  --text-base--line-height: 1.75;
  --text-lg: 1.5rem;
  --text-lg--line-height: 1.3;
  --text-xl: 2.4375rem;
  --text-xl--line-height: 1.1;
  --text-2xl: 3.9375rem;
  --text-2xl--line-height: 1;
  --text-display: 6.375rem;
  --text-display--line-height: 0.92;

  --tracking-caps: 0.24em;

  --radius-*: initial;
  --shadow-*: initial;

  --ease-slow: cubic-bezier(0.22, 0.61, 0.36, 1);
  --default-transition-duration: 400ms;
  --default-transition-timing-function: cubic-bezier(0.22, 0.61, 0.36, 1);
}

@layer base {
  .dark {
    --color-bg: #0A0A0A;
    --color-surface: #121211;
    --color-ink: #E9E4D8;
    --color-muted: #8C877C;
    --color-line: #2A2826;
    --color-accent: #A88B5C;
    --color-accent-ink: #0A0A0A;
    --color-danger: #D98A7E;
  }
  body {
    background: var(--color-bg);
    color: var(--color-ink);
    font-family: var(--font-body);
    font-weight: 300;
    font-size: var(--text-base);
    -webkit-font-smoothing: antialiased;
  }
}
/* theme:end */
  </style>
</head>
<body class="p-6">
  <!-- snippet:start -->
  <div class="relative isolate flex min-h-[600px] flex-col justify-end overflow-hidden pt-24 md:items-center md:justify-center md:p-16">
    <div aria-hidden="true" class="absolute inset-0 -z-10 flex flex-col gap-6 bg-bg p-6 md:p-10">
      <p class="text-xs font-normal uppercase tracking-[var(--tracking-caps)] text-muted">Réf. AR 01.38</p>
      <p class="font-display text-2xl text-ink md:text-display">Calibre One</p>
      <div class="h-px w-full bg-line"></div>
    </div>
    <div aria-hidden="true" class="absolute inset-0 -z-10 bg-ink/75 dark:bg-bg/90"></div>

    <div role="dialog" aria-modal="true" aria-labelledby="viewing-title" aria-describedby="viewing-desc" class="w-full border-t border-line bg-surface px-6 pt-6 pb-8 md:max-w-lg md:border md:px-12 md:pt-10 md:pb-12">
      <div class="flex items-start justify-between gap-4">
        <p class="pt-3 text-xs font-normal uppercase tracking-[var(--tracking-caps)] text-muted">Private viewing</p>
        <button type="button" aria-label="Close" class="inline-flex size-11 shrink-0 items-center justify-center text-muted transition-colors duration-[400ms] ease-slow hover:text-ink focus-visible:outline-1 focus-visible:-outline-offset-4 focus-visible:outline-accent motion-reduce:transition-none">
          <svg aria-hidden="true" viewBox="0 0 16 16" class="size-4" fill="none" stroke="currentColor" stroke-width="1"><path d="M2 2l12 12M14 2L2 14"/></svg>
        </button>
      </div>
      <h2 id="viewing-title" class="mt-4 font-display text-xl text-ink">The Calibre <em>One</em>, in Geneva</h2>
      <p id="viewing-desc" class="mt-4 text-muted">A watchmaker will bring the piece to the salon and stay for the hour. There is nothing to sign.</p>

      <dl class="mt-8 border-t border-line">
        <div class="flex items-baseline justify-between gap-6 border-b border-line py-3">
          <dt class="text-xs font-normal uppercase tracking-[var(--tracking-caps)] text-muted">Date</dt>
          <dd class="text-right font-display text-base text-ink">Thursday 5 November, 11:00</dd>
        </div>
        <div class="flex items-baseline justify-between gap-6 border-b border-line py-3">
          <dt class="text-xs font-normal uppercase tracking-[var(--tracking-caps)] text-muted">Salon</dt>
          <dd class="text-right font-display text-base text-ink">Rue du Rhône 48</dd>
        </div>
      </dl>

      <div class="mt-10 flex flex-col-reverse items-stretch gap-4 sm:flex-row sm:items-center sm:justify-between">
        <button type="button" class="inline-flex min-h-12 items-center justify-center text-sm font-normal uppercase tracking-[var(--tracking-caps)] text-ink underline decoration-muted decoration-1 underline-offset-8 transition-colors duration-[400ms] ease-slow hover:decoration-ink focus-visible:outline-1 focus-visible:outline-offset-4 focus-visible:outline-accent motion-reduce:transition-none">Another date</button>
        <button type="button" class="inline-flex min-h-12 items-center justify-center border border-accent px-8 text-sm font-normal uppercase tracking-[var(--tracking-caps)] text-accent transition-colors duration-[400ms] ease-slow hover:bg-accent hover:text-accent-ink focus-visible:outline-1 focus-visible:outline-offset-4 focus-visible:outline-accent motion-reduce:transition-none">Confirm the viewing</button>
      </div>
    </div>
  </div>
  <!-- snippet:end -->
</body>
</html>
