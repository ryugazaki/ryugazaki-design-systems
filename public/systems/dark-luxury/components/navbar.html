<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dark Luxury / Navbar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Jost:wght@300;400;500&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
/* theme:start */
@custom-variant dark (&:where(.dark, .dark *));

@theme {
  --color-*: initial;
  --color-bg: #F2EEE6;
  --color-surface: #FAF8F3;
  --color-ink: #14130F;
  --color-muted: #6E695E;
  --color-line: #CFC8B8;
  --color-accent: #7D6440;
  --color-accent-ink: #F2EEE6;
  --color-danger: #8E2A20;

  --font-display: "Bodoni Moda", ui-serif, Georgia, serif;
  --font-body: "Jost", ui-sans-serif, sans-serif;

  --text-*: initial;
  --text-xs: 0.75rem;
  --text-xs--line-height: 1.5;
  --text-sm: 0.8125rem;
  --text-sm--line-height: 1.6;
  --text-base: 0.9375rem;
  --text-base--line-height: 1.75;
  --text-lg: 1.5rem;
  --text-lg--line-height: 1.3;
  --text-xl: 2.4375rem;
  --text-xl--line-height: 1.1;
  --text-2xl: 3.9375rem;
  --text-2xl--line-height: 1;
  --text-display: 6.375rem;
  --text-display--line-height: 0.92;

  --tracking-caps: 0.24em;

  --radius-*: initial;
  --shadow-*: initial;

  --ease-slow: cubic-bezier(0.22, 0.61, 0.36, 1);
  --default-transition-duration: 400ms;
  --default-transition-timing-function: cubic-bezier(0.22, 0.61, 0.36, 1);
}

@layer base {
  .dark {
    --color-bg: #0A0A0A;
    --color-surface: #121211;
    --color-ink: #E9E4D8;
    --color-muted: #8C877C;
    --color-line: #2A2826;
    --color-accent: #A88B5C;
    --color-accent-ink: #0A0A0A;
    --color-danger: #D98A7E;
  }
  body {
    background: var(--color-bg);
    color: var(--color-ink);
    font-family: var(--font-body);
    font-weight: 300;
    font-size: var(--text-base);
    -webkit-font-smoothing: antialiased;
  }
}
/* theme:end */
  </style>
</head>
<body class="p-6">
  <!-- snippet:start -->
  <header class="relative border-y border-line bg-bg">
    <div class="mx-auto grid min-h-20 max-w-6xl grid-cols-[1fr_auto_1fr] items-center gap-4 px-4 md:px-8">
      <div class="flex items-center">
        <details class="group md:hidden">
          <summary class="flex min-h-11 cursor-pointer list-none items-center gap-3 text-xs font-normal uppercase tracking-[var(--tracking-caps)] text-ink focus-visible:outline-1 focus-visible:outline-offset-4 focus-visible:outline-accent [&::-webkit-details-marker]:hidden">
            <svg aria-hidden="true" viewBox="0 0 20 10" class="h-2.5 w-5" fill="none" stroke="currentColor" stroke-width="1"><path class="group-open:hidden" d="M0 2h20M0 8h14"/><path class="hidden group-open:block" d="M5 0l10 10M15 0L5 10"/></svg>
            <span class="group-open:hidden">Menu</span>
            <span class="hidden group-open:inline">Close</span>
          </summary>
          <div class="absolute inset-x-0 top-full z-20 flex min-h-[calc(100svh-5rem)] flex-col justify-between border-t border-line bg-bg px-6 pt-6 pb-10">
            <nav aria-label="Main">
              <ul class="flex flex-col">
                <li><a href="#" class="flex min-h-14 items-center border-b border-line font-display text-xl text-ink focus-visible:outline-1 focus-visible:-outline-offset-1 focus-visible:outline-accent">Collection</a></li>
                <li><a href="#" class="flex min-h-14 items-center border-b border-line font-display text-xl text-ink focus-visible:outline-1 focus-visible:-outline-offset-1 focus-visible:outline-accent">The atelier</a></li>
                <li><a href="#" class="flex min-h-14 items-center border-b border-line font-display text-xl text-ink focus-visible:outline-1 focus-visible:-outline-offset-1 focus-visible:outline-accent">Salons</a></li>
                <li><a href="#" class="flex min-h-14 items-center border-b border-line font-display text-xl text-ink focus-visible:outline-1 focus-visible:-outline-offset-1 focus-visible:outline-accent">Journal</a></li>
              </ul>
            </nav>
            <div class="flex flex-col gap-6 pt-10">
              <a href="#" class="inline-flex min-h-12 items-center justify-center border border-accent px-8 text-sm font-normal uppercase tracking-[var(--tracking-caps)] text-accent transition-colors duration-[400ms] ease-slow hover:bg-accent hover:text-accent-ink focus-visible:outline-1 focus-visible:outline-offset-4 focus-visible:outline-accent motion-reduce:transition-none">Book a visit</a>
              <p class="text-center text-xs font-normal uppercase tracking-[var(--tracking-caps)] text-muted">Le Locle, Geneva, Paris, Tokyo</p>
            </div>
          </div>
        </details>
        <nav aria-label="Main" class="hidden md:block">
          <ul class="flex items-center gap-8">
            <li><a href="#" aria-current="page" class="inline-flex min-h-11 items-center text-xs font-normal uppercase tracking-[var(--tracking-caps)] text-ink underline decoration-accent decoration-1 underline-offset-8 focus-visible:outline-1 focus-visible:outline-offset-4 focus-visible:outline-accent">Collection</a></li>
            <li><a href="#" class="inline-flex min-h-11 items-center text-xs font-normal uppercase tracking-[var(--tracking-caps)] text-muted transition-colors duration-[400ms] ease-slow hover:text-ink focus-visible:outline-1 focus-visible:outline-offset-4 focus-visible:outline-accent motion-reduce:transition-none">The atelier</a></li>
            <li class="hidden lg:block"><a href="#" class="inline-flex min-h-11 items-center text-xs font-normal uppercase tracking-[var(--tracking-caps)] text-muted transition-colors duration-[400ms] ease-slow hover:text-ink focus-visible:outline-1 focus-visible:outline-offset-4 focus-visible:outline-accent motion-reduce:transition-none">Salons</a></li>
          </ul>
        </nav>
      </div>

      <a href="#" class="flex min-h-11 flex-col items-center justify-center gap-0.5 text-center focus-visible:outline-1 focus-visible:outline-offset-4 focus-visible:outline-accent">
        <span class="pl-[0.5em] text-xs font-normal uppercase tracking-[0.5em] text-muted">Maison</span>
        <span class="font-display text-lg leading-none text-ink md:text-xl md:leading-none">Ardent</span>
      </a>

      <div class="flex items-center justify-end gap-8">
        <a href="#" class="hidden min-h-11 items-center text-xs font-normal uppercase tracking-[var(--tracking-caps)] text-muted transition-colors duration-[400ms] ease-slow hover:text-ink focus-visible:outline-1 focus-visible:outline-offset-4 focus-visible:outline-accent motion-reduce:transition-none lg:inline-flex">Journal</a>
        <a href="#" class="hidden min-h-11 items-center justify-center border border-accent px-5 text-xs font-normal uppercase tracking-[var(--tracking-caps)] text-accent transition-colors duration-[400ms] ease-slow hover:bg-accent hover:text-accent-ink focus-visible:outline-1 focus-visible:outline-offset-4 focus-visible:outline-accent motion-reduce:transition-none md:inline-flex">Book a visit</a>
      </div>
    </div>
  </header>
  <!-- snippet:end -->
</body>
</html>
