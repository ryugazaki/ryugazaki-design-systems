<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dark Luxury / Button</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Jost:wght@300;400;500&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
/* theme:start */
@custom-variant dark (&:where(.dark, .dark *));

@theme {
  --color-*: initial;
  --color-bg: #F2EEE6;
  --color-surface: #FAF8F3;
  --color-ink: #14130F;
  --color-muted: #6E695E;
  --color-line: #CFC8B8;
  --color-accent: #7D6440;
  --color-accent-ink: #F2EEE6;
  --color-danger: #8E2A20;

  --font-display: "Bodoni Moda", ui-serif, Georgia, serif;
  --font-body: "Jost", ui-sans-serif, sans-serif;

  --text-*: initial;
  --text-xs: 0.75rem;
  --text-xs--line-height: 1.5;
  --text-sm: 0.8125rem;
  --text-sm--line-height: 1.6;
  --text-base: 0.9375rem;
  --text-base--line-height: 1.75;
  --text-lg: 1.5rem;
  --text-lg--line-height: 1.3;
  --text-xl: 2.4375rem;
  --text-xl--line-height: 1.1;
  --text-2xl: 3.9375rem;
  --text-2xl--line-height: 1;
  --text-display: 6.375rem;
  --text-display--line-height: 0.92;

  --tracking-caps: 0.24em;

  --radius-*: initial;
  --shadow-*: initial;

  --ease-slow: cubic-bezier(0.22, 0.61, 0.36, 1);
  --default-transition-duration: 400ms;
  --default-transition-timing-function: cubic-bezier(0.22, 0.61, 0.36, 1);
}

@layer base {
  .dark {
    --color-bg: #0A0A0A;
    --color-surface: #121211;
    --color-ink: #E9E4D8;
    --color-muted: #8C877C;
    --color-line: #2A2826;
    --color-accent: #A88B5C;
    --color-accent-ink: #0A0A0A;
    --color-danger: #D98A7E;
  }
  body {
    background: var(--color-bg);
    color: var(--color-ink);
    font-family: var(--font-body);
    font-weight: 300;
    font-size: var(--text-base);
    -webkit-font-smoothing: antialiased;
  }
}
/* theme:end */
  </style>
</head>
<body class="p-6">
  <!-- snippet:start -->
  <div class="flex max-w-2xl flex-col gap-12">
    <section class="flex flex-col gap-6">
      <p class="border-b border-line pb-3 text-xs font-normal uppercase tracking-[var(--tracking-caps)] text-muted">Variants</p>
      <div class="flex flex-wrap items-center gap-x-8 gap-y-4">
        <button type="button" class="inline-flex min-h-12 items-center justify-center border border-accent px-8 text-sm font-normal uppercase tracking-[var(--tracking-caps)] text-accent transition-colors duration-[400ms] ease-slow hover:bg-accent hover:text-accent-ink focus-visible:outline-1 focus-visible:outline-offset-4 focus-visible:outline-accent motion-reduce:transition-none">
          Request an appointment
        </button>
        <button type="button" class="inline-flex min-h-12 items-center text-sm font-normal uppercase tracking-[var(--tracking-caps)] text-ink underline decoration-muted decoration-1 underline-offset-8 transition-colors duration-[400ms] ease-slow hover:decoration-ink focus-visible:outline-1 focus-visible:outline-offset-4 focus-visible:outline-accent motion-reduce:transition-none">
          View the piece
        </button>
        <button type="button" class="inline-flex min-h-12 items-center px-2 text-sm font-normal uppercase tracking-[var(--tracking-caps)] text-muted transition-colors duration-[400ms] ease-slow hover:text-ink focus-visible:outline-1 focus-visible:outline-offset-4 focus-visible:outline-accent motion-reduce:transition-none">
          Not now
        </button>
        <button type="button" class="inline-flex min-h-12 items-center justify-center border border-danger px-8 text-sm font-normal uppercase tracking-[var(--tracking-caps)] text-danger transition-colors duration-[400ms] ease-slow hover:bg-danger hover:text-bg focus-visible:outline-1 focus-visible:outline-offset-4 focus-visible:outline-danger motion-reduce:transition-none">
          Cancel appointment
        </button>
      </div>
      <p class="max-w-md text-muted">The primary outline fills with brass over 400ms on hover. Use it once per screen.</p>
    </section>

    <section class="flex flex-col gap-6">
      <p class="border-b border-line pb-3 text-xs font-normal uppercase tracking-[var(--tracking-caps)] text-muted">Hover state, shown static</p>
      <div class="flex flex-wrap items-center gap-x-8 gap-y-4">
        <button type="button" class="inline-flex min-h-12 items-center justify-center border border-accent bg-accent px-8 text-sm font-normal uppercase tracking-[var(--tracking-caps)] text-accent-ink focus-visible:outline-1 focus-visible:outline-offset-4 focus-visible:outline-accent">
          Request an appointment
        </button>
      </div>
    </section>

    <section class="flex flex-col gap-6">
      <p class="border-b border-line pb-3 text-xs font-normal uppercase tracking-[var(--tracking-caps)] text-muted">Sizes and icon</p>
      <div class="flex flex-wrap items-center gap-x-8 gap-y-4">
        <button type="button" class="inline-flex min-h-11 items-center justify-center border border-accent px-5 text-xs font-normal uppercase tracking-[var(--tracking-caps)] text-accent transition-colors duration-[400ms] ease-slow hover:bg-accent hover:text-accent-ink focus-visible:outline-1 focus-visible:outline-offset-4 focus-visible:outline-accent motion-reduce:transition-none">
          Small
        </button>
        <button type="button" class="inline-flex min-h-12 items-center justify-center border border-accent px-8 text-sm font-normal uppercase tracking-[var(--tracking-caps)] text-accent transition-colors duration-[400ms] ease-slow hover:bg-accent hover:text-accent-ink focus-visible:outline-1 focus-visible:outline-offset-4 focus-visible:outline-accent motion-reduce:transition-none">
          Medium
        </button>
        <button type="button" class="inline-flex min-h-12 items-center gap-3 text-sm font-normal uppercase tracking-[var(--tracking-caps)] text-ink underline decoration-muted decoration-1 underline-offset-8 transition-colors duration-[400ms] ease-slow hover:decoration-ink focus-visible:outline-1 focus-visible:outline-offset-4 focus-visible:outline-accent motion-reduce:transition-none">
          <svg aria-hidden="true" viewBox="0 0 16 16" class="size-4 shrink-0" fill="none" stroke="currentColor" stroke-width="1"><circle cx="8" cy="8" r="6.5"/><path d="M8 4v4l2.5 1.5"/></svg>
          Reserve a viewing
        </button>
      </div>
    </section>

    <section class="flex flex-col gap-6">
      <p class="border-b border-line pb-3 text-xs font-normal uppercase tracking-[var(--tracking-caps)] text-muted">States</p>
      <div class="flex flex-wrap items-start gap-x-8 gap-y-6">
        <div class="flex flex-col gap-3">
          <button type="button" class="inline-flex min-h-12 items-center justify-center border border-accent px-8 text-sm font-normal uppercase tracking-[var(--tracking-caps)] text-accent outline-1 outline-offset-4 outline-accent">
            Focused
          </button>
          <p class="text-xs font-normal uppercase tracking-[var(--tracking-caps)] text-muted">Focus visible, 1px brass at 4px</p>
        </div>
        <div class="flex flex-col gap-3">
          <button type="button" aria-busy="true" class="inline-flex min-h-12 items-center justify-center gap-3 border border-accent px-8 text-sm font-normal uppercase tracking-[var(--tracking-caps)] text-accent focus-visible:outline-1 focus-visible:outline-offset-4 focus-visible:outline-accent">
            <svg aria-hidden="true" viewBox="0 0 16 16" class="size-4 animate-spin [animation-duration:2.4s] motion-reduce:animate-none" fill="none" stroke="currentColor" stroke-width="1"><path d="M8 1.5a6.5 6.5 0 1 0 6.5 6.5"/></svg>
            Saving
          </button>
        </div>
        <div class="flex flex-col gap-3">
          <button type="button" disabled class="inline-flex min-h-12 cursor-not-allowed items-center justify-center border border-line px-8 text-sm font-normal uppercase tracking-[var(--tracking-caps)] text-muted">
            Request an appointment
          </button>
          <p class="max-w-64 text-muted">Choose a date to continue.</p>
        </div>
      </div>
    </section>
  </div>
  <!-- snippet:end -->
</body>
</html>
