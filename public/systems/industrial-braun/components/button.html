<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Industrial / Braun / Button</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=Azeret+Mono:wght@400;500&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
/* theme:start */
@custom-variant dark (&:where(.dark, .dark *));

@theme {
  --color-*: initial;
  --color-bg: #EEECE6;
  --color-surface: #F7F6F2;
  --color-panel: #D7D4CC;
  --color-ink: #1E1E1C;
  --color-muted: #5F5D57;
  --color-line: #C9C6BD;
  --color-accent: #C2410C;
  --color-accent-ink: #FFFFFF;
  --color-led: #2F7D4F;

  --font-display: "Albert Sans", ui-sans-serif, sans-serif;
  --font-body: "Albert Sans", ui-sans-serif, sans-serif;
  --font-mono: "Azeret Mono", ui-monospace, monospace;

  --text-*: initial;
  --text-xs: 0.75rem;
  --text-xs--line-height: 1.4;
  --text-sm: 0.8125rem;
  --text-sm--line-height: 1.45;
  --text-base: 0.9375rem;
  --text-base--line-height: 1.55;
  --text-lg: 1.25rem;
  --text-lg--line-height: 1.35;
  --text-xl: 1.6875rem;
  --text-xl--line-height: 1.2;
  --text-2xl: 2.25rem;
  --text-2xl--line-height: 1.1;
  --text-display: 3rem;
  --text-display--line-height: 1.02;

  --radius-*: initial;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-full: 9999px;

  --shadow-*: initial;
  --shadow-key: inset 0 -2px 0 0 rgb(30 30 28 / 0.18);

  --ease-detent: cubic-bezier(0.3, 0, 0, 1);
}

@layer base {
  .dark {
    --color-bg: #191917;
    --color-surface: #222220;
    --color-panel: #2B2B28;
    --color-ink: #E9E7E1;
    --color-muted: #A3A098;
    --color-line: #3A3936;
    --color-accent: #F06A2E;
    --color-accent-ink: #191917;
    --color-led: #5BC489;
  }
  body {
    background: var(--color-bg);
    color: var(--color-ink);
    font-family: var(--font-body);
    font-size: var(--text-base);
    -webkit-font-smoothing: antialiased;
  }
}
/* theme:end */
  </style>
</head>
<body class="p-6">
  <!-- snippet:start -->
  <div class="flex max-w-2xl flex-col gap-4">
    <section aria-labelledby="keys-variants" class="rounded-md bg-surface p-6">
      <h2 id="keys-variants" class="font-mono text-xs text-muted">variants</h2>
      <div class="mt-6 flex flex-wrap items-start gap-x-4 gap-y-6">
        <div class="flex flex-col items-start gap-2">
          <button type="button" class="inline-flex min-h-11 items-center justify-center gap-2 rounded-md bg-accent px-5 text-sm font-medium text-accent-ink shadow-key transition-[filter,box-shadow] duration-150 ease-detent hover:brightness-95 active:shadow-none active:brightness-90 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ink motion-reduce:transition-none">Save preset</button>
          <span class="font-mono text-xs text-muted">primary</span>
        </div>
        <div class="flex flex-col items-start gap-2">
          <button type="button" class="inline-flex min-h-11 items-center justify-center gap-2 rounded-md bg-panel px-5 text-sm font-medium text-ink shadow-key transition-[background-color,box-shadow] duration-150 ease-detent hover:bg-line active:bg-line active:shadow-none dark:shadow-bg dark:active:bg-bg focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ink motion-reduce:transition-none">Pair sensor</button>
          <span class="font-mono text-xs text-muted">secondary</span>
        </div>
        <div class="flex flex-col items-start gap-2">
          <button type="button" class="inline-flex min-h-11 items-center gap-2 rounded-md px-3 text-sm font-medium text-ink underline-offset-4 hover:underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ink">
            Reset
            <span class="font-mono text-xs font-normal text-muted">hold 2 s</span>
          </button>
          <span class="px-3 font-mono text-xs text-muted">ghost</span>
        </div>
        <div class="flex flex-col items-start gap-2">
          <button type="button" class="inline-flex min-h-11 items-center justify-center gap-2.5 rounded-md bg-ink px-5 text-sm font-medium text-bg shadow-key transition-[background-color,box-shadow] duration-150 ease-detent hover:bg-muted active:shadow-none focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ink motion-reduce:transition-none">
            <span aria-hidden="true" class="size-2 bg-bg"></span>
            Remove sensor
          </button>
          <span class="font-mono text-xs text-muted">destructive</span>
        </div>
      </div>
    </section>

    <section aria-labelledby="keys-sizes" class="rounded-md bg-surface p-6">
      <h2 id="keys-sizes" class="font-mono text-xs text-muted">sizes and symbol</h2>
      <div class="mt-6 flex flex-wrap items-start gap-x-4 gap-y-6">
        <div class="flex flex-col items-start gap-2">
          <button type="button" class="inline-flex min-h-11 items-center justify-center rounded-md px-1 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ink group">
            <span class="inline-flex min-h-8 items-center rounded-md bg-panel px-3 text-xs font-medium text-ink shadow-key transition-[background-color,box-shadow] duration-150 ease-detent group-hover:bg-line group-active:bg-line group-active:shadow-none dark:shadow-bg dark:group-active:bg-bg motion-reduce:transition-none">Mute</span>
          </button>
          <span class="font-mono text-xs text-muted">sm, 32 px face</span>
        </div>
        <div class="flex flex-col items-start gap-2">
          <button type="button" class="inline-flex min-h-11 items-center justify-center rounded-md bg-panel px-5 text-sm font-medium text-ink shadow-key transition-[background-color,box-shadow] duration-150 ease-detent hover:bg-line active:bg-line active:shadow-none dark:shadow-bg dark:active:bg-bg focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ink motion-reduce:transition-none">Next preset</button>
          <span class="font-mono text-xs text-muted">md, 44 px</span>
        </div>
        <div class="flex flex-col items-start gap-2">
          <button type="button" class="inline-flex min-h-11 items-center justify-center gap-2 rounded-md bg-panel px-5 text-sm font-medium text-ink shadow-key transition-[background-color,box-shadow] duration-150 ease-detent hover:bg-line active:bg-line active:shadow-none dark:shadow-bg dark:active:bg-bg focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ink motion-reduce:transition-none">
            <svg aria-hidden="true" viewBox="0 0 16 16" class="size-4" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M8 1.5v6"/><path d="M4.4 3.9a5.5 5.5 0 1 0 7.2 0"/></svg>
            Radio on
          </button>
          <span class="font-mono text-xs text-muted">leading symbol</span>
        </div>
        <div class="flex flex-col items-start gap-2">
          <button type="button" aria-label="Volume down" class="inline-flex size-11 items-center justify-center rounded-md bg-panel text-ink shadow-key transition-[background-color,box-shadow] duration-150 ease-detent hover:bg-line active:bg-line active:shadow-none dark:shadow-bg dark:active:bg-bg focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ink motion-reduce:transition-none">
            <svg aria-hidden="true" viewBox="0 0 16 16" class="size-4" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M3 8h10"/></svg>
          </button>
          <span class="font-mono text-xs text-muted">vol</span>
        </div>
      </div>
    </section>

    <section aria-labelledby="keys-states" class="rounded-md bg-surface p-6">
      <h2 id="keys-states" class="font-mono text-xs text-muted">states</h2>
      <div class="mt-6 flex flex-wrap items-start gap-x-4 gap-y-6">
        <div class="flex flex-col items-start gap-2">
          <button type="button" class="inline-flex min-h-11 items-center justify-center rounded-md bg-panel px-5 text-sm font-medium text-ink shadow-key outline-2 outline-offset-2 outline-ink dark:shadow-bg">Pair sensor</button>
          <span class="font-mono text-xs text-muted">focus visible</span>
        </div>
        <div class="flex flex-col items-start gap-2">
          <button type="button" aria-pressed="true" class="inline-flex min-h-11 items-center justify-center rounded-md bg-line px-5 text-sm font-medium text-ink focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ink dark:bg-bg">Loudness</button>
          <span class="font-mono text-xs text-muted">pressed, no inset line</span>
        </div>
        <div class="flex flex-col items-start gap-2">
          <button type="button" aria-busy="true" class="inline-flex min-h-11 items-center justify-center gap-2 rounded-md bg-panel px-5 text-sm font-medium text-ink shadow-key dark:shadow-bg focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ink">
            <svg aria-hidden="true" viewBox="0 0 16 16" class="size-4 animate-spin motion-reduce:animate-none" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M8 2a6 6 0 1 1 -6 6"/></svg>
            Saving
          </button>
          <span class="font-mono text-xs text-muted">busy</span>
        </div>
        <div class="flex flex-col items-start gap-2">
          <button type="button" disabled aria-describedby="sync-reason" class="inline-flex min-h-11 cursor-not-allowed items-center justify-center rounded-md border border-dashed border-muted px-5 text-sm font-medium text-muted">Sync radio</button>
          <span id="sync-reason" class="max-w-48 font-mono text-xs text-muted">disabled: link a radio to this panel first.</span>
        </div>
      </div>
    </section>
  </div>
  <!-- snippet:end -->
</body>
</html>
