<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Industrial / Braun / Select</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=Azeret+Mono:wght@400;500&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
/* theme:start */
@custom-variant dark (&:where(.dark, .dark *));

@theme {
  --color-*: initial;
  --color-bg: #EEECE6;
  --color-surface: #F7F6F2;
  --color-panel: #D7D4CC;
  --color-ink: #1E1E1C;
  --color-muted: #5F5D57;
  --color-line: #C9C6BD;
  --color-accent: #C2410C;
  --color-accent-ink: #FFFFFF;
  --color-led: #2F7D4F;

  --font-display: "Albert Sans", ui-sans-serif, sans-serif;
  --font-body: "Albert Sans", ui-sans-serif, sans-serif;
  --font-mono: "Azeret Mono", ui-monospace, monospace;

  --text-*: initial;
  --text-xs: 0.75rem;
  --text-xs--line-height: 1.4;
  --text-sm: 0.8125rem;
  --text-sm--line-height: 1.45;
  --text-base: 0.9375rem;
  --text-base--line-height: 1.55;
  --text-lg: 1.25rem;
  --text-lg--line-height: 1.35;
  --text-xl: 1.6875rem;
  --text-xl--line-height: 1.2;
  --text-2xl: 2.25rem;
  --text-2xl--line-height: 1.1;
  --text-display: 3rem;
  --text-display--line-height: 1.02;

  --radius-*: initial;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-full: 9999px;

  --shadow-*: initial;
  --shadow-key: inset 0 -2px 0 0 rgb(30 30 28 / 0.18);

  --ease-detent: cubic-bezier(0.3, 0, 0, 1);
}

@layer base {
  .dark {
    --color-bg: #191917;
    --color-surface: #222220;
    --color-panel: #2B2B28;
    --color-ink: #E9E7E1;
    --color-muted: #A3A098;
    --color-line: #3A3936;
    --color-accent: #F06A2E;
    --color-accent-ink: #191917;
    --color-led: #5BC489;
  }
  body {
    background: var(--color-bg);
    color: var(--color-ink);
    font-family: var(--font-body);
    font-size: var(--text-base);
    -webkit-font-smoothing: antialiased;
  }
}
/* theme:end */
  </style>
</head>
<body class="p-6">
  <!-- snippet:start -->
  <div class="flex max-w-md flex-col gap-8 rounded-md bg-surface p-6">
    <div class="flex flex-col gap-2">
      <label for="report-interval" class="font-mono text-xs text-muted">report interval</label>
      <div class="relative">
        <select id="report-interval" aria-describedby="report-interval-hint" class="min-h-11 w-full cursor-pointer appearance-none rounded-md border border-ink bg-panel py-2 pr-12 pl-3 text-base text-ink focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ink">
          <option>Every 30 seconds</option>
          <option selected>Every 2 minutes</option>
          <option>Every 10 minutes</option>
          <option>Every 30 minutes</option>
        </select>
        <svg aria-hidden="true" viewBox="0 0 10 8" class="pointer-events-none absolute top-1/2 right-4 h-2 w-2.5 -translate-y-1/2 fill-ink"><path d="M0 0h10L5 8z"/></svg>
      </div>
      <p id="report-interval-hint" class="text-sm text-muted">The default keeps the battery going for about two years.</p>
      <ol aria-hidden="true" class="mt-1 grid grid-cols-4 border-t border-muted pt-2 font-mono text-xs text-muted">
        <li class="relative before:absolute before:-top-2 before:left-0 before:h-1.5 before:w-px before:bg-muted">30 s</li>
        <li class="relative font-medium text-ink before:absolute before:-top-2 before:left-0 before:h-2.5 before:w-0.5 before:bg-ink">2 min</li>
        <li class="relative before:absolute before:-top-2 before:left-0 before:h-1.5 before:w-px before:bg-muted">10 min</li>
        <li class="relative before:absolute before:-top-2 before:left-0 before:h-1.5 before:w-px before:bg-muted">30 min</li>
      </ol>
    </div>

    <div class="flex flex-col gap-2">
      <label for="display-units" class="font-mono text-xs text-muted">display units</label>
      <div class="relative">
        <select id="display-units" aria-describedby="display-units-hint" class="min-h-11 w-full cursor-pointer appearance-none rounded-md border border-ink bg-panel py-2 pr-12 pl-3 font-mono text-sm text-ink focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ink">
          <option selected>°c, %, ppm</option>
          <option>°f, %, ppm</option>
        </select>
        <svg aria-hidden="true" viewBox="0 0 10 8" class="pointer-events-none absolute top-1/2 right-4 h-2 w-2.5 -translate-y-1/2 fill-ink"><path d="M0 0h10L5 8z"/></svg>
      </div>
      <p id="display-units-hint" class="text-sm text-muted">Applies to every sensor in the house.</p>
    </div>
  </div>
  <!-- snippet:end -->
</body>
</html>
