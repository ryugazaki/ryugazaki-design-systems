<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Industrial / Braun / Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=Azeret+Mono:wght@400;500&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
/* theme:start */
@custom-variant dark (&:where(.dark, .dark *));

@theme {
  --color-*: initial;
  --color-bg: #EEECE6;
  --color-surface: #F7F6F2;
  --color-panel: #D7D4CC;
  --color-ink: #1E1E1C;
  --color-muted: #5F5D57;
  --color-line: #C9C6BD;
  --color-accent: #C2410C;
  --color-accent-ink: #FFFFFF;
  --color-led: #2F7D4F;

  --font-display: "Albert Sans", ui-sans-serif, sans-serif;
  --font-body: "Albert Sans", ui-sans-serif, sans-serif;
  --font-mono: "Azeret Mono", ui-monospace, monospace;

  --text-*: initial;
  --text-xs: 0.75rem;
  --text-xs--line-height: 1.4;
  --text-sm: 0.8125rem;
  --text-sm--line-height: 1.45;
  --text-base: 0.9375rem;
  --text-base--line-height: 1.55;
  --text-lg: 1.25rem;
  --text-lg--line-height: 1.35;
  --text-xl: 1.6875rem;
  --text-xl--line-height: 1.2;
  --text-2xl: 2.25rem;
  --text-2xl--line-height: 1.1;
  --text-display: 3rem;
  --text-display--line-height: 1.02;

  --radius-*: initial;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-full: 9999px;

  --shadow-*: initial;
  --shadow-key: inset 0 -2px 0 0 rgb(30 30 28 / 0.18);

  --ease-detent: cubic-bezier(0.3, 0, 0, 1);
}

@layer base {
  .dark {
    --color-bg: #191917;
    --color-surface: #222220;
    --color-panel: #2B2B28;
    --color-ink: #E9E7E1;
    --color-muted: #A3A098;
    --color-line: #3A3936;
    --color-accent: #F06A2E;
    --color-accent-ink: #191917;
    --color-led: #5BC489;
  }
  body {
    background: var(--color-bg);
    color: var(--color-ink);
    font-family: var(--font-body);
    font-size: var(--text-base);
    -webkit-font-smoothing: antialiased;
  }
}
/* theme:end */
  </style>
</head>
<body class="p-6">
  <!-- snippet:start -->
  <div class="flex max-w-2xl flex-col items-start gap-4 sm:flex-row">
    <article aria-labelledby="card-living" class="w-full max-w-sm rounded-md bg-surface p-5">
      <header class="flex items-start justify-between gap-4">
        <div>
          <h2 id="card-living" class="text-base font-semibold text-ink">Living room</h2>
          <p class="font-mono text-xs text-muted">sensor s1, bookshelf</p>
        </div>
        <p class="flex min-h-6 items-center gap-2 font-mono text-xs text-ink">
          <span aria-hidden="true" class="size-2 rounded-full bg-led"></span>on
        </p>
      </header>

      <div class="mt-6 flex items-end justify-between gap-4">
        <p class="flex items-start gap-1.5">
          <span class="font-display text-display font-medium tracking-tight tabular-nums text-ink">21.4</span>
          <span class="mt-2 font-mono text-xs text-muted">°c<span class="sr-only"> now</span></span>
        </p>
        <figure class="flex flex-col items-center gap-1">
          <svg role="img" aria-label="Target dial set to 21.5 degrees, range 15 to 25" viewBox="0 0 64 64" class="size-16">
            <path d="M7.27 40.03L3.47 41.27M6.32 27.93L2.37 27.31M10.97 16.72L7.73 14.37M20.2 8.83L18.38 5.27M43.8 8.83L45.62 5.27M53.03 16.72L56.27 14.37M57.68 27.93L61.63 27.31M56.73 40.03L60.53 41.27" class="stroke-muted" stroke-width="1"/>
            <path d="M16.44 47.56L10.79 53.21M32 10L32 2M47.56 47.56L53.21 53.21" class="stroke-ink" stroke-width="1.5"/>
            <circle cx="32" cy="32" r="20" class="fill-panel stroke-ink" stroke-width="1"/>
            <path d="M32 25L32 15" class="stroke-ink" stroke-width="2.5" stroke-linecap="round" transform="rotate(40.5 32 32)"/>
          </svg>
          <figcaption class="font-mono text-xs text-muted">target 21.5</figcaption>
        </figure>
      </div>

      <dl class="mt-5 grid grid-cols-2 gap-px overflow-hidden rounded-md bg-line">
        <div class="bg-panel px-3 py-2.5">
          <dt class="font-mono text-xs text-ink">humidity</dt>
          <dd class="mt-0.5 text-lg font-medium tabular-nums text-ink">46 <span class="font-mono text-xs font-normal">%</span></dd>
        </div>
        <div class="bg-panel px-3 py-2.5">
          <dt class="font-mono text-xs text-ink">air</dt>
          <dd class="mt-0.5 text-lg font-medium tabular-nums text-ink">612 <span class="font-mono text-xs font-normal">ppm</span></dd>
        </div>
      </dl>
      <p class="mt-4 font-mono text-xs text-muted">last report 14:08, battery 82 %</p>
    </article>

    <article aria-labelledby="card-bedroom" class="flex w-full max-w-60 items-center gap-4 rounded-md bg-surface p-4">
      <div class="flex-1">
        <h2 id="card-bedroom" class="flex items-center gap-2 text-sm font-semibold text-ink">
          <span aria-hidden="true" class="size-2 rounded-full bg-led"></span>Bedroom
        </h2>
        <p class="mt-1 flex items-baseline gap-1">
          <span class="text-xl font-medium tabular-nums text-ink">51</span>
          <span class="font-mono text-xs text-muted">% humidity</span>
        </p>
      </div>
      <div aria-hidden="true" class="flex h-10 items-end gap-0.5">
        <span class="h-1/5 w-1.5 rounded-[1px] bg-ink"></span>
        <span class="h-2/5 w-1.5 rounded-[1px] bg-ink"></span>
        <span class="h-3/5 w-1.5 rounded-[1px] bg-ink"></span>
        <span class="h-4/5 w-1.5 rounded-[1px] bg-line"></span>
        <span class="h-full w-1.5 rounded-[1px] bg-line"></span>
      </div>
    </article>
  </div>
  <!-- snippet:end -->
</body>
</html>
