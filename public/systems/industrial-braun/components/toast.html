<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Industrial / Braun / Toast</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=Azeret+Mono:wght@400;500&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
/* theme:start */
@custom-variant dark (&:where(.dark, .dark *));

@theme {
  --color-*: initial;
  --color-bg: #EEECE6;
  --color-surface: #F7F6F2;
  --color-panel: #D7D4CC;
  --color-ink: #1E1E1C;
  --color-muted: #5F5D57;
  --color-line: #C9C6BD;
  --color-accent: #C2410C;
  --color-accent-ink: #FFFFFF;
  --color-led: #2F7D4F;

  --font-display: "Albert Sans", ui-sans-serif, sans-serif;
  --font-body: "Albert Sans", ui-sans-serif, sans-serif;
  --font-mono: "Azeret Mono", ui-monospace, monospace;

  --text-*: initial;
  --text-xs: 0.75rem;
  --text-xs--line-height: 1.4;
  --text-sm: 0.8125rem;
  --text-sm--line-height: 1.45;
  --text-base: 0.9375rem;
  --text-base--line-height: 1.55;
  --text-lg: 1.25rem;
  --text-lg--line-height: 1.35;
  --text-xl: 1.6875rem;
  --text-xl--line-height: 1.2;
  --text-2xl: 2.25rem;
  --text-2xl--line-height: 1.1;
  --text-display: 3rem;
  --text-display--line-height: 1.02;

  --radius-*: initial;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-full: 9999px;

  --shadow-*: initial;
  --shadow-key: inset 0 -2px 0 0 rgb(30 30 28 / 0.18);

  --ease-detent: cubic-bezier(0.3, 0, 0, 1);
}

@layer base {
  .dark {
    --color-bg: #191917;
    --color-surface: #222220;
    --color-panel: #2B2B28;
    --color-ink: #E9E7E1;
    --color-muted: #A3A098;
    --color-line: #3A3936;
    --color-accent: #F06A2E;
    --color-accent-ink: #191917;
    --color-led: #5BC489;
  }
  body {
    background: var(--color-bg);
    color: var(--color-ink);
    font-family: var(--font-body);
    font-size: var(--text-base);
    -webkit-font-smoothing: antialiased;
  }
}
/* theme:end */
  </style>
</head>
<body class="p-6">
  <!-- snippet:start -->
  <div class="flex max-w-md flex-col gap-3">
    <div role="status" class="flex items-center gap-3 rounded-md bg-panel py-1 pr-1 pl-4 transition-[translate,opacity] duration-300 ease-detent starting:translate-y-2 starting:opacity-0 motion-reduce:transition-none">
      <span aria-hidden="true" class="size-2 shrink-0 rounded-full bg-led"></span>
      <p class="min-w-0 flex-1 py-2 text-sm text-ink">Preset 2 saved to the radio.</p>
      <span class="shrink-0 font-mono text-xs tabular-nums text-ink">14:10</span>
      <button type="button" aria-label="Dismiss" class="inline-flex size-11 shrink-0 items-center justify-center rounded-md text-ink hover:bg-line focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-ink dark:hover:bg-bg">
        <svg aria-hidden="true" viewBox="0 0 16 16" class="size-3.5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></svg>
      </button>
    </div>

    <div role="status" class="flex items-center gap-3 rounded-md border border-ink bg-panel py-1 pr-1 pl-4">
      <span aria-hidden="true" class="size-2 shrink-0 bg-ink"></span>
      <p class="min-w-0 flex-1 py-2 text-sm font-medium text-ink">Hallway sensor stopped reporting. Check its battery.</p>
      <span class="shrink-0 font-mono text-xs tabular-nums text-ink">13:52</span>
      <button type="button" aria-label="Dismiss" class="inline-flex size-11 shrink-0 items-center justify-center rounded-md text-ink hover:bg-line focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-ink dark:hover:bg-bg">
        <svg aria-hidden="true" viewBox="0 0 16 16" class="size-3.5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></svg>
      </button>
    </div>
  </div>
  <!-- snippet:end -->
</body>
</html>
