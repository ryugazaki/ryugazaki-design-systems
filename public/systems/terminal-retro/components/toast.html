<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Terminal / Retro / Toast</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=VT323&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
/* theme:start */
@custom-variant dark (&:where(.dark, .dark *));

@theme {
  --color-*: initial;
  --color-bg: #EDEAD8;
  --color-surface: #F6F4E8;
  --color-ink: #1D2B1F;
  --color-muted: #5C6B5E;
  --color-line: #1D2B1F;
  --color-accent: #1F7A3A;
  --color-accent-ink: #EDEAD8;
  --color-amber: #9A5B00;
  --color-danger: #B3261E;

  --font-display: "VT323", ui-monospace, monospace;
  --font-body: "JetBrains Mono", ui-monospace, monospace;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;

  --text-*: initial;
  --text-xs: 0.75rem;
  --text-xs--line-height: 1.5;
  --text-sm: 0.8125rem;
  --text-sm--line-height: 1.5;
  --text-base: 0.875rem;
  --text-base--line-height: 1.6;
  --text-lg: 1.1875rem;
  --text-lg--line-height: 1.4;
  --text-xl: 1.5625rem;
  --text-xl--line-height: 1.2;
  --text-2xl: 2.0625rem;
  --text-2xl--line-height: 1;
  --text-display: 4.5rem;
  --text-display--line-height: 0.9;

  --radius-*: initial;
  --shadow-*: initial;

  --animate-blink: blink 1s steps(1) infinite;
  @keyframes blink {
    50% { opacity: 0; }
  }
}

@layer base {
  .dark {
    --color-bg: #0B0F0C;
    --color-surface: #111812;
    --color-ink: #C8F5D2;
    --color-muted: #5E7A64;
    --color-line: #2B3A2F;
    --color-accent: #7CF29A;
    --color-accent-ink: #0B0F0C;
    --color-amber: #FFB547;
    --color-danger: #FF6B5B;
  }
  body {
    background: var(--color-bg);
    color: var(--color-ink);
    font-family: var(--font-body);
    font-size: var(--text-base);
  }
}
/* theme:end */
  </style>
</head>
<body class="p-6">
  <!-- snippet:start -->
  <div class="flex max-w-xl flex-col gap-3">
    <p class="text-xs text-muted dark:text-ink/60"># newest at the bottom, like a log</p>
    <ol class="flex flex-col border border-line bg-surface">
      <li role="status" class="flex items-start gap-2 py-1 pr-1 pl-3 text-sm">
        <p class="flex min-w-0 flex-1 flex-wrap gap-x-2 py-2.5"><span class="text-muted dark:text-ink/60 tabular-nums">14:01:40</span><span class="font-bold text-accent">[ok]</span><span class="text-ink">Retried 64 jobs on thumbs.render. All passed.</span></p>
        <button type="button" aria-label="Dismiss" class="flex size-11 shrink-0 items-center justify-center text-muted hover:bg-bg hover:text-ink dark:text-ink/60 focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-dashed focus-visible:outline-accent">[x]</button>
      </li>
      <li role="status" class="flex items-start gap-2 border-t border-line py-1 pr-1 pl-3 text-sm">
        <p class="flex min-w-0 flex-1 flex-wrap gap-x-2 py-2.5"><span class="text-muted dark:text-ink/60 tabular-nums">14:02:04</span><span class="font-bold text-amber">[warn]</span><span class="text-ink">billing.charge p95 is 1,920 ms, over the 1,500 ms budget.</span></p>
        <button type="button" aria-label="Dismiss" class="flex size-11 shrink-0 items-center justify-center text-muted hover:bg-bg hover:text-ink dark:text-ink/60 focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-dashed focus-visible:outline-accent">[x]</button>
      </li>
      <li role="status" class="flex items-start gap-2 border-t border-line py-1 pr-1 pl-3 text-sm">
        <p class="flex min-w-0 flex-1 flex-wrap gap-x-2 py-2.5"><span class="text-muted dark:text-ink/60 tabular-nums">14:02:09</span><span class="font-bold text-danger">[err]</span><span class="text-ink">Worker w09 lost its connection. 3 jobs moved back to billing.charge.</span></p>
        <button type="button" aria-label="Dismiss" class="flex size-11 shrink-0 items-center justify-center text-muted hover:bg-bg hover:text-ink dark:text-ink/60 focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-dashed focus-visible:outline-accent">[x]</button>
      </li>
    </ol>
  </div>
  <!-- snippet:end -->
</body>
</html>
