<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Terminal / Retro / Checkbox and toggle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=VT323&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
/* theme:start */
@custom-variant dark (&:where(.dark, .dark *));

@theme {
  --color-*: initial;
  --color-bg: #EDEAD8;
  --color-surface: #F6F4E8;
  --color-ink: #1D2B1F;
  --color-muted: #5C6B5E;
  --color-line: #1D2B1F;
  --color-accent: #1F7A3A;
  --color-accent-ink: #EDEAD8;
  --color-amber: #9A5B00;
  --color-danger: #B3261E;

  --font-display: "VT323", ui-monospace, monospace;
  --font-body: "JetBrains Mono", ui-monospace, monospace;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;

  --text-*: initial;
  --text-xs: 0.75rem;
  --text-xs--line-height: 1.5;
  --text-sm: 0.8125rem;
  --text-sm--line-height: 1.5;
  --text-base: 0.875rem;
  --text-base--line-height: 1.6;
  --text-lg: 1.1875rem;
  --text-lg--line-height: 1.4;
  --text-xl: 1.5625rem;
  --text-xl--line-height: 1.2;
  --text-2xl: 2.0625rem;
  --text-2xl--line-height: 1;
  --text-display: 4.5rem;
  --text-display--line-height: 0.9;

  --radius-*: initial;
  --shadow-*: initial;

  --animate-blink: blink 1s steps(1) infinite;
  @keyframes blink {
    50% { opacity: 0; }
  }
}

@layer base {
  .dark {
    --color-bg: #0B0F0C;
    --color-surface: #111812;
    --color-ink: #C8F5D2;
    --color-muted: #5E7A64;
    --color-line: #2B3A2F;
    --color-accent: #7CF29A;
    --color-accent-ink: #0B0F0C;
    --color-amber: #FFB547;
    --color-danger: #FF6B5B;
  }
  body {
    background: var(--color-bg);
    color: var(--color-ink);
    font-family: var(--font-body);
    font-size: var(--text-base);
  }
}
/* theme:end */
  </style>
</head>
<body class="p-6">
  <!-- snippet:start -->
  <div class="flex max-w-lg flex-col gap-8">
    <section class="relative mt-2.5 border border-line bg-surface px-4 pt-5 pb-3">
      <h2 class="absolute -top-2.5 left-3 bg-surface px-1.5 text-xs leading-5 text-ink">alerts.conf</h2>
      <div class="flex flex-col">
        <label class="group flex min-h-11 cursor-pointer items-start gap-3 py-2">
          <input type="checkbox" name="page-on-stall" checked class="peer sr-only">
          <span aria-hidden="true" class="shrink-0 font-bold text-ink peer-checked:hidden">[&nbsp;]</span>
          <span aria-hidden="true" class="hidden shrink-0 font-bold text-accent peer-checked:inline">[x]</span>
          <span class="flex flex-col gap-0.5 peer-focus-visible:outline-2 peer-focus-visible:outline-offset-2 peer-focus-visible:outline-dashed peer-focus-visible:outline-accent">
            <span class="text-ink">Page on-call when a queue stalls</span>
            <span class="text-xs text-muted dark:text-ink/60"># no progress for 5 minutes counts as stalled</span>
          </span>
        </label>
        <label class="group flex min-h-11 cursor-pointer items-start gap-3 py-2">
          <input type="checkbox" name="page-on-retry" class="peer sr-only">
          <span aria-hidden="true" class="shrink-0 font-bold text-ink peer-checked:hidden">[&nbsp;]</span>
          <span aria-hidden="true" class="hidden shrink-0 font-bold text-accent peer-checked:inline">[x]</span>
          <span class="flex flex-col gap-0.5 peer-focus-visible:outline-2 peer-focus-visible:outline-offset-2 peer-focus-visible:outline-dashed peer-focus-visible:outline-accent">
            <span class="text-ink">Page on every retry</span>
            <span class="text-xs text-muted dark:text-ink/60"># loud. Most teams leave this off.</span>
          </span>
        </label>
      </div>
    </section>

    <section class="relative mt-2.5 border border-line bg-surface px-4 pt-5 pb-3">
      <h2 class="absolute -top-2.5 left-3 bg-surface px-1.5 text-xs leading-5 text-ink">billing.charge</h2>
      <div class="flex flex-col divide-y divide-line">
        <button type="button" role="switch" aria-checked="true" aria-labelledby="sw-retry-label" class="flex min-h-12 w-full items-center justify-between gap-4 py-2 text-left focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-dashed focus-visible:outline-accent">
          <span class="flex flex-col">
            <span id="sw-retry-label" class="text-ink">Auto-retry failed jobs</span>
            <span class="text-xs text-muted dark:text-ink/60"># up to 5 attempts, backoff 2x</span>
          </span>
          <span aria-hidden="true" class="flex shrink-0 border border-line text-xs dark:border-muted">
            <span class="bg-accent px-2 py-1 font-bold text-surface">on</span>
            <span class="px-2 py-1 text-muted dark:text-ink/60">off</span>
          </span>
        </button>
        <button type="button" role="switch" aria-checked="false" aria-labelledby="sw-pause-label" class="flex min-h-12 w-full items-center justify-between gap-4 py-2 text-left focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-dashed focus-visible:outline-accent">
          <span class="flex flex-col">
            <span id="sw-pause-label" class="text-ink">Pause intake</span>
            <span class="text-xs text-muted dark:text-ink/60"># new jobs wait, running jobs finish</span>
          </span>
          <span aria-hidden="true" class="flex shrink-0 border border-line text-xs dark:border-muted">
            <span class="px-2 py-1 text-muted dark:text-ink/60">on</span>
            <span class="bg-ink px-2 py-1 font-bold text-bg">off</span>
          </span>
        </button>
      </div>
    </section>
  </div>
  <!-- snippet:end -->
</body>
</html>
