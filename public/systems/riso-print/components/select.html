<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Riso Print / Select</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,100..900&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
/* theme:start */
@custom-variant dark (&:where(.dark, .dark *));

@theme {
  --color-*: initial;
  --color-bg: #F4EFE4;
  --color-surface: #FBF8F1;
  --color-ink: #1B1A33;
  --color-muted: #5B5870;
  --color-line: #1B1A33;
  --color-blue: #2A4BCB;
  --color-pink: #FF48B0;
  --color-blue-ink: #FBF8F1;
  --color-pink-ink: #1B1A33;

  --font-display: "Anybody", ui-sans-serif, sans-serif;
  --font-body: "Courier Prime", ui-monospace, monospace;

  --text-*: initial;
  --text-xs: 0.75rem;
  --text-xs--line-height: 1.4;
  --text-sm: 0.875rem;
  --text-sm--line-height: 1.5;
  --text-base: 1rem;
  --text-base--line-height: 1.6;
  --text-lg: 1.5rem;
  --text-lg--line-height: 1.25;
  --text-xl: 2.25rem;
  --text-xl--line-height: 1.05;
  --text-2xl: 3.375rem;
  --text-2xl--line-height: 0.95;
  --text-display: 4.5rem;
  --text-display--line-height: 0.9;

  --radius-*: initial;
  --radius-full: 9999px;

  --shadow-*: initial;
}

@utility bg-halftone { background-image: radial-gradient(currentColor 1.1px, transparent 1.6px); background-size: 7px 7px; }

@layer base {
  .dark {
    --color-bg: #16151F;
    --color-surface: #1F1D2B;
    --color-ink: #F1ECDF;
    --color-muted: #B4AFC2;
    --color-line: #F1ECDF;
    --color-blue: #6F8CFF;
    --color-pink: #FF5DBA;
    --color-blue-ink: #16151F;
    --color-pink-ink: #16151F;
  }
  body {
    background: var(--color-bg);
    color: var(--color-ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
}
/* theme:end */
  </style>
</head>
<body class="p-6">
  <!-- snippet:start -->
  <div class="flex max-w-md flex-col gap-8">
    <div class="flex flex-col gap-2">
      <label for="size" class="text-sm font-bold uppercase tracking-[0.12em] text-ink">Finished size</label>
      <div class="relative">
        <select id="size" name="size" aria-describedby="size-hint" class="min-h-12 w-full cursor-pointer appearance-none border-2 border-ink bg-surface pl-3 pr-12 text-base text-ink focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-dashed focus-visible:outline-ink">
          <option>A6, folded from A4</option>
          <option selected>A5, folded from A4</option>
          <option>A4, folded from A3</option>
          <option>A3 poster, flat</option>
        </select>
        <svg aria-hidden="true" viewBox="0 0 16 12" class="pointer-events-none absolute right-4 top-1/2 h-3 w-4 -translate-y-1/2 fill-ink"><path d="M0.6 1.2 15.4 0.4 8.4 11.6Z"/></svg>
      </div>
      <p id="size-hint" class="text-sm text-muted">A5 is our most printed size. It fits a coat pocket.</p>
    </div>

    <div class="flex flex-col gap-2">
      <label for="binding" class="text-sm font-bold uppercase tracking-[0.12em] text-ink">Binding</label>
      <div class="relative">
        <select id="binding" name="binding" aria-describedby="binding-hint" class="min-h-12 w-full cursor-pointer appearance-none border-2 border-ink bg-surface pl-3 pr-12 text-base text-ink focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-dashed focus-visible:outline-ink">
          <option selected>Two staples on the spine</option>
          <option>Folded, no staples</option>
          <option>Stab binding, black thread</option>
        </select>
        <svg aria-hidden="true" viewBox="0 0 16 12" class="pointer-events-none absolute right-4 top-1/2 h-3 w-4 -translate-y-1/2 fill-ink"><path d="M0.6 1.2 15.4 0.4 8.4 11.6Z"/></svg>
      </div>
      <p id="binding-hint" class="text-sm text-muted">Staples work up to 48 pages.</p>
    </div>
  </div>
  <!-- snippet:end -->
</body>
</html>
