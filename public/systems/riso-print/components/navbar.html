<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Riso Print / Navbar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,100..900&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
/* theme:start */
@custom-variant dark (&:where(.dark, .dark *));

@theme {
  --color-*: initial;
  --color-bg: #F4EFE4;
  --color-surface: #FBF8F1;
  --color-ink: #1B1A33;
  --color-muted: #5B5870;
  --color-line: #1B1A33;
  --color-blue: #2A4BCB;
  --color-pink: #FF48B0;
  --color-blue-ink: #FBF8F1;
  --color-pink-ink: #1B1A33;

  --font-display: "Anybody", ui-sans-serif, sans-serif;
  --font-body: "Courier Prime", ui-monospace, monospace;

  --text-*: initial;
  --text-xs: 0.75rem;
  --text-xs--line-height: 1.4;
  --text-sm: 0.875rem;
  --text-sm--line-height: 1.5;
  --text-base: 1rem;
  --text-base--line-height: 1.6;
  --text-lg: 1.5rem;
  --text-lg--line-height: 1.25;
  --text-xl: 2.25rem;
  --text-xl--line-height: 1.05;
  --text-2xl: 3.375rem;
  --text-2xl--line-height: 0.95;
  --text-display: 4.5rem;
  --text-display--line-height: 0.9;

  --radius-*: initial;
  --radius-full: 9999px;

  --shadow-*: initial;
}

@utility bg-halftone { background-image: radial-gradient(currentColor 1.1px, transparent 1.6px); background-size: 7px 7px; }

@layer base {
  .dark {
    --color-bg: #16151F;
    --color-surface: #1F1D2B;
    --color-ink: #F1ECDF;
    --color-muted: #B4AFC2;
    --color-line: #F1ECDF;
    --color-blue: #6F8CFF;
    --color-pink: #FF5DBA;
    --color-blue-ink: #16151F;
    --color-pink-ink: #16151F;
  }
  body {
    background: var(--color-bg);
    color: var(--color-ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
}
/* theme:end */
  </style>
</head>
<body class="p-6">
  <!-- snippet:start -->
  <div class="flex flex-col gap-10">
    <header class="relative border-2 border-ink bg-bg">
      <div class="flex min-h-16 items-center justify-between gap-4 px-3 md:px-5">
        <a href="#" class="inline-flex min-h-11 items-center focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-dashed focus-visible:outline-ink">
          <span class="relative pb-[2px] pr-[3px] font-display text-base font-black uppercase leading-none font-stretch-[130%] lg:text-lg lg:font-stretch-[145%]">
            <span aria-hidden="true" class="absolute left-[3px] top-[2px] whitespace-nowrap text-blue">Overprint Press</span>
            <span class="relative whitespace-nowrap text-ink">Overprint Press</span>
          </span>
        </a>
        <nav aria-label="Main" class="hidden md:block">
          <ul class="flex items-center gap-4 lg:gap-6">
            <li><a href="#" class="inline-flex min-h-11 items-center text-base text-ink underline-offset-4 hover:underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-dashed focus-visible:outline-ink">Zines</a></li>
            <li><a href="#" class="inline-flex min-h-11 items-center text-base text-ink underline-offset-4 hover:underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-dashed focus-visible:outline-ink">Price list</a></li>
            <li><a href="#" aria-current="page" class="inline-flex min-h-11 items-center text-base font-bold text-ink underline decoration-2 underline-offset-4 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-dashed focus-visible:outline-ink">Print fair</a></li>
          </ul>
        </nav>
        <a href="#" class="group relative pr-[3px] pb-[3px] hidden min-h-11 items-stretch justify-center text-base font-bold text-blue-ink focus-visible:outline-2 focus-visible:outline-offset-[6px] focus-visible:outline-dashed focus-visible:outline-ink md:inline-flex">
          <span aria-hidden="true" class="absolute bottom-0 left-[3px] right-0 top-[3px] bg-pink"></span>
          <span class="relative inline-flex flex-1 items-center justify-center px-5 bg-blue transition-transform duration-100 ease-out group-hover:translate-x-px group-hover:translate-y-px group-active:translate-x-[3px] group-active:translate-y-[3px] motion-reduce:transition-none">
            <span class="whitespace-nowrap"><span class="lg:hidden">Order</span><span class="hidden lg:inline">Order a print run</span></span>
          </span>
        </a>
        <details class="group md:hidden">
          <summary class="flex min-h-11 cursor-pointer list-none items-center gap-2 px-1 text-base font-bold text-ink focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-dashed focus-visible:outline-ink [&::-webkit-details-marker]:hidden">
            <span class="group-open:hidden">Menu</span><span class="hidden group-open:inline">Close</span>
            <svg aria-hidden="true" viewBox="0 0 16 12" class="h-3 w-4 fill-ink group-open:rotate-180"><path d="M0.6 1.2 15.4 0.4 8.4 11.6Z"/></svg>
          </summary>
          <div class="absolute inset-x-0 top-full z-10 flex flex-col gap-5 border-2 border-ink bg-bg p-4">
            <nav aria-label="Main, mobile">
              <ul class="flex flex-col border-t-2 border-ink">
                <li><a href="#" class="flex min-h-12 items-center border-b-2 border-ink text-base text-ink focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-dashed focus-visible:outline-ink">Zines</a></li>
                <li><a href="#" class="flex min-h-12 items-center border-b-2 border-ink text-base text-ink focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-dashed focus-visible:outline-ink">Price list</a></li>
                <li><a href="#" aria-current="page" class="flex min-h-12 items-center border-b-2 border-ink text-base font-bold text-ink focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-dashed focus-visible:outline-ink">Print fair</a></li>
              </ul>
            </nav>
            <a href="#" class="group relative pr-[3px] pb-[3px] inline-flex min-h-12 items-stretch justify-center text-base font-bold text-blue-ink focus-visible:outline-2 focus-visible:outline-offset-[6px] focus-visible:outline-dashed focus-visible:outline-ink">
              <span aria-hidden="true" class="absolute bottom-0 left-[3px] right-0 top-[3px] bg-pink"></span>
              <span class="relative inline-flex flex-1 items-center justify-center px-5 bg-blue transition-transform duration-100 ease-out group-hover:translate-x-px group-hover:translate-y-px group-active:translate-x-[3px] group-active:translate-y-[3px] motion-reduce:transition-none">
                <span>Order a print run</span>
              </span>
            </a>
          </div>
        </details>
      </div>
    </header>

    <section class="flex flex-col gap-3 md:hidden">
      <h2 class="text-xs font-bold uppercase tracking-[0.14em] text-muted">Mobile menu, open</h2>
      <div class="border-2 border-ink bg-bg">
        <div class="flex min-h-16 items-center justify-between gap-4 border-b-2 border-ink px-3">
          <span class="relative pb-[2px] pr-[3px] font-display text-base font-black uppercase leading-none font-stretch-[130%]">
            <span aria-hidden="true" class="absolute left-[3px] top-[2px] whitespace-nowrap text-blue">Overprint Press</span>
            <span class="relative whitespace-nowrap text-ink">Overprint Press</span>
          </span>
          <span class="flex min-h-11 items-center gap-2 px-1 text-base font-bold text-ink">Close<svg aria-hidden="true" viewBox="0 0 16 12" class="h-3 w-4 rotate-180 fill-ink"><path d="M0.6 1.2 15.4 0.4 8.4 11.6Z"/></svg></span>
        </div>
        <div class="flex flex-col gap-5 p-4">
          <ul class="flex flex-col border-t-2 border-ink">
            <li><a href="#" class="flex min-h-12 items-center border-b-2 border-ink text-base text-ink focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-dashed focus-visible:outline-ink">Zines</a></li>
            <li><a href="#" class="flex min-h-12 items-center border-b-2 border-ink text-base text-ink focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-dashed focus-visible:outline-ink">Price list</a></li>
            <li><a href="#" class="flex min-h-12 items-center border-b-2 border-ink text-base font-bold text-ink focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-dashed focus-visible:outline-ink">Print fair</a></li>
          </ul>
          <a href="#" class="group relative pr-[3px] pb-[3px] inline-flex min-h-12 items-stretch justify-center text-base font-bold text-blue-ink focus-visible:outline-2 focus-visible:outline-offset-[6px] focus-visible:outline-dashed focus-visible:outline-ink">
            <span aria-hidden="true" class="absolute bottom-0 left-[3px] right-0 top-[3px] bg-pink"></span>
            <span class="relative inline-flex flex-1 items-center justify-center px-5 bg-blue transition-transform duration-100 ease-out group-hover:translate-x-px group-hover:translate-y-px group-active:translate-x-[3px] group-active:translate-y-[3px] motion-reduce:transition-none">
              <span>Order a print run</span>
            </span>
          </a>
        </div>
      </div>
    </section>
  </div>
  <!-- snippet:end -->
</body>
</html>
