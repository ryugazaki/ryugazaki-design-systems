<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Riso Print / Button</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,100..900&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
/* theme:start */
@custom-variant dark (&:where(.dark, .dark *));

@theme {
  --color-*: initial;
  --color-bg: #F4EFE4;
  --color-surface: #FBF8F1;
  --color-ink: #1B1A33;
  --color-muted: #5B5870;
  --color-line: #1B1A33;
  --color-blue: #2A4BCB;
  --color-pink: #FF48B0;
  --color-blue-ink: #FBF8F1;
  --color-pink-ink: #1B1A33;

  --font-display: "Anybody", ui-sans-serif, sans-serif;
  --font-body: "Courier Prime", ui-monospace, monospace;

  --text-*: initial;
  --text-xs: 0.75rem;
  --text-xs--line-height: 1.4;
  --text-sm: 0.875rem;
  --text-sm--line-height: 1.5;
  --text-base: 1rem;
  --text-base--line-height: 1.6;
  --text-lg: 1.5rem;
  --text-lg--line-height: 1.25;
  --text-xl: 2.25rem;
  --text-xl--line-height: 1.05;
  --text-2xl: 3.375rem;
  --text-2xl--line-height: 0.95;
  --text-display: 4.5rem;
  --text-display--line-height: 0.9;

  --radius-*: initial;
  --radius-full: 9999px;

  --shadow-*: initial;
}

@utility bg-halftone { background-image: radial-gradient(currentColor 1.1px, transparent 1.6px); background-size: 7px 7px; }

@layer base {
  .dark {
    --color-bg: #16151F;
    --color-surface: #1F1D2B;
    --color-ink: #F1ECDF;
    --color-muted: #B4AFC2;
    --color-line: #F1ECDF;
    --color-blue: #6F8CFF;
    --color-pink: #FF5DBA;
    --color-blue-ink: #16151F;
    --color-pink-ink: #16151F;
  }
  body {
    background: var(--color-bg);
    color: var(--color-ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
}
/* theme:end */
  </style>
</head>
<body class="p-6">
  <!-- snippet:start -->
  <div class="flex max-w-2xl flex-col gap-10">
    <section class="flex flex-col gap-4">
      <h2 class="text-xs font-bold uppercase tracking-[0.14em] text-muted">Variants</h2>
      <div class="flex flex-wrap items-center gap-x-5 gap-y-4">
        <button type="button" class="group relative pr-[3px] pb-[3px] inline-flex min-h-11 items-stretch justify-center text-base font-bold text-blue-ink focus-visible:outline-2 focus-visible:outline-offset-[6px] focus-visible:outline-dashed focus-visible:outline-ink">
          <span aria-hidden="true" class="absolute bottom-0 left-[3px] right-0 top-[3px] bg-pink"></span>
          <span class="relative inline-flex flex-1 items-center justify-center px-5 bg-blue transition-transform duration-100 ease-out group-hover:translate-x-px group-hover:translate-y-px group-active:translate-x-[3px] group-active:translate-y-[3px] motion-reduce:transition-none">
            <span>Order a print run</span>
          </span>
        </button>
        <button type="button" class="inline-flex min-h-11 items-center justify-center border-2 border-ink px-5 text-base font-bold text-ink transition-colors duration-100 hover:bg-ink hover:text-bg focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-dashed focus-visible:outline-ink motion-reduce:transition-none">
          Request a proof
        </button>
        <a href="#" class="inline-flex min-h-11 items-center px-1 text-base font-bold text-ink underline decoration-2 underline-offset-4 hover:decoration-blue focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-dashed focus-visible:outline-ink">
          See paper samples
        </a>
        <button type="button" class="inline-flex min-h-11 items-center justify-center gap-2.5 bg-ink px-5 text-base font-bold text-bg transition-colors duration-100 hover:bg-muted focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-dashed focus-visible:outline-ink motion-reduce:transition-none">
          <span aria-hidden="true" class="size-3 bg-pink"></span>
          Cancel this run
        </button>
      </div>
    </section>

    <section class="flex flex-col gap-4">
      <h2 class="text-xs font-bold uppercase tracking-[0.14em] text-muted">Sizes and icon</h2>
      <div class="flex flex-wrap items-center gap-x-5 gap-y-4">
        <button type="button" class="group inline-flex min-h-11 items-center justify-center focus-visible:outline-hidden">
          <span class="relative inline-flex h-10 items-stretch pb-[3px] pr-[3px] text-sm font-bold text-blue-ink group-focus-visible:outline-2 group-focus-visible:outline-offset-[6px] group-focus-visible:outline-dashed group-focus-visible:outline-ink">
            <span aria-hidden="true" class="absolute bottom-0 left-[3px] right-0 top-[3px] bg-pink"></span>
            <span class="relative inline-flex items-center bg-blue px-3 transition-transform duration-100 ease-out group-hover:translate-x-px group-hover:translate-y-px group-active:translate-x-[3px] group-active:translate-y-[3px] motion-reduce:transition-none">Small, add 50</span>
          </span>
        </button>
        <button type="button" class="group relative pr-[3px] pb-[3px] inline-flex min-h-11 items-stretch justify-center text-base font-bold text-blue-ink focus-visible:outline-2 focus-visible:outline-offset-[6px] focus-visible:outline-dashed focus-visible:outline-ink">
          <span aria-hidden="true" class="absolute bottom-0 left-[3px] right-0 top-[3px] bg-pink"></span>
          <span class="relative inline-flex flex-1 items-center justify-center px-5 bg-blue transition-transform duration-100 ease-out group-hover:translate-x-px group-hover:translate-y-px group-active:translate-x-[3px] group-active:translate-y-[3px] motion-reduce:transition-none">
            <span>Medium, add 100</span>
          </span>
        </button>
        <button type="button" class="inline-flex min-h-11 items-center justify-center gap-2.5 border-2 border-ink px-5 text-base font-bold text-ink hover:bg-ink hover:text-bg focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-dashed focus-visible:outline-ink">
          <svg aria-hidden="true" viewBox="0 0 20 20" class="size-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="miter"><path d="M5 7V2h10v5M5 14H2V7h16v7h-3"/><path d="M5 11h10v7H5z"/></svg>
          Print a test sheet
        </button>
      </div>
    </section>

    <section class="flex flex-col gap-4">
      <h2 class="text-xs font-bold uppercase tracking-[0.14em] text-muted">States</h2>
      <div class="flex flex-wrap items-start gap-x-6 gap-y-6">
        <div class="flex flex-col gap-3">
          <button type="button" class="group relative pr-[3px] pb-[3px] inline-flex min-h-11 items-stretch justify-center text-base font-bold text-blue-ink outline-2 outline-offset-[6px] outline-dashed outline-ink">
            <span aria-hidden="true" class="absolute bottom-0 left-[3px] right-0 top-[3px] bg-pink"></span>
            <span class="relative inline-flex flex-1 items-center justify-center px-5 bg-blue transition-transform duration-100 ease-out group-hover:translate-x-px group-hover:translate-y-px group-active:translate-x-[3px] group-active:translate-y-[3px] motion-reduce:transition-none">
              <span>Order a print run</span>
            </span>
          </button>
          <p class="text-xs text-muted">Focus visible, dashed ink outline</p>
        </div>
        <div class="flex flex-col gap-3">
          <button type="button" aria-busy="true" class="group relative pr-[3px] pb-[3px] inline-flex min-h-11 cursor-progress items-stretch justify-center text-base font-bold text-blue-ink focus-visible:outline-2 focus-visible:outline-offset-[6px] focus-visible:outline-dashed focus-visible:outline-ink">
            <span aria-hidden="true" class="absolute bottom-0 left-[3px] right-0 top-[3px] bg-pink"></span>
            <span class="relative inline-flex flex-1 items-center justify-center gap-2.5 px-5 bg-blue transition-transform duration-100 ease-out group-hover:translate-x-px group-hover:translate-y-px group-active:translate-x-[3px] group-active:translate-y-[3px] motion-reduce:transition-none">
              <svg aria-hidden="true" viewBox="0 0 20 20" class="size-5 animate-spin motion-reduce:animate-none" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M10 3a7 7 0 1 0 7 7"/></svg>
              <span>Saving</span>
            </span>
          </button>
          <p class="text-xs text-muted">Loading, keeps focus</p>
        </div>
        <div class="flex flex-col gap-3">
          <button type="button" disabled class="inline-flex min-h-11 cursor-not-allowed items-center justify-center border-2 border-dashed border-muted px-5 text-base font-bold text-muted">
            Order a print run
          </button>
          <p class="max-w-56 text-xs text-muted">Upload a print-ready PDF first.</p>
        </div>
      </div>
    </section>
  </div>
  <!-- snippet:end -->
</body>
</html>
