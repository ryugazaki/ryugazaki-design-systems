<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calm SaaS / Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fragment+Mono&family=Onest:wght@400;500;600;700&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
/* theme:start */
@custom-variant dark (&:where(.dark, .dark *));

@theme {
  --color-*: initial;
  --color-bg: #F6F5F2;
  --color-surface: #FFFFFF;
  --color-ink: #1C1B19;
  --color-muted: #6B6860;
  --color-line: #E4E1DA;
  --color-accent: #3F6B4E;
  --color-accent-ink: #FFFFFF;
  --color-accent-soft: #E3ECE5;
  --color-warning: #9A6700;
  --color-danger: #B42318;

  --font-display: "Onest", ui-sans-serif, sans-serif;
  --font-body: "Onest", ui-sans-serif, sans-serif;
  --font-mono: "Fragment Mono", ui-monospace, monospace;

  --text-*: initial;
  --text-xs: 0.75rem;
  --text-xs--line-height: 1.4;
  --text-sm: 0.8125rem;
  --text-sm--line-height: 1.45;
  --text-base: 0.875rem;
  --text-base--line-height: 1.55;
  --text-lg: 1.1875rem;
  --text-lg--line-height: 1.35;
  --text-xl: 1.5625rem;
  --text-xl--line-height: 1.2;
  --text-2xl: 2.0625rem;
  --text-2xl--line-height: 1.1;
  --text-display: 2.75rem;
  --text-display--line-height: 1.05;

  --radius-*: initial;
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 10px;
  --radius-full: 9999px;

  --shadow-*: initial;
  --shadow-pop: 0 1px 2px rgb(28 27 25 / 0.06), 0 8px 24px rgb(28 27 25 / 0.08);
}

@layer base {
  .dark {
    --color-bg: #141412;
    --color-surface: #1C1B19;
    --color-ink: #ECEAE4;
    --color-muted: #9C998F;
    --color-line: #2E2D29;
    --color-accent: #8DBB9A;
    --color-accent-ink: #141412;
    --color-accent-soft: #22302A;
    --color-warning: #E0B252;
    --color-danger: #F09A8F;
  }
  body {
    background: var(--color-bg);
    color: var(--color-ink);
    font-family: var(--font-body);
    font-size: var(--text-base);
    -webkit-font-smoothing: antialiased;
  }
}
/* theme:end */
  </style>
</head>
<body class="p-6">
  <!-- snippet:start -->
  <div class="flex max-w-md flex-col gap-4 tabular-nums">
    <article class="flex flex-col gap-3 rounded-lg border border-line bg-surface p-4">
      <header class="flex items-baseline justify-between gap-3">
        <h2 class="text-sm font-medium text-muted">Outstanding</h2>
        <p class="font-mono text-xs text-muted">Oct 1 to Oct 21</p>
      </header>
      <div class="flex items-end justify-between gap-4">
        <div class="flex min-w-0 flex-col gap-1">
          <p class="text-xl font-semibold tracking-tight text-ink tabular-nums md:text-2xl">
            <span class="text-base font-medium text-muted">$</span>48,210<span class="text-base font-medium text-muted">.40</span>
          </p>
          <p class="inline-flex items-center gap-1 text-sm text-ink tabular-nums">
            <svg aria-hidden="true" viewBox="0 0 12 12" class="size-3 text-muted" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10V2M2.5 5.5 6 2l3.5 3.5"/></svg>
            <span class="font-medium">12.4%</span>
            <span class="text-muted">vs September</span>
          </p>
        </div>
        <svg role="img" aria-label="Outstanding over 21 days, rising from 38,900 to 48,210" viewBox="0 0 96 32" class="h-8 w-24 shrink-0 text-muted" fill="none">
          <path d="M1 25 L10 24 L19 26 L28 21 L37 22 L46 18 L55 19 L64 14 L73 15 L82 9 L95 6" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
          <circle cx="95" cy="6" r="2" class="fill-ink"/>
        </svg>
      </div>
      <footer class="flex items-center justify-between gap-3 border-t border-line pt-3 text-sm">
        <span class="text-muted">14 open invoices</span>
        <span class="text-muted">3 overdue, <span class="font-mono text-warning">$6,980.00</span></span>
      </footer>
    </article>

    <article class="flex items-center justify-between gap-4 rounded-lg border border-line bg-surface px-4 py-3">
      <div class="flex flex-col">
        <h2 class="text-sm font-medium text-muted">Average days to pay</h2>
        <p class="text-lg font-semibold text-ink tabular-nums">18.2 <span class="text-sm font-normal text-muted">days</span></p>
      </div>
      <p class="inline-flex items-center gap-1 text-sm text-ink tabular-nums">
        <svg aria-hidden="true" viewBox="0 0 12 12" class="size-3 text-muted" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2v8M2.5 6.5 6 10l3.5-3.5"/></svg>
        <span class="font-medium">2.1</span>
        <span class="text-muted">faster</span>
      </p>
    </article>
  </div>
  <!-- snippet:end -->
</body>
</html>
