<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calm SaaS / Toast</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fragment+Mono&family=Onest:wght@400;500;600;700&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
/* theme:start */
@custom-variant dark (&:where(.dark, .dark *));

@theme {
  --color-*: initial;
  --color-bg: #F6F5F2;
  --color-surface: #FFFFFF;
  --color-ink: #1C1B19;
  --color-muted: #6B6860;
  --color-line: #E4E1DA;
  --color-accent: #3F6B4E;
  --color-accent-ink: #FFFFFF;
  --color-accent-soft: #E3ECE5;
  --color-warning: #9A6700;
  --color-danger: #B42318;

  --font-display: "Onest", ui-sans-serif, sans-serif;
  --font-body: "Onest", ui-sans-serif, sans-serif;
  --font-mono: "Fragment Mono", ui-monospace, monospace;

  --text-*: initial;
  --text-xs: 0.75rem;
  --text-xs--line-height: 1.4;
  --text-sm: 0.8125rem;
  --text-sm--line-height: 1.45;
  --text-base: 0.875rem;
  --text-base--line-height: 1.55;
  --text-lg: 1.1875rem;
  --text-lg--line-height: 1.35;
  --text-xl: 1.5625rem;
  --text-xl--line-height: 1.2;
  --text-2xl: 2.0625rem;
  --text-2xl--line-height: 1.1;
  --text-display: 2.75rem;
  --text-display--line-height: 1.05;

  --radius-*: initial;
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 10px;
  --radius-full: 9999px;

  --shadow-*: initial;
  --shadow-pop: 0 1px 2px rgb(28 27 25 / 0.06), 0 8px 24px rgb(28 27 25 / 0.08);
}

@layer base {
  .dark {
    --color-bg: #141412;
    --color-surface: #1C1B19;
    --color-ink: #ECEAE4;
    --color-muted: #9C998F;
    --color-line: #2E2D29;
    --color-accent: #8DBB9A;
    --color-accent-ink: #141412;
    --color-accent-soft: #22302A;
    --color-warning: #E0B252;
    --color-danger: #F09A8F;
  }
  body {
    background: var(--color-bg);
    color: var(--color-ink);
    font-family: var(--font-body);
    font-size: var(--text-base);
    -webkit-font-smoothing: antialiased;
  }
}
/* theme:end */
  </style>
</head>
<body class="p-6">
  <!-- snippet:start -->
  <!-- Static stack anchored bottom-left of a faux viewport. In an app this region is fixed to the bottom-left corner. -->
  <div class="flex min-h-72 flex-col justify-end gap-2 rounded-lg border border-dashed border-line p-3 tabular-nums">
    <div role="status" class="flex w-full max-w-sm items-center gap-1 rounded-md bg-ink py-0.5 pl-3 pr-0.5 text-sm text-bg shadow-pop dark:border dark:border-line dark:bg-surface dark:text-ink">
      <svg aria-hidden="true" viewBox="0 0 16 16" class="size-3.5 shrink-0 opacity-70" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3.5 8.5 3 3 6-7"/></svg>
      <p class="min-w-0 flex-1 pl-1">Payment recorded, <span class="font-mono">7,400.00</span></p>
      <button type="button" class="group inline-flex min-h-11 shrink-0 items-center focus-visible:outline-hidden">
        <span class="inline-flex h-7 items-center rounded-sm px-2 text-sm font-semibold underline decoration-1 underline-offset-4 group-hover:bg-bg/10 group-focus-visible:outline-2 group-focus-visible:outline-offset-1 group-focus-visible:outline-bg dark:text-accent dark:group-hover:bg-ink/5 dark:group-focus-visible:outline-accent">Undo</span>
      </button>
      <button type="button" aria-label="Dismiss" class="group inline-flex min-h-11 min-w-11 shrink-0 items-center justify-center focus-visible:outline-hidden">
        <span class="grid size-7 place-items-center rounded-sm opacity-70 group-hover:bg-bg/10 group-hover:opacity-100 group-focus-visible:opacity-100 group-focus-visible:outline-2 group-focus-visible:outline-offset-1 group-focus-visible:outline-bg dark:group-hover:bg-ink/5 dark:group-focus-visible:outline-accent">
          <svg aria-hidden="true" viewBox="0 0 16 16" class="size-3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="m4 4 8 8M12 4l-8 8"/></svg>
        </span>
      </button>
    </div>

    <div role="status" class="flex w-full max-w-sm items-center gap-1 rounded-md bg-ink py-0.5 pl-3 pr-0.5 text-sm text-bg shadow-pop dark:border dark:border-danger/40 dark:bg-surface dark:text-ink">
      <span aria-hidden="true" class="grid size-4 shrink-0 place-items-center rounded-sm border border-bg/50 font-mono text-xs leading-none dark:border-danger dark:text-danger">!</span>
      <p class="min-w-0 flex-1 pl-1">Reminder to Marlow Health not sent. Their email bounced.</p>
      <button type="button" class="group inline-flex min-h-11 shrink-0 items-center focus-visible:outline-hidden">
        <span class="inline-flex h-7 items-center rounded-sm px-2 text-sm font-semibold underline decoration-1 underline-offset-4 group-hover:bg-bg/10 group-focus-visible:outline-2 group-focus-visible:outline-offset-1 group-focus-visible:outline-bg dark:text-accent dark:group-hover:bg-ink/5 dark:group-focus-visible:outline-accent">Fix email</span>
      </button>
      <button type="button" aria-label="Dismiss" class="group inline-flex min-h-11 min-w-11 shrink-0 items-center justify-center focus-visible:outline-hidden">
        <span class="grid size-7 place-items-center rounded-sm opacity-70 group-hover:bg-bg/10 group-hover:opacity-100 group-focus-visible:opacity-100 group-focus-visible:outline-2 group-focus-visible:outline-offset-1 group-focus-visible:outline-bg dark:group-hover:bg-ink/5 dark:group-focus-visible:outline-accent">
          <svg aria-hidden="true" viewBox="0 0 16 16" class="size-3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="m4 4 8 8M12 4l-8 8"/></svg>
        </span>
      </button>
    </div>
  </div>
  <!-- snippet:end -->
</body>
</html>
