<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calm SaaS / Navbar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fragment+Mono&family=Onest:wght@400;500;600;700&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
/* theme:start */
@custom-variant dark (&:where(.dark, .dark *));

@theme {
  --color-*: initial;
  --color-bg: #F6F5F2;
  --color-surface: #FFFFFF;
  --color-ink: #1C1B19;
  --color-muted: #6B6860;
  --color-line: #E4E1DA;
  --color-accent: #3F6B4E;
  --color-accent-ink: #FFFFFF;
  --color-accent-soft: #E3ECE5;
  --color-warning: #9A6700;
  --color-danger: #B42318;

  --font-display: "Onest", ui-sans-serif, sans-serif;
  --font-body: "Onest", ui-sans-serif, sans-serif;
  --font-mono: "Fragment Mono", ui-monospace, monospace;

  --text-*: initial;
  --text-xs: 0.75rem;
  --text-xs--line-height: 1.4;
  --text-sm: 0.8125rem;
  --text-sm--line-height: 1.45;
  --text-base: 0.875rem;
  --text-base--line-height: 1.55;
  --text-lg: 1.1875rem;
  --text-lg--line-height: 1.35;
  --text-xl: 1.5625rem;
  --text-xl--line-height: 1.2;
  --text-2xl: 2.0625rem;
  --text-2xl--line-height: 1.1;
  --text-display: 2.75rem;
  --text-display--line-height: 1.05;

  --radius-*: initial;
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 10px;
  --radius-full: 9999px;

  --shadow-*: initial;
  --shadow-pop: 0 1px 2px rgb(28 27 25 / 0.06), 0 8px 24px rgb(28 27 25 / 0.08);
}

@layer base {
  .dark {
    --color-bg: #141412;
    --color-surface: #1C1B19;
    --color-ink: #ECEAE4;
    --color-muted: #9C998F;
    --color-line: #2E2D29;
    --color-accent: #8DBB9A;
    --color-accent-ink: #141412;
    --color-accent-soft: #22302A;
    --color-warning: #E0B252;
    --color-danger: #F09A8F;
  }
  body {
    background: var(--color-bg);
    color: var(--color-ink);
    font-family: var(--font-body);
    font-size: var(--text-base);
    -webkit-font-smoothing: antialiased;
  }
}
/* theme:end */
  </style>
</head>
<body class="p-6">
  <!-- snippet:start -->
  <header class="relative rounded-lg border border-line bg-surface">
    <div class="flex min-h-13 items-center gap-2 px-2 md:gap-4 md:px-3">
      <button type="button" aria-haspopup="menu" aria-expanded="false" class="group inline-flex min-h-11 min-w-0 items-center focus-visible:outline-hidden">
        <span class="inline-flex h-8 min-w-0 items-center gap-2 rounded-md px-1.5 transition-colors duration-150 group-hover:bg-bg group-focus-visible:outline-2 group-focus-visible:outline-offset-2 group-focus-visible:outline-accent">
          <span aria-hidden="true" class="grid size-6 shrink-0 place-items-center rounded-sm bg-ink text-xs font-semibold text-bg">F</span>
          <span class="flex min-w-0 flex-col items-start leading-tight">
            <span class="truncate text-sm font-semibold text-ink">Fieldnote Studio</span>
            <span class="hidden font-mono text-xs text-muted sm:block">Tally, Agency plan</span>
          </span>
          <svg aria-hidden="true" viewBox="0 0 12 12" class="size-3 shrink-0 text-muted" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 4.5 6 2l2.5 2.5M3.5 7.5 6 10l2.5-2.5"/></svg>
        </span>
      </button>

      <nav aria-label="Main" class="hidden md:block">
        <ul class="flex items-center">
          <li><a href="#" aria-current="page" class="group inline-flex min-h-11 items-center focus-visible:outline-hidden"><span class="inline-flex h-8 items-center rounded-md bg-accent-soft px-2.5 text-sm font-medium text-accent group-focus-visible:outline-2 group-focus-visible:outline-offset-2 group-focus-visible:outline-accent">Dashboard</span></a></li>
          <li><a href="#" class="group inline-flex min-h-11 items-center focus-visible:outline-hidden"><span class="inline-flex h-8 items-center rounded-md px-2.5 text-sm font-medium text-muted transition-colors duration-150 group-hover:bg-bg group-hover:text-ink group-focus-visible:outline-2 group-focus-visible:outline-offset-2 group-focus-visible:outline-accent">Invoices</span></a></li>
          <li><a href="#" class="group inline-flex min-h-11 items-center focus-visible:outline-hidden"><span class="inline-flex h-8 items-center rounded-md px-2.5 text-sm font-medium text-muted transition-colors duration-150 group-hover:bg-bg group-hover:text-ink group-focus-visible:outline-2 group-focus-visible:outline-offset-2 group-focus-visible:outline-accent">Clients</span></a></li>
          <li><a href="#" class="group inline-flex min-h-11 items-center focus-visible:outline-hidden"><span class="inline-flex h-8 items-center rounded-md px-2.5 text-sm font-medium text-muted transition-colors duration-150 group-hover:bg-bg group-hover:text-ink group-focus-visible:outline-2 group-focus-visible:outline-offset-2 group-focus-visible:outline-accent">Reports</span></a></li>
        </ul>
      </nav>

      <div class="ml-auto flex items-center gap-1 md:gap-2">
        <label class="relative hidden min-h-11 items-center lg:flex">
          <span class="sr-only">Search invoices and clients</span>
          <svg aria-hidden="true" viewBox="0 0 16 16" class="pointer-events-none absolute left-2.5 z-20 size-3.5 text-muted" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>
          <input type="search" placeholder="Search invoices, clients" class="peer relative z-10 h-11 w-64 bg-transparent pl-8 pr-12 text-sm text-ink placeholder:text-muted focus:outline-hidden">
          <span aria-hidden="true" class="pointer-events-none absolute inset-x-0 inset-y-1.5 rounded-md border border-line bg-bg peer-focus-visible:border-accent peer-focus-visible:bg-surface peer-focus-visible:outline-2 peer-focus-visible:outline-offset-1 peer-focus-visible:outline-accent/30"></span>
          <kbd class="pointer-events-none absolute right-2 z-20 rounded-sm border border-line bg-surface px-1 font-mono text-xs text-muted">/</kbd>
        </label>
        <button type="button" class="group hidden min-h-11 items-center focus-visible:outline-hidden sm:inline-flex">
          <span class="inline-flex h-8 items-center gap-1.5 rounded-md bg-accent pl-2 pr-3 text-sm font-medium text-accent-ink transition-colors duration-150 group-hover:bg-accent/90 group-focus-visible:outline-2 group-focus-visible:outline-offset-2 group-focus-visible:outline-accent">
            <svg aria-hidden="true" viewBox="0 0 16 16" class="size-3.5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>
            New invoice
          </span>
        </button>
        <a href="#" aria-label="Account, Mara Kesler" class="group inline-flex min-h-11 min-w-11 items-center justify-center focus-visible:outline-hidden">
          <span class="grid size-8 place-items-center rounded-md border border-line bg-bg text-xs font-semibold text-ink group-hover:border-muted/50 group-focus-visible:outline-2 group-focus-visible:outline-offset-2 group-focus-visible:outline-accent">MK</span>
        </a>
        <details class="group/menu md:hidden">
          <summary class="group inline-flex min-h-11 min-w-11 cursor-pointer list-none items-center justify-center focus-visible:outline-hidden [&::-webkit-details-marker]:hidden">
            <span class="sr-only">Menu</span>
            <span aria-hidden="true" class="grid size-8 place-items-center rounded-md border border-line text-ink group-hover:bg-bg group-focus-visible:outline-2 group-focus-visible:outline-offset-2 group-focus-visible:outline-accent group-open/menu:bg-bg">
              <svg viewBox="0 0 16 16" class="size-4 group-open/menu:hidden" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2.5 5h11M2.5 11h11"/></svg>
              <svg viewBox="0 0 16 16" class="hidden size-4 group-open/menu:block" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="m4 4 8 8M12 4l-8 8"/></svg>
            </span>
          </summary>
          <div class="absolute inset-x-0 top-full z-20 mt-1 rounded-lg border border-line bg-surface p-2 shadow-pop">
            <label class="relative flex min-h-11 items-center">
              <span class="sr-only">Search invoices and clients</span>
              <svg aria-hidden="true" viewBox="0 0 16 16" class="pointer-events-none absolute left-2.5 z-20 size-3.5 text-muted" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>
              <input type="search" placeholder="Search invoices, clients" class="peer relative z-10 h-11 w-full bg-transparent pl-8 pr-3 text-sm text-ink placeholder:text-muted focus:outline-hidden">
              <span aria-hidden="true" class="pointer-events-none absolute inset-x-0 inset-y-1 rounded-md border border-line bg-bg peer-focus-visible:border-accent peer-focus-visible:outline-2 peer-focus-visible:outline-offset-1 peer-focus-visible:outline-accent/30"></span>
            </label>
            <ul class="mt-1 flex flex-col">
              <li><a href="#" aria-current="page" class="flex min-h-11 items-center justify-between rounded-md bg-accent-soft px-3 text-sm font-medium text-accent focus-visible:outline-2 focus-visible:outline-offset-1 focus-visible:outline-accent">Dashboard</a></li>
              <li><a href="#" class="flex min-h-11 items-center justify-between rounded-md px-3 text-sm font-medium text-ink hover:bg-bg focus-visible:outline-2 focus-visible:outline-offset-1 focus-visible:outline-accent">Invoices <span class="font-mono text-xs text-muted tabular-nums">14 open</span></a></li>
              <li><a href="#" class="flex min-h-11 items-center rounded-md px-3 text-sm font-medium text-ink hover:bg-bg focus-visible:outline-2 focus-visible:outline-offset-1 focus-visible:outline-accent">Clients</a></li>
              <li><a href="#" class="flex min-h-11 items-center rounded-md px-3 text-sm font-medium text-ink hover:bg-bg focus-visible:outline-2 focus-visible:outline-offset-1 focus-visible:outline-accent">Reports</a></li>
            </ul>
            <div class="mt-2 border-t border-line pt-2 sm:hidden">
              <button type="button" class="flex min-h-11 w-full items-center justify-center rounded-md bg-accent px-3 text-sm font-medium text-accent-ink hover:bg-accent/90 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">New invoice</button>
            </div>
          </div>
        </details>
      </div>
    </div>
  </header>
  <div class="mt-3 h-64 md:h-24" aria-hidden="true"></div>
  <!-- snippet:end -->
</body>
</html>
