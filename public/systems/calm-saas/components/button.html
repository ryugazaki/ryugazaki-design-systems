<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calm SaaS / Button</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fragment+Mono&family=Onest:wght@400;500;600;700&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
/* theme:start */
@custom-variant dark (&:where(.dark, .dark *));

@theme {
  --color-*: initial;
  --color-bg: #F6F5F2;
  --color-surface: #FFFFFF;
  --color-ink: #1C1B19;
  --color-muted: #6B6860;
  --color-line: #E4E1DA;
  --color-accent: #3F6B4E;
  --color-accent-ink: #FFFFFF;
  --color-accent-soft: #E3ECE5;
  --color-warning: #9A6700;
  --color-danger: #B42318;

  --font-display: "Onest", ui-sans-serif, sans-serif;
  --font-body: "Onest", ui-sans-serif, sans-serif;
  --font-mono: "Fragment Mono", ui-monospace, monospace;

  --text-*: initial;
  --text-xs: 0.75rem;
  --text-xs--line-height: 1.4;
  --text-sm: 0.8125rem;
  --text-sm--line-height: 1.45;
  --text-base: 0.875rem;
  --text-base--line-height: 1.55;
  --text-lg: 1.1875rem;
  --text-lg--line-height: 1.35;
  --text-xl: 1.5625rem;
  --text-xl--line-height: 1.2;
  --text-2xl: 2.0625rem;
  --text-2xl--line-height: 1.1;
  --text-display: 2.75rem;
  --text-display--line-height: 1.05;

  --radius-*: initial;
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 10px;
  --radius-full: 9999px;

  --shadow-*: initial;
  --shadow-pop: 0 1px 2px rgb(28 27 25 / 0.06), 0 8px 24px rgb(28 27 25 / 0.08);
}

@layer base {
  .dark {
    --color-bg: #141412;
    --color-surface: #1C1B19;
    --color-ink: #ECEAE4;
    --color-muted: #9C998F;
    --color-line: #2E2D29;
    --color-accent: #8DBB9A;
    --color-accent-ink: #141412;
    --color-accent-soft: #22302A;
    --color-warning: #E0B252;
    --color-danger: #F09A8F;
  }
  body {
    background: var(--color-bg);
    color: var(--color-ink);
    font-family: var(--font-body);
    font-size: var(--text-base);
    -webkit-font-smoothing: antialiased;
  }
}
/* theme:end */
  </style>
</head>
<body class="p-6">
  <!-- snippet:start -->
  <!-- Every button is a 44px transparent hit area (min-h-11) around a 32px (sm) or 36px (md) drawn face. Focus is drawn on the face. -->
  <div class="flex max-w-xl flex-col gap-7 tabular-nums">
    <section class="flex flex-col gap-2">
      <h2 class="text-xs font-medium text-muted">Variants, md 36px</h2>
      <div class="flex flex-wrap items-center gap-x-2">
        <button type="button" class="group inline-flex min-h-11 items-center focus-visible:outline-hidden">
          <span class="inline-flex h-9 items-center rounded-md bg-accent px-3.5 text-sm font-medium text-accent-ink transition-colors duration-150 group-hover:bg-accent/90 group-active:bg-accent/80 group-focus-visible:outline-2 group-focus-visible:outline-offset-2 group-focus-visible:outline-accent">Send invoice</span>
        </button>
        <button type="button" class="group inline-flex min-h-11 items-center focus-visible:outline-hidden">
          <span class="inline-flex h-9 items-center rounded-md border border-line bg-surface px-3.5 text-sm font-medium text-ink transition-colors duration-150 group-hover:bg-bg group-active:bg-line/60 group-focus-visible:outline-2 group-focus-visible:outline-offset-2 group-focus-visible:outline-accent">Save draft</span>
        </button>
        <button type="button" class="group inline-flex min-h-11 items-center focus-visible:outline-hidden">
          <span class="inline-flex h-9 items-center rounded-md px-3 text-sm font-medium text-ink transition-colors duration-150 group-hover:bg-ink/5 group-active:bg-ink/10 group-focus-visible:outline-2 group-focus-visible:outline-offset-2 group-focus-visible:outline-accent">Preview PDF</span>
        </button>
        <button type="button" class="group inline-flex min-h-11 items-center focus-visible:outline-hidden">
          <span class="inline-flex h-9 items-center rounded-md border border-danger/40 bg-surface px-3.5 text-sm font-medium text-danger transition-colors duration-150 group-hover:bg-danger/5 group-active:bg-danger/10 group-focus-visible:outline-2 group-focus-visible:outline-offset-2 group-focus-visible:outline-danger">Void invoice</span>
        </button>
      </div>
      <p class="text-xs text-muted">One moss button per view. Destructive stays outlined so it never competes with it.</p>
    </section>

    <section class="flex flex-col gap-2">
      <h2 class="text-xs font-medium text-muted">Sizes and icon</h2>
      <div class="flex flex-wrap items-center gap-x-2">
        <button type="button" class="group inline-flex min-h-11 items-center focus-visible:outline-hidden">
          <span class="inline-flex h-8 items-center rounded-md border border-line bg-surface px-2.5 text-sm font-medium text-ink transition-colors duration-150 group-hover:bg-bg group-focus-visible:outline-2 group-focus-visible:outline-offset-2 group-focus-visible:outline-accent">Export, sm 32px</span>
        </button>
        <button type="button" class="group inline-flex min-h-11 items-center focus-visible:outline-hidden">
          <span class="inline-flex h-9 items-center rounded-md border border-line bg-surface px-3.5 text-sm font-medium text-ink transition-colors duration-150 group-hover:bg-bg group-focus-visible:outline-2 group-focus-visible:outline-offset-2 group-focus-visible:outline-accent">Export, md 36px</span>
        </button>
        <button type="button" class="group inline-flex min-h-11 items-center focus-visible:outline-hidden">
          <span class="inline-flex h-9 items-center gap-1.5 rounded-md border border-line bg-surface pl-2.5 pr-3.5 text-sm font-medium text-ink transition-colors duration-150 group-hover:bg-bg group-focus-visible:outline-2 group-focus-visible:outline-offset-2 group-focus-visible:outline-accent">
            <svg aria-hidden="true" viewBox="0 0 16 16" class="size-3.5 text-muted" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>
            New invoice
          </span>
        </button>
      </div>
    </section>

    <section class="flex flex-col gap-2">
      <h2 class="text-xs font-medium text-muted">States</h2>
      <div class="flex flex-wrap items-start gap-x-4 gap-y-2">
        <div class="flex flex-col">
          <button type="button" class="group inline-flex min-h-11 items-center focus-visible:outline-hidden">
            <span class="inline-flex h-9 items-center rounded-md border border-line bg-surface px-3.5 text-sm font-medium text-ink outline-2 outline-offset-2 outline-accent">Save draft</span>
          </button>
          <p class="text-xs text-muted">Focus visible, shown statically</p>
        </div>
        <div class="flex flex-col">
          <button type="button" aria-busy="true" class="inline-flex min-h-11 cursor-progress items-center">
            <span class="inline-flex h-9 items-center gap-2 rounded-md bg-accent px-3.5 text-sm font-medium text-accent-ink">
              <svg aria-hidden="true" viewBox="0 0 16 16" class="size-3.5 animate-spin motion-reduce:animate-none" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="8" cy="8" r="6" opacity=".3"/><path d="M14 8a6 6 0 0 0-6-6"/></svg>
              Saving
            </span>
          </button>
          <p class="text-xs text-muted">Loading</p>
        </div>
        <div class="flex flex-col">
          <button type="button" disabled aria-describedby="send-reason" class="inline-flex min-h-11 cursor-not-allowed items-center">
            <span class="inline-flex h-9 items-center rounded-md border border-line bg-bg px-3.5 text-sm font-medium text-muted">Send invoice</span>
          </button>
          <p id="send-reason" class="text-xs text-muted">Add a billing email for Harbor and Pine first.</p>
        </div>
      </div>
    </section>
  </div>
  <!-- snippet:end -->
</body>
</html>
