<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calm SaaS / Empty state</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fragment+Mono&family=Onest:wght@400;500;600;700&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
/* theme:start */
@custom-variant dark (&:where(.dark, .dark *));

@theme {
  --color-*: initial;
  --color-bg: #F6F5F2;
  --color-surface: #FFFFFF;
  --color-ink: #1C1B19;
  --color-muted: #6B6860;
  --color-line: #E4E1DA;
  --color-accent: #3F6B4E;
  --color-accent-ink: #FFFFFF;
  --color-accent-soft: #E3ECE5;
  --color-warning: #9A6700;
  --color-danger: #B42318;

  --font-display: "Onest", ui-sans-serif, sans-serif;
  --font-body: "Onest", ui-sans-serif, sans-serif;
  --font-mono: "Fragment Mono", ui-monospace, monospace;

  --text-*: initial;
  --text-xs: 0.75rem;
  --text-xs--line-height: 1.4;
  --text-sm: 0.8125rem;
  --text-sm--line-height: 1.45;
  --text-base: 0.875rem;
  --text-base--line-height: 1.55;
  --text-lg: 1.1875rem;
  --text-lg--line-height: 1.35;
  --text-xl: 1.5625rem;
  --text-xl--line-height: 1.2;
  --text-2xl: 2.0625rem;
  --text-2xl--line-height: 1.1;
  --text-display: 2.75rem;
  --text-display--line-height: 1.05;

  --radius-*: initial;
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 10px;
  --radius-full: 9999px;

  --shadow-*: initial;
  --shadow-pop: 0 1px 2px rgb(28 27 25 / 0.06), 0 8px 24px rgb(28 27 25 / 0.08);
}

@layer base {
  .dark {
    --color-bg: #141412;
    --color-surface: #1C1B19;
    --color-ink: #ECEAE4;
    --color-muted: #9C998F;
    --color-line: #2E2D29;
    --color-accent: #8DBB9A;
    --color-accent-ink: #141412;
    --color-accent-soft: #22302A;
    --color-warning: #E0B252;
    --color-danger: #F09A8F;
  }
  body {
    background: var(--color-bg);
    color: var(--color-ink);
    font-family: var(--font-body);
    font-size: var(--text-base);
    -webkit-font-smoothing: antialiased;
  }
}
/* theme:end */
  </style>
</head>
<body class="p-6">
  <!-- snippet:start -->
  <section aria-labelledby="client-inv-title" class="overflow-hidden rounded-lg border border-line bg-surface tabular-nums">
    <header class="flex items-baseline justify-between gap-3 border-b border-line px-4 py-3">
      <h2 id="client-inv-title" class="text-base font-semibold text-ink">Kettle Coffee Roasters</h2>
      <p class="font-mono text-xs text-muted">0 invoices</p>
    </header>
    <div class="overflow-x-auto">
      <div class="grid min-w-[520px] grid-cols-[6rem_1fr_5rem_6rem_5.5rem] gap-3 border-b border-line bg-bg px-4 py-2 text-xs font-medium text-muted" aria-hidden="true">
        <span>Invoice</span><span>Description</span><span>Due</span><span class="text-right">Amount</span><span>Status</span>
      </div>
    </div>
    <div class="flex flex-col items-start gap-3 px-4 py-10 md:items-center md:py-14 md:text-center">
      <div aria-hidden="true" class="flex w-40 flex-col gap-1.5 md:items-center">
        <span class="h-1.5 w-full rounded-[2px] bg-line"></span>
        <span class="h-1.5 w-2/3 rounded-[2px] bg-line"></span>
      </div>
      <h3 class="text-lg font-semibold text-ink">No invoices for this client yet</h3>
      <p class="max-w-sm text-base text-muted">Invoices you send to Kettle Coffee Roasters show up here with their status and due date.</p>
      <div class="flex flex-wrap items-center gap-x-3">
        <button type="button" class="group inline-flex min-h-11 items-center focus-visible:outline-hidden">
          <span class="inline-flex h-9 items-center gap-1.5 rounded-md bg-accent pl-2.5 pr-3.5 text-sm font-medium text-accent-ink transition-colors duration-150 group-hover:bg-accent/90 group-focus-visible:outline-2 group-focus-visible:outline-offset-2 group-focus-visible:outline-accent">
            <svg aria-hidden="true" viewBox="0 0 16 16" class="size-3.5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>
            Create first invoice
          </span>
        </button>
        <a href="#" class="inline-flex min-h-11 items-center rounded-md px-1 text-sm font-medium text-ink underline decoration-line decoration-1 underline-offset-4 hover:decoration-ink focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">Import from a CSV</a>
      </div>
    </div>
  </section>
  <!-- snippet:end -->
</body>
</html>
