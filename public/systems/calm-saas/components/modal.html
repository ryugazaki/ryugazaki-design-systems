<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calm SaaS / Modal and sheet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fragment+Mono&family=Onest:wght@400;500;600;700&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
/* theme:start */
@custom-variant dark (&:where(.dark, .dark *));

@theme {
  --color-*: initial;
  --color-bg: #F6F5F2;
  --color-surface: #FFFFFF;
  --color-ink: #1C1B19;
  --color-muted: #6B6860;
  --color-line: #E4E1DA;
  --color-accent: #3F6B4E;
  --color-accent-ink: #FFFFFF;
  --color-accent-soft: #E3ECE5;
  --color-warning: #9A6700;
  --color-danger: #B42318;

  --font-display: "Onest", ui-sans-serif, sans-serif;
  --font-body: "Onest", ui-sans-serif, sans-serif;
  --font-mono: "Fragment Mono", ui-monospace, monospace;

  --text-*: initial;
  --text-xs: 0.75rem;
  --text-xs--line-height: 1.4;
  --text-sm: 0.8125rem;
  --text-sm--line-height: 1.45;
  --text-base: 0.875rem;
  --text-base--line-height: 1.55;
  --text-lg: 1.1875rem;
  --text-lg--line-height: 1.35;
  --text-xl: 1.5625rem;
  --text-xl--line-height: 1.2;
  --text-2xl: 2.0625rem;
  --text-2xl--line-height: 1.1;
  --text-display: 2.75rem;
  --text-display--line-height: 1.05;

  --radius-*: initial;
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 10px;
  --radius-full: 9999px;

  --shadow-*: initial;
  --shadow-pop: 0 1px 2px rgb(28 27 25 / 0.06), 0 8px 24px rgb(28 27 25 / 0.08);
}

@layer base {
  .dark {
    --color-bg: #141412;
    --color-surface: #1C1B19;
    --color-ink: #ECEAE4;
    --color-muted: #9C998F;
    --color-line: #2E2D29;
    --color-accent: #8DBB9A;
    --color-accent-ink: #141412;
    --color-accent-soft: #22302A;
    --color-warning: #E0B252;
    --color-danger: #F09A8F;
  }
  body {
    background: var(--color-bg);
    color: var(--color-ink);
    font-family: var(--font-body);
    font-size: var(--text-base);
    -webkit-font-smoothing: antialiased;
  }
}
/* theme:end */
  </style>
</head>
<body class="p-6">
  <!-- snippet:start -->
  <div class="flex min-h-[480px] flex-col justify-end overflow-hidden rounded-lg bg-ink/35 px-0 pt-16 tabular-nums dark:bg-bg/80 md:items-center md:justify-center md:px-6 md:py-12">
    <div role="dialog" aria-modal="true" aria-labelledby="record-title" aria-describedby="record-desc" class="flex w-full flex-col rounded-t-lg border border-line bg-surface shadow-pop md:max-w-md md:rounded-lg">
      <header class="flex items-start justify-between gap-3 border-b border-line py-1 pl-4 pr-1">
        <div class="flex flex-col py-2">
          <h2 id="record-title" class="text-base font-semibold text-ink">Record a payment</h2>
          <p id="record-desc" class="text-sm text-muted"><span class="font-mono">INV-2039</span>, Okafor Architects, <span class="font-mono">7,400.00</span> due</p>
        </div>
        <button type="button" aria-label="Close" class="group inline-flex min-h-11 min-w-11 items-center justify-center focus-visible:outline-hidden">
          <span class="grid size-7 place-items-center rounded-md text-muted transition-colors duration-150 group-hover:bg-bg group-hover:text-ink group-focus-visible:outline-2 group-focus-visible:outline-offset-1 group-focus-visible:outline-accent">
            <svg aria-hidden="true" viewBox="0 0 16 16" class="size-3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="m4 4 8 8M12 4l-8 8"/></svg>
          </span>
        </button>
      </header>

      <form class="flex flex-col gap-4 px-4 py-4" action="#">
        <div class="grid grid-cols-2 gap-3">
          <div class="flex flex-col gap-1">
            <label for="paid-amount" class="text-sm font-medium text-ink">Amount received</label>
            <div class="relative">
              <input id="paid-amount" type="text" inputmode="decimal" value="7,400.00" class="peer relative z-10 block h-11 w-full bg-transparent px-3 text-right font-mono text-sm text-ink tabular-nums focus:outline-hidden">
              <span aria-hidden="true" class="pointer-events-none absolute inset-x-0 inset-y-1 rounded-md border border-line bg-surface peer-focus-visible:border-accent peer-focus-visible:outline-2 peer-focus-visible:outline-offset-1 peer-focus-visible:outline-accent/30"></span>
            </div>
          </div>
          <div class="flex flex-col gap-1">
            <label for="paid-date" class="text-sm font-medium text-ink">Received on</label>
            <div class="relative">
              <input id="paid-date" type="text" value="Oct 21, 2026" class="peer relative z-10 block h-11 w-full bg-transparent px-3 text-sm text-ink tabular-nums focus:outline-hidden">
              <span aria-hidden="true" class="pointer-events-none absolute inset-x-0 inset-y-1 rounded-md border border-line bg-surface peer-focus-visible:border-accent peer-focus-visible:outline-2 peer-focus-visible:outline-offset-1 peer-focus-visible:outline-accent/30"></span>
            </div>
          </div>
        </div>
        <div class="flex flex-col gap-1">
          <label for="paid-method" class="text-sm font-medium text-ink">Method</label>
          <div class="relative">
            <select id="paid-method" class="peer relative z-10 block h-11 w-full cursor-pointer appearance-none bg-transparent pl-3 pr-9 text-sm text-ink focus:outline-hidden">
              <option selected>Bank transfer</option>
              <option>Card</option>
              <option>Check</option>
            </select>
            <span aria-hidden="true" class="pointer-events-none absolute inset-x-0 inset-y-1 rounded-md border border-line bg-surface peer-focus-visible:border-accent peer-focus-visible:outline-2 peer-focus-visible:outline-offset-1 peer-focus-visible:outline-accent/30"></span>
            <svg aria-hidden="true" viewBox="0 0 12 12" class="pointer-events-none absolute right-3 top-1/2 z-20 size-3 -translate-y-1/2 text-muted" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5 6 7.5l3-3"/></svg>
          </div>
        </div>
        <dl class="flex items-center justify-between rounded-md bg-bg px-3 py-2 text-sm">
          <dt class="text-muted">Balance after this payment</dt>
          <dd class="font-mono text-ink tabular-nums">0.00</dd>
        </dl>
      </form>

      <footer class="flex items-center justify-end gap-1 border-t border-line px-3 py-1">
        <button type="button" class="group inline-flex min-h-11 items-center focus-visible:outline-hidden">
          <span class="inline-flex h-9 items-center rounded-md px-3 text-sm font-medium text-ink transition-colors duration-150 group-hover:bg-ink/5 group-focus-visible:outline-2 group-focus-visible:outline-offset-2 group-focus-visible:outline-accent">Cancel</span>
        </button>
        <button type="submit" class="group inline-flex min-h-11 items-center focus-visible:outline-hidden">
          <span class="inline-flex h-9 items-center rounded-md bg-accent px-3.5 text-sm font-medium text-accent-ink transition-colors duration-150 group-hover:bg-accent/90 group-focus-visible:outline-2 group-focus-visible:outline-offset-2 group-focus-visible:outline-accent">Record payment</span>
        </button>
      </footer>
    </div>
  </div>
  <!-- snippet:end -->
</body>
</html>
