<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Organic Warm / Checkbox and toggle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Young+Serif&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
/* theme:start */
@custom-variant dark (&:where(.dark, .dark *));

@theme {
  --color-*: initial;
  --color-bg: #F3EBDD;
  --color-surface: #FBF6EC;
  --color-ink: #3A2A20;
  --color-muted: #7A6656;
  --color-line: #DCCDB5;
  --color-accent: #B5532F;
  --color-accent-ink: #FBF6EC;
  --color-olive: #5E6B3A;
  --color-danger: #A3341F;

  --font-display: "Young Serif", ui-serif, Georgia, serif;
  --font-body: "Instrument Sans", ui-sans-serif, sans-serif;

  --text-*: initial;
  --text-xs: 0.8125rem;
  --text-xs--line-height: 1.45;
  --text-sm: 0.9375rem;
  --text-sm--line-height: 1.5;
  --text-base: 1.0625rem;
  --text-base--line-height: 1.6;
  --text-lg: 1.4375rem;
  --text-lg--line-height: 1.3;
  --text-xl: 1.875rem;
  --text-xl--line-height: 1.2;
  --text-2xl: 2.5rem;
  --text-2xl--line-height: 1.1;
  --text-display: 3.5rem;
  --text-display--line-height: 1.02;

  --radius-*: initial;
  --radius-sm: 12px;
  --radius-md: 20px;
  --radius-lg: 28px;
  --radius-arch: 999px 999px 28px 28px;
  --radius-full: 9999px;

  --shadow-*: initial;
  --shadow-soft: 0 12px 32px -12px rgb(58 42 32 / 0.25);
}

@layer base {
  .dark {
    --color-bg: #1E1712;
    --color-surface: #2A2019;
    --color-ink: #F1E6D4;
    --color-muted: #BFA98F;
    --color-line: #45372B;
    --color-accent: #E07A4F;
    --color-accent-ink: #1E1712;
    --color-olive: #A5B27A;
    --color-danger: #F08E76;
  }
  body {
    background: var(--color-bg);
    color: var(--color-ink);
    font-family: var(--font-body);
    font-size: var(--text-base);
    -webkit-font-smoothing: antialiased;
  }
}
/* theme:end */
  </style>
</head>
<body class="p-6">
  <!-- snippet:start -->
  <div class="flex max-w-md flex-col gap-10">
    <fieldset class="flex flex-col gap-1">
      <legend class="mb-2 font-display text-lg text-ink">Add to your booking</legend>
      <label class="group flex min-h-11 cursor-pointer items-center gap-3 rounded-sm py-1">
        <span class="relative grid size-6 shrink-0 place-items-center">
          <input type="checkbox" checked class="peer size-6 cursor-pointer appearance-none rounded-[6px] border-[1.5px] border-muted/80 bg-surface transition-colors duration-150 checked:border-accent checked:bg-accent group-hover:border-ink checked:group-hover:border-accent focus-visible:outline-2 focus-visible:outline-offset-[3px] focus-visible:outline-olive motion-reduce:transition-none">
          <svg aria-hidden="true" viewBox="0 0 20 20" class="pointer-events-none absolute hidden size-4 text-accent-ink peer-checked:block" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 10.5c1.6 1.2 2.8 2.6 3.6 4 2-4.2 4.5-7.2 7.6-9"/></svg>
        </span>
        <span class="text-ink">Apron and towel hire <span class="text-muted">$4</span></span>
      </label>
      <label class="group flex min-h-11 cursor-pointer items-center gap-3 rounded-sm py-1">
        <span class="relative grid size-6 shrink-0 place-items-center">
          <input type="checkbox" class="peer size-6 cursor-pointer appearance-none rounded-[6px] border-[1.5px] border-muted/80 bg-surface transition-colors duration-150 checked:border-accent checked:bg-accent group-hover:border-ink checked:group-hover:border-accent focus-visible:outline-2 focus-visible:outline-offset-[3px] focus-visible:outline-olive motion-reduce:transition-none">
          <svg aria-hidden="true" viewBox="0 0 20 20" class="pointer-events-none absolute hidden size-4 text-accent-ink peer-checked:block" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 10.5c1.6 1.2 2.8 2.6 3.6 4 2-4.2 4.5-7.2 7.6-9"/></svg>
        </span>
        <span class="text-ink">Ship my finished pieces <span class="text-muted">$12</span></span>
      </label>
      <label class="flex min-h-11 items-center gap-3 rounded-sm py-1">
        <span class="relative grid size-6 shrink-0 place-items-center">
          <input type="checkbox" checked disabled class="peer size-6 cursor-not-allowed appearance-none rounded-[6px] border-[1.5px] border-line bg-line">
          <svg aria-hidden="true" viewBox="0 0 20 20" class="pointer-events-none absolute hidden size-4 text-muted peer-checked:block" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 10.5c1.6 1.2 2.8 2.6 3.6 4 2-4.2 4.5-7.2 7.6-9"/></svg>
        </span>
        <span class="text-muted">Clay and two firings, always included</span>
      </label>
    </fieldset>

    <section class="flex flex-col gap-4">
      <h2 class="font-display text-lg text-ink">Reminders</h2>
      <div class="flex items-center justify-between gap-4">
        <div class="flex flex-col">
          <span id="sw-firing-label" class="text-ink">Text me when my pieces leave the kiln</span>
          <span class="text-sm text-muted">On</span>
        </div>
        <button type="button" role="switch" aria-checked="true" aria-labelledby="sw-firing-label" class="group relative inline-flex h-11 w-[4.5rem] shrink-0 cursor-pointer items-center rounded-full bg-olive p-1.5 transition-colors duration-200 focus-visible:outline-2 focus-visible:outline-offset-[3px] focus-visible:outline-olive motion-reduce:transition-none">
          <span aria-hidden="true" class="size-8 translate-x-[1.75rem] rounded-full bg-surface transition-transform duration-200 motion-reduce:transition-none"></span>
        </button>
      </div>
      <div class="flex items-center justify-between gap-4">
        <div class="flex flex-col">
          <span id="sw-news-label" class="text-ink">Monthly studio letter</span>
          <span class="text-sm text-muted">Off</span>
        </div>
        <button type="button" role="switch" aria-checked="false" aria-labelledby="sw-news-label" class="group relative inline-flex h-11 w-[4.5rem] shrink-0 cursor-pointer items-center rounded-full border-[1.5px] border-muted/80 bg-surface p-1 transition-colors duration-200 hover:border-ink focus-visible:outline-2 focus-visible:outline-offset-[3px] focus-visible:outline-olive motion-reduce:transition-none">
          <span aria-hidden="true" class="size-8 rounded-full bg-muted transition-transform duration-200 motion-reduce:transition-none"></span>
        </button>
      </div>
    </section>
  </div>
  <!-- snippet:end -->
</body>
</html>
