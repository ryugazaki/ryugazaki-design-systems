<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Organic Warm / Navbar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Young+Serif&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
/* theme:start */
@custom-variant dark (&:where(.dark, .dark *));

@theme {
  --color-*: initial;
  --color-bg: #F3EBDD;
  --color-surface: #FBF6EC;
  --color-ink: #3A2A20;
  --color-muted: #7A6656;
  --color-line: #DCCDB5;
  --color-accent: #B5532F;
  --color-accent-ink: #FBF6EC;
  --color-olive: #5E6B3A;
  --color-danger: #A3341F;

  --font-display: "Young Serif", ui-serif, Georgia, serif;
  --font-body: "Instrument Sans", ui-sans-serif, sans-serif;

  --text-*: initial;
  --text-xs: 0.8125rem;
  --text-xs--line-height: 1.45;
  --text-sm: 0.9375rem;
  --text-sm--line-height: 1.5;
  --text-base: 1.0625rem;
  --text-base--line-height: 1.6;
  --text-lg: 1.4375rem;
  --text-lg--line-height: 1.3;
  --text-xl: 1.875rem;
  --text-xl--line-height: 1.2;
  --text-2xl: 2.5rem;
  --text-2xl--line-height: 1.1;
  --text-display: 3.5rem;
  --text-display--line-height: 1.02;

  --radius-*: initial;
  --radius-sm: 12px;
  --radius-md: 20px;
  --radius-lg: 28px;
  --radius-arch: 999px 999px 28px 28px;
  --radius-full: 9999px;

  --shadow-*: initial;
  --shadow-soft: 0 12px 32px -12px rgb(58 42 32 / 0.25);
}

@layer base {
  .dark {
    --color-bg: #1E1712;
    --color-surface: #2A2019;
    --color-ink: #F1E6D4;
    --color-muted: #BFA98F;
    --color-line: #45372B;
    --color-accent: #E07A4F;
    --color-accent-ink: #1E1712;
    --color-olive: #A5B27A;
    --color-danger: #F08E76;
  }
  body {
    background: var(--color-bg);
    color: var(--color-ink);
    font-family: var(--font-body);
    font-size: var(--text-base);
    -webkit-font-smoothing: antialiased;
  }
}
/* theme:end */
  </style>
</head>
<body class="p-6">
  <!-- snippet:start -->
  <header class="relative rounded-lg bg-surface">
    <nav aria-label="Main" class="flex min-h-18 items-center justify-between gap-4 px-4 py-3 md:px-6">
      <a href="#" class="flex min-h-11 items-center gap-2.5 rounded-full pr-2 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-olive">
        <svg aria-hidden="true" viewBox="0 0 28 28" class="size-7 text-accent" fill="currentColor"><path d="M10 4h8v2c0 2 6 4 6 11a10 10 0 0 1-20 0c0-7 6-9 6-11z"/></svg>
        <span class="font-display text-xl text-ink">Slow Clay</span>
      </a>

      <ul class="hidden items-center gap-1 md:flex">
        <li><a href="#" aria-current="page" class="inline-flex min-h-11 items-center rounded-full px-4 font-medium text-ink underline decoration-accent decoration-2 underline-offset-[6px] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-olive">Classes</a></li>
        <li><a href="#" class="inline-flex min-h-11 items-center rounded-full px-4 font-medium text-ink hover:bg-ink/5 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-olive">Shop</a></li>
        <li><a href="#" class="inline-flex min-h-11 items-center rounded-full px-4 font-medium text-ink hover:bg-ink/5 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-olive">Studio</a></li>
        <li><a href="#" class="inline-flex min-h-11 items-center rounded-full px-4 font-medium text-ink hover:bg-ink/5 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-olive">Visit</a></li>
      </ul>

      <a href="#" class="hidden min-h-11 items-center rounded-full bg-accent px-5 font-medium text-accent-ink hover:ring-4 hover:ring-accent/25 focus-visible:outline-2 focus-visible:outline-offset-[3px] focus-visible:outline-olive md:inline-flex">Book a class</a>

      <details class="group md:hidden">
        <summary class="flex min-h-11 cursor-pointer list-none items-center gap-2 rounded-full border-[1.5px] border-ink px-4 font-medium text-ink focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-olive [&::-webkit-details-marker]:hidden">
          <span class="group-open:hidden">Menu</span>
          <span class="hidden group-open:inline">Close</span>
          <svg aria-hidden="true" viewBox="0 0 20 20" class="size-4 transition-transform duration-200 group-open:rotate-180 motion-reduce:transition-none" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M4.5 7.5c2 2.2 3.8 4 5.5 4s3.5-1.8 5.5-4"/></svg>
        </summary>
        <div class="absolute inset-x-0 top-full z-10 mt-2 rounded-lg bg-surface p-3 shadow-soft">
          <ul class="flex flex-col">
            <li><a href="#" aria-current="page" class="flex min-h-14 items-center justify-between rounded-md px-4 font-display text-lg text-ink bg-bg focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-olive">Classes <span aria-hidden="true" class="size-2 rounded-full bg-accent"></span></a></li>
            <li><a href="#" class="flex min-h-14 items-center rounded-md px-4 font-display text-lg text-ink hover:bg-bg focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-olive">Shop</a></li>
            <li><a href="#" class="flex min-h-14 items-center rounded-md px-4 font-display text-lg text-ink hover:bg-bg focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-olive">Studio</a></li>
            <li><a href="#" class="flex min-h-14 items-center rounded-md px-4 font-display text-lg text-ink hover:bg-bg focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-olive">Visit</a></li>
          </ul>
          <a href="#" class="mt-3 flex min-h-12 items-center justify-center rounded-full bg-accent px-5 font-medium text-accent-ink focus-visible:outline-2 focus-visible:outline-offset-[3px] focus-visible:outline-olive">Book a class</a>
        </div>
      </details>
    </nav>
  </header>
  <!-- snippet:end -->
</body>
</html>
