<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Organic Warm / Input</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Young+Serif&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
/* theme:start */
@custom-variant dark (&:where(.dark, .dark *));

@theme {
  --color-*: initial;
  --color-bg: #F3EBDD;
  --color-surface: #FBF6EC;
  --color-ink: #3A2A20;
  --color-muted: #7A6656;
  --color-line: #DCCDB5;
  --color-accent: #B5532F;
  --color-accent-ink: #FBF6EC;
  --color-olive: #5E6B3A;
  --color-danger: #A3341F;

  --font-display: "Young Serif", ui-serif, Georgia, serif;
  --font-body: "Instrument Sans", ui-sans-serif, sans-serif;

  --text-*: initial;
  --text-xs: 0.8125rem;
  --text-xs--line-height: 1.45;
  --text-sm: 0.9375rem;
  --text-sm--line-height: 1.5;
  --text-base: 1.0625rem;
  --text-base--line-height: 1.6;
  --text-lg: 1.4375rem;
  --text-lg--line-height: 1.3;
  --text-xl: 1.875rem;
  --text-xl--line-height: 1.2;
  --text-2xl: 2.5rem;
  --text-2xl--line-height: 1.1;
  --text-display: 3.5rem;
  --text-display--line-height: 1.02;

  --radius-*: initial;
  --radius-sm: 12px;
  --radius-md: 20px;
  --radius-lg: 28px;
  --radius-arch: 999px 999px 28px 28px;
  --radius-full: 9999px;

  --shadow-*: initial;
  --shadow-soft: 0 12px 32px -12px rgb(58 42 32 / 0.25);
}

@layer base {
  .dark {
    --color-bg: #1E1712;
    --color-surface: #2A2019;
    --color-ink: #F1E6D4;
    --color-muted: #BFA98F;
    --color-line: #45372B;
    --color-accent: #E07A4F;
    --color-accent-ink: #1E1712;
    --color-olive: #A5B27A;
    --color-danger: #F08E76;
  }
  body {
    background: var(--color-bg);
    color: var(--color-ink);
    font-family: var(--font-body);
    font-size: var(--text-base);
    -webkit-font-smoothing: antialiased;
  }
}
/* theme:end */
  </style>
</head>
<body class="p-6">
  <!-- snippet:start -->
  <div class="flex max-w-md flex-col gap-7">
    <div class="flex flex-col gap-2">
      <label for="in-name" class="font-medium text-ink">Your name</label>
      <input id="in-name" type="text" autocomplete="name" value="Ines Park" aria-describedby="in-name-hint" class="min-h-12 w-full rounded-md border-[1.5px] border-muted/80 bg-surface px-4 text-ink placeholder:text-muted transition-colors duration-200 hover:border-ink focus-visible:border-ink focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-olive motion-reduce:transition-none">
      <p id="in-name-hint" class="text-sm text-muted">We write it on the shelf tag for your pieces.</p>
    </div>

    <div class="flex flex-col gap-2">
      <label for="in-email" class="font-medium text-ink">Email</label>
      <input id="in-email" type="email" autocomplete="email" value="ines.park@" aria-invalid="true" aria-describedby="in-email-error" class="min-h-12 w-full rounded-md border-2 border-danger bg-surface px-4 text-ink focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-olive">
      <p id="in-email-error" class="flex items-start gap-2 text-sm text-danger">
        <svg aria-hidden="true" viewBox="0 0 20 20" class="mt-0.5 size-4 shrink-0" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="10" cy="10" r="7.5"/><path d="M10 6.5v4M10 13.5v.01"/></svg>
        This address is missing the part after the @. We send your booking and firing dates here.
      </p>
    </div>

    <div class="flex flex-col gap-2">
      <label for="in-notes" class="font-medium text-ink">Anything we should know?</label>
      <textarea id="in-notes" rows="4" aria-describedby="in-notes-hint" placeholder="Left-handed, first time on a wheel, a wrist that tires quickly" class="w-full resize-y rounded-md border-[1.5px] border-muted/80 bg-surface px-4 py-3 text-ink placeholder:text-muted hover:border-ink focus-visible:border-ink focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-olive"></textarea>
      <p id="in-notes-hint" class="text-sm text-muted">Only your teacher reads this.</p>
    </div>

    <div class="flex flex-col gap-2">
      <label for="in-code" class="font-medium text-muted">Gift code</label>
      <input id="in-code" type="text" disabled value="Not needed for this class" aria-describedby="in-code-hint" class="min-h-12 w-full cursor-not-allowed rounded-md border-[1.5px] border-dashed border-line bg-bg px-4 text-muted">
      <p id="in-code-hint" class="text-sm text-muted">Gift codes apply to courses of four sessions or more.</p>
    </div>
  </div>
  <!-- snippet:end -->
</body>
</html>
