<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Organic Warm / Select</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Young+Serif&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
/* theme:start */
@custom-variant dark (&:where(.dark, .dark *));

@theme {
  --color-*: initial;
  --color-bg: #F3EBDD;
  --color-surface: #FBF6EC;
  --color-ink: #3A2A20;
  --color-muted: #7A6656;
  --color-line: #DCCDB5;
  --color-accent: #B5532F;
  --color-accent-ink: #FBF6EC;
  --color-olive: #5E6B3A;
  --color-danger: #A3341F;

  --font-display: "Young Serif", ui-serif, Georgia, serif;
  --font-body: "Instrument Sans", ui-sans-serif, sans-serif;

  --text-*: initial;
  --text-xs: 0.8125rem;
  --text-xs--line-height: 1.45;
  --text-sm: 0.9375rem;
  --text-sm--line-height: 1.5;
  --text-base: 1.0625rem;
  --text-base--line-height: 1.6;
  --text-lg: 1.4375rem;
  --text-lg--line-height: 1.3;
  --text-xl: 1.875rem;
  --text-xl--line-height: 1.2;
  --text-2xl: 2.5rem;
  --text-2xl--line-height: 1.1;
  --text-display: 3.5rem;
  --text-display--line-height: 1.02;

  --radius-*: initial;
  --radius-sm: 12px;
  --radius-md: 20px;
  --radius-lg: 28px;
  --radius-arch: 999px 999px 28px 28px;
  --radius-full: 9999px;

  --shadow-*: initial;
  --shadow-soft: 0 12px 32px -12px rgb(58 42 32 / 0.25);
}

@layer base {
  .dark {
    --color-bg: #1E1712;
    --color-surface: #2A2019;
    --color-ink: #F1E6D4;
    --color-muted: #BFA98F;
    --color-line: #45372B;
    --color-accent: #E07A4F;
    --color-accent-ink: #1E1712;
    --color-olive: #A5B27A;
    --color-danger: #F08E76;
  }
  body {
    background: var(--color-bg);
    color: var(--color-ink);
    font-family: var(--font-body);
    font-size: var(--text-base);
    -webkit-font-smoothing: antialiased;
  }
}
/* theme:end */
  </style>
</head>
<body class="p-6">
  <!-- snippet:start -->
  <div class="flex max-w-sm flex-col gap-2">
    <label for="sel-class" class="font-medium text-ink">Class type</label>
    <div class="relative">
      <select id="sel-class" aria-describedby="sel-class-hint" class="min-h-12 w-full cursor-pointer appearance-none rounded-full border-[1.5px] border-muted/80 bg-surface py-2 pr-12 pl-5 text-ink transition-colors duration-200 hover:border-ink focus-visible:border-ink focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-olive motion-reduce:transition-none">
        <option>Wheel basics, 3 hours</option>
        <option>Hand-building, coil and slab, 2.5 hours</option>
        <option>Glaze lab, 2 hours</option>
        <option>Six-week wheel course</option>
      </select>
      <svg aria-hidden="true" viewBox="0 0 20 20" class="pointer-events-none absolute top-1/2 right-5 size-4 -translate-y-1/2 text-ink" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 7.5c2 2.2 3.8 4 5.5 4s3.5-1.8 5.5-4"/></svg>
    </div>
    <p id="sel-class-hint" class="px-1 text-sm text-muted">Not sure? Wheel basics is where most people start.</p>
  </div>
  <!-- snippet:end -->
</body>
</html>
